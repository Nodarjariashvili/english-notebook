    var form = el("form", {});
    var emailInput = el("input", { type: "email", autocomplete: "email", required: "required" });
    var passInput = el("input", { type: "password", autocomplete: mode === "login" ? "current-password" : "new-password", required: "required", minlength: "6" });
    form.appendChild(el("div", { class: "auth-gate-field" }, [el("label", {}, [document.createTextNode("ელფოსტა")]), emailInput]));
    form.appendChild(el("div", { class: "auth-gate-field" }, [el("label", {}, [document.createTextNode("პაროლი")]), attachPasswordToggle(passInput)]));

    var rememberInput = null;
    if (mode === "login") {
      rememberInput = el("input", { type: "checkbox" });
      rememberInput.checked = true;
      var rememberLabel = el("label", { class: "auth-gate-remember" }, [
        rememberInput, document.createTextNode("დამახსოვრება")
      ]);
      form.appendChild(rememberLabel);
    }

    var submitBtn = el("button", { class: "auth-gate-submit", type: "submit" }, [document.createTextNode(mode === "login" ? "შესვლა" : "რეგისტრაცია")]);
    form.appendChild(submitBtn);

    var msgBox = el("div", {});
    form.appendChild(msgBox);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = emailInput.value.trim();
      var password = passInput.value;
      if (!email || !password) return;
      submitBtn.setAttribute("disabled", "disabled");
      msgBox.innerHTML = "";

      try { localStorage.setItem(AUTH_REMEMBER_KEY, (rememberInput ? rememberInput.checked : true) ? "1" : "0"); } catch (e) {}

      var action = mode === "login"
        ? supabaseClient.auth.signInWithPassword({ email: email, password: password })
        : supabaseClient.auth.signUp({ email: email, password: password });

      action.then(function (res) {
        submitBtn.removeAttribute("disabled");
        if (res.error) {
          msgBox.appendChild(el("div", { class: "auth-gate-msg error" }, [document.createTextNode(res.error.message)]));
          return;
        }
        if (mode === "signup" && !res.data.session) {
          msgBox.appendChild(el("div", { class: "auth-gate-msg info" }, [
            document.createTextNode("რეგისტრაცია წარმატებულია — შეამოწმე ელფოსტა და დაადასტურე ანგარიში, შემდეგ შედი 'შესვლა' ტაბიდან.")
          ]));
          return;
        }
        /* session present -> onAuthStateChange fires showApp() automatically */
      }).catch(function (err) {
        submitBtn.removeAttribute("disabled");
        msgBox.appendChild(el("div", { class: "auth-gate-msg error" }, [document.createTextNode("კავშირის შეცდომა: " + err.message)]));
      });
    });

    card.appendChild(form);
    root.appendChild(card);
  }

  function signOutUser() {
    supabaseClient.auth.signOut();
  }

  /* ---------- admin panel (gated by ADMIN_EMAIL above -- reached via #admin once signed in) ---------- */
  function showAdminDirectly() {
    document.getElementById("notebook").style.display = "";
    var gateRoot = document.getElementById("auth-gate-root");
    gateRoot.style.display = "none";
    gateRoot.innerHTML = "";
    /* showApp() calls this again on every auth event (a refreshed token, the
       tab regaining focus). Rebuilding the view then would throw away a page
       reading that is in progress, so an already open admin view is left alone. */
    var adminView = document.getElementById("view-admin");
    if (adminView.classList.contains("active") && adminView.firstChild) return;
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    adminView.classList.add("active");
    renderAdminView();
  }

  if (!supabaseClient) {
    showLoadFailure();
  } else {
    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if (session && session.user) {
        showApp(session.user);
      } else {
        showGate("login");
      }
    });
  }

  /* ---------- theme ---------- */
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem("nonaEnglishNotebook.theme"); } catch (e) {}
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    document.getElementById("themeToggle").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var effectiveDark = cur ? cur === "dark" : prefersDark;
      var next = effectiveDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("nonaEnglishNotebook.theme", next); } catch (e) {}
    });
  }

  /* ---------- PWA service worker registration ---------- */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(function (err) {
      console.error("Service worker registration failed:", err.message);
    });
    /* a quiz notification was tapped while the app was already open */
    navigator.serviceWorker.addEventListener("message", function (event) {
      if (event.data && event.data.type === "open-quiz" && appStarted && currentAuthUser) openDailyQuiz();
    });
  }

})();
</script>

</body>
</html>
