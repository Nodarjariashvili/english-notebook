<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ჩემი ინგლისურის რვეული — Nono's English Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: oklch(96% 0.02 340);
    --paper-2: oklch(95% 0.025 30);
    --paper-rule: rgba(90, 40, 60, 0.08);
    --surface: #ffffff;
    --ink: oklch(28% 0.02 340);
    --ink-soft: oklch(49% 0.02 340);
    --ink-faint: oklch(65% 0.02 340);
    --green: oklch(62% 0.125 145);
    --green-ink: oklch(35% 0.06 145);
    --green-soft: oklch(89% 0.03 145);
    --gold: #ea7c1f;
    --gold-soft: #fdead4;
    --rust: #dc5b4a;
    --rust-soft: #fbe1dc;
    --info: oklch(70% 0.1 200);
    --info-soft: #dcf0fa;
    --violet: #9333ea;
    --violet-soft: #f1e4fe;
    --cyan: #0891b2;
    --cyan-soft: #d3f4f8;
    --accent-yellow: oklch(82% 0.15 80);
    --accent-orange: oklch(68% 0.19 40);
    --accent-pink: oklch(60% 0.22 350);
    --accent-purple: oklch(45% 0.2 305);
    --brand-gradient: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange), var(--accent-pink), var(--accent-purple));
    --brand: var(--accent-pink);
    --brand-ink: var(--accent-purple);
    --brand-soft: oklch(95% 0.025 340);
    --tab-bg: oklch(93% 0.03 345);
    --tab-bg-active: var(--surface);
    --border: rgba(90, 40, 60, 0.14);
    --shadow: oklch(40% 0.1 340 / 0.18);
    --focus: #2fa366;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: oklch(15% 0.03 340);
      --paper-2: oklch(13% 0.03 20);
      --paper-rule: rgba(245, 225, 235, 0.07);
      --surface: #221726;
      --ink: oklch(92% 0.02 340);
      --ink-soft: oklch(75% 0.02 340);
      --ink-faint: oklch(60% 0.02 340);
      --green: oklch(70% 0.13 145);
      --green-ink: oklch(85% 0.06 145);
      --green-soft: oklch(30% 0.04 145);
      --gold: #f2954b;
      --gold-soft: #3a2515;
      --rust: #e8796b;
      --rust-soft: #3a211d;
      --info: oklch(75% 0.09 200);
      --info-soft: #17323d;
      --violet: #c084fc;
      --violet-soft: #34205a;
      --cyan: #67e8f9;
      --cyan-soft: #113c42;
      --accent-yellow: oklch(85% 0.14 80);
      --accent-orange: oklch(72% 0.18 40);
      --accent-pink: oklch(68% 0.2 350);
      --accent-purple: oklch(62% 0.18 305);
      --brand-gradient: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange), var(--accent-pink), var(--accent-purple));
      --brand: var(--accent-pink);
      --brand-ink: oklch(85% 0.12 340);
      --brand-soft: oklch(26% 0.06 340);
      --tab-bg: #2a1a24;
      --tab-bg-active: var(--surface);
      --border: rgba(245, 225, 235, 0.14);
      --shadow: rgba(0, 0, 0, 0.45);
      --focus: #4fc786;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: oklch(15% 0.03 340);
    --paper-2: oklch(13% 0.03 20);
    --paper-rule: rgba(245, 225, 235, 0.07);
    --surface: #221726;
    --ink: oklch(92% 0.02 340);
    --ink-soft: oklch(75% 0.02 340);
    --ink-faint: oklch(60% 0.02 340);
    --green: oklch(70% 0.13 145);
    --green-ink: oklch(85% 0.06 145);
    --green-soft: oklch(30% 0.04 145);
    --gold: #f2954b;
    --gold-soft: #3a2515;
    --rust: #e8796b;
    --rust-soft: #3a211d;
    --info: oklch(75% 0.09 200);
    --info-soft: #17323d;
    --violet: #c084fc;
    --violet-soft: #34205a;
    --cyan: #67e8f9;
    --cyan-soft: #113c42;
    --accent-yellow: oklch(85% 0.14 80);
    --accent-orange: oklch(72% 0.18 40);
    --accent-pink: oklch(68% 0.2 350);
    --accent-purple: oklch(62% 0.18 305);
    --brand-gradient: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange), var(--accent-pink), var(--accent-purple));
    --brand: var(--accent-pink);
    --brand-ink: oklch(85% 0.12 340);
    --brand-soft: oklch(26% 0.06 340);
    --tab-bg: #2a1a24;
    --tab-bg-active: var(--surface);
    --border: rgba(245, 225, 235, 0.14);
    --shadow: rgba(0, 0, 0, 0.45);
    --focus: #4fc786;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --paper: oklch(96% 0.02 340);
    --paper-2: oklch(95% 0.025 30);
    --paper-rule: rgba(90, 40, 60, 0.08);
    --surface: #ffffff;
    --ink: oklch(28% 0.02 340);
    --ink-soft: oklch(49% 0.02 340);
    --ink-faint: oklch(65% 0.02 340);
    --green: oklch(62% 0.125 145);
    --green-ink: oklch(35% 0.06 145);
    --green-soft: oklch(89% 0.03 145);
    --gold: #ea7c1f;
    --gold-soft: #fdead4;
    --rust: #dc5b4a;
    --rust-soft: #fbe1dc;
    --info: oklch(70% 0.1 200);
    --info-soft: #dcf0fa;
    --violet: #9333ea;
    --violet-soft: #f1e4fe;
    --cyan: #0891b2;
    --cyan-soft: #d3f4f8;
    --accent-yellow: oklch(82% 0.15 80);
    --accent-orange: oklch(68% 0.19 40);
    --accent-pink: oklch(60% 0.22 350);
    --accent-purple: oklch(45% 0.2 305);
    --brand-gradient: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange), var(--accent-pink), var(--accent-purple));
    --brand: var(--accent-pink);
    --brand-ink: var(--accent-purple);
    --brand-soft: oklch(95% 0.025 340);
    --tab-bg: oklch(93% 0.03 345);
    --tab-bg-active: var(--surface);
    --border: rgba(90, 40, 60, 0.14);
    --shadow: oklch(40% 0.1 340 / 0.18);
    --focus: #2fa366;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    color: var(--ink);
    font-family: 'Nunito', 'Noto Sans Georgian', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--info); }
  a:hover { color: var(--brand-ink); }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(circle at 1px 1px, var(--paper-rule) 1px, transparent 0);
    background-size: 22px 22px;
    opacity: 0.5;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    inset: -40px;
    pointer-events: none;
    background:
      radial-gradient(680px circle at 92% -8%, var(--brand-soft) 0%, transparent 55%),
      radial-gradient(560px circle at -8% 12%, var(--gold-soft) 0%, transparent 50%),
      radial-gradient(520px circle at 100% 90%, var(--rust-soft) 0%, transparent 45%);
    opacity: 0.55;
    z-index: 0;
    animation: driftBlobs 18s ease-in-out infinite;
  }
  @keyframes driftBlobs {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-14px, 12px); }
  }

  h1, h2, h3, .display { font-family: 'Baloo 2', 'Noto Sans Georgian', Georgia, sans-serif; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
  .hand { font-family: 'Caveat', 'Segoe Script', cursive; font-weight: 600; }
  .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); font-weight: 600; }
  button { font-family: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .desk { position: relative; z-index: 1; min-height: 100vh; display: flex; justify-content: center; padding: clamp(12px, 3vw, 40px); }
  .notebook { width: 100%; display: flex; align-items: flex-start; }

  /* --- Tab rail --- */
  .tabs { display: flex; flex-direction: column; gap: 10px; padding-top: 54px; flex-shrink: 0; z-index: 2; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    background: var(--tab-bg); color: var(--ink-soft);
    border: 1px solid var(--border); border-right: none;
    padding: 11px 16px 11px 14px; font-size: 0.92rem; font-weight: 600;
    border-radius: 18px 0 0 18px; cursor: pointer; margin-right: -1px;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    box-shadow: -2px 2px 6px var(--shadow);
    writing-mode: horizontal-tb; white-space: nowrap;
  }
  .tab:hover { transform: translateX(-2px); }
  .tab.active { background: var(--tab-bg-active); color: var(--ink); transform: translateX(-6px); border-color: var(--border); }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
  .tab .dot[data-state="green"] { background: var(--green); }
  .tab .dot[data-state="gold"] { background: var(--gold); }
  .tab .dot[data-state="rust"] { background: var(--rust); }
  .tab-divider { height: 1px; background: var(--border); margin: 4px 10px 4px 0; }
  .tab-unit { font-size: 0.82rem; font-weight: 500; padding: 8px 14px 8px 12px; opacity: 0.88; }
  .tab-unit.active { opacity: 1; }
  @media (max-width: 640px) { .tab-divider { display: none; } }

  /* --- Page surface --- */
  .page {
    flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px 26px 26px 26px; box-shadow: 0 18px 40px var(--shadow), 0 2px 0 var(--border);
    position: relative; overflow: hidden;
  }
  .masthead {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px clamp(18px, 4vw, 34px); border-bottom: 2px solid var(--brand);
    background: linear-gradient(180deg, var(--brand-soft), transparent);
  }
  .masthead .title-block { display: flex; flex-direction: column; gap: 2px; }
  .masthead h1 { font-size: clamp(1.3rem, 2.6vw, 1.7rem); color: var(--brand-ink); }
  .masthead .subtitle { color: var(--ink-soft); font-size: 0.88rem; }
  .masthead-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .theme-toggle, .settings-toggle {
    border: none; background: var(--brand-gradient); color: #fff;
    border-radius: 999px; padding: 7px 14px; font-size: 0.76rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 0 var(--brand-ink), 0 4px 10px var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  }
  .theme-toggle:hover, .settings-toggle:hover { background: var(--brand-ink); transform: scale(1.05); box-shadow: 0 3px 0 var(--brand-ink), 0 6px 14px var(--shadow); }
  .theme-toggle:active, .settings-toggle:active { transform: scale(0.97); box-shadow: 0 1px 0 var(--brand-ink), 0 2px 6px var(--shadow); }

  .view { display: none; padding: 26px clamp(18px, 4vw, 34px) 28px; }

  /* ---------- settings page ---------- */
  .settings-page { max-width: 620px; margin: 0 auto; }
  .settings-profile-card {
    display: flex; align-items: center; gap: 16px; background: var(--paper);
    border: 1px solid var(--border); border-radius: 22px; padding: 20px; margin: 18px 0 22px;
  }
  .settings-profile-card .avatar { width: 56px; height: 56px; font-size: 1.15rem; }
  .settings-profile-name-row { display: flex; align-items: center; gap: 8px; }
  .settings-profile-name-row h3 { font-size: 1.1rem; }
  .settings-edit-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; width: 28px; height: 28px; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; font-size: 0.82rem; flex-shrink: 0; transition: border-color 0.15s ease;
  }
  .settings-edit-btn:hover { border-color: var(--info); color: var(--info); }
  .settings-edit-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 10px; }
  .settings-edit-form label { font-size: 0.76rem; color: var(--ink-faint); font-weight: 600; display: block; margin-bottom: 3px; }
  .settings-edit-form input {
    width: 100%; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--ink); font-size: 0.88rem;
  }
  .settings-edit-form input:focus { border-color: var(--brand); }
  .settings-edit-actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }

  .settings-section {
    background: var(--paper); border: 1px solid var(--border); border-radius: 22px;
    padding: 18px 20px; margin-bottom: 18px;
  }
  .settings-section h4 { font-size: 0.98rem; color: var(--brand-ink); margin-bottom: 4px; }
  .settings-section .settings-section-sub { font-size: 0.8rem; color: var(--ink-faint); margin-bottom: 12px; }
  .settings-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .settings-row:last-child { border-bottom: none; padding-bottom: 0; }
  .settings-row-main { flex: 1; min-width: 0; }
  .settings-row-label { font-weight: 600; font-size: 0.9rem; color: var(--ink); }
  .settings-row-value { font-size: 0.8rem; color: var(--ink-faint); margin-top: 1px; }
  .settings-icon-circle {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .settings-icon-circle[data-color="green"] { background: var(--green-soft); }
  .settings-icon-circle[data-color="blue"] { background: var(--info-soft); }
  .settings-icon-circle[data-color="orange"] { background: var(--gold-soft); }
  .settings-icon-circle[data-color="violet"] { background: var(--violet-soft); }

  .toggle-switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-switch .toggle-track {
    position: absolute; inset: 0; background: var(--border); border-radius: 999px;
    cursor: pointer; transition: background 0.18s ease;
  }
  .toggle-switch .toggle-track::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: var(--surface); border-radius: 50%; transition: transform 0.18s ease; box-shadow: 0 1px 3px var(--shadow);
  }
  .toggle-switch input:checked + .toggle-track { background: var(--brand); }
  .toggle-switch input:checked + .toggle-track::before { transform: translateX(18px); }

  .level-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .level-pill {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 13px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .level-pill:hover { border-color: var(--brand); }
  .level-pill.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  .settings-key-status { font-size: 0.76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .settings-key-status.connected { background: var(--green-soft); color: var(--green-ink); }
  .settings-key-status.disconnected { background: var(--rust-soft); color: var(--rust); }

  .reminder-banner {
    background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold);
    border-radius: 12px; padding: 12px 16px; font-size: 0.88rem; font-weight: 600;
    margin-bottom: 16px;
  }
  .view.active { display: block; }
  .page.unit-mode #view-cards, .page.unit-mode #view-grammar { padding-top: 10px; }
  @media (min-width: 760px) {
    .page.unit-mode { display: grid; grid-template-columns: 1fr 1fr; align-items: start; column-gap: 6px; }
    .page.unit-mode .masthead { grid-column: 1 / -1; }
    .page.unit-mode #view-home { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-cards.active):not(:has(#view-grammar.active)) #view-cards { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-grammar.active):not(:has(#view-cards.active)) #view-grammar { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-cards.active):has(#view-grammar.active) #view-grammar { border-left: 1px solid var(--border); }
    .page.unit-mode:has(#view-cards.active .back-link) { grid-template-columns: 1fr; }
    .page.unit-mode:has(#view-grammar.active .back-link) { grid-template-columns: 1fr; }
    .page.unit-mode:has(#view-cards.active .accordion.open) { grid-template-columns: 1fr; }
    .page.unit-mode:has(#view-grammar.active .accordion.open) { grid-template-columns: 1fr; }
  }

  /* --- Decorative background scatter (fills empty whitespace, non-interactive) --- */
  .decor-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .decor-item { position: absolute; color: var(--gold); opacity: 0.22; animation: decorFloat 4s ease-in-out infinite; }
  .decor-item svg { width: 100%; height: 100%; display: block; }
  @keyframes decorFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(6deg); } }
  @media (max-width: 700px) { .decor-layer { display: none; } }

  /* --- Dashboard --- */
  .home-hero { position: relative; }
  .profile-row { position: relative; z-index: 1; display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 28px; }
  .id-card { flex: 1 1 300px; border: 1px solid var(--border); border-top: 4px solid var(--gold); border-radius: 20px; padding: 18px 20px; background: var(--paper); display: flex; gap: 16px; align-items: center; }
  .avatar { width: 58px; height: 58px; border-radius: 50%; background: var(--brand-gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', 'Noto Sans Georgian', sans-serif; font-size: 1.3rem; font-weight: 700; flex-shrink: 0; }
  .id-card dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.86rem; }
  .id-card dt { color: var(--ink-faint); }
  .id-card dd { margin: 0; color: var(--ink); font-weight: 500; }

  .intro-card { flex: 1 1 320px; border: 1px dashed var(--border); border-top: 4px solid var(--rust); border-radius: 20px; padding: 16px 20px; background: var(--surface); }
  .intro-card p { margin: 5px 0; font-size: 0.92rem; }
  .intro-card .blank { color: var(--brand-ink); font-weight: 600; }

  .section-heading { display: flex; align-items: baseline; gap: 10px; margin: 20px 0 8px; }
  .view .section-heading:first-of-type { margin-top: 0; }
  .section-heading h2 { font-size: 1.05rem; }
  .section-heading .rule { flex: 1; height: 1px; background: var(--border); }

  .bar { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--ink-faint); border-radius: 4px; transition: width 0.5s cubic-bezier(.2,.8,.2,1); }
  .bar[data-state="green"] > span { background: var(--green); }
  .bar[data-state="gold"] > span { background: var(--gold); }
  .bar[data-state="rust"] > span { background: var(--rust); }

  /* --- Accordion sections (unit page: ლექსიკონი/გრამატიკა/დიალოგები/სავარჯიშოები) --- */
  .accordion { --accent-color: var(--brand); --accent-soft: var(--brand-soft); border: 1px solid var(--border); border-left: 3px solid var(--accent-color); border-radius: 20px; background: var(--surface); margin: 0 0 10px; overflow: hidden; transition: border-color 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 2px 8px var(--shadow); }
  .accordion[data-color="info"] { --accent-color: var(--info); --accent-soft: var(--info-soft); }
  .accordion[data-color="cyan"] { --accent-color: var(--cyan); --accent-soft: var(--cyan-soft); }
  .accordion[data-color="violet"] { --accent-color: var(--violet); --accent-soft: var(--violet-soft); }
  .accordion[data-color="gold"] { --accent-color: var(--gold); --accent-soft: var(--gold-soft); }
  .accordion.open { border-color: var(--accent-color); }
  .accordion-header {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: none; border: none; cursor: pointer; text-align: left; font-family: inherit; color: var(--ink);
  }
  .accordion-header:hover { background: var(--paper); }
  .accordion-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; flex: 1 1 auto; }
  .accordion-icon { font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); flex-shrink: 0; transition: background 0.2s ease, color 0.2s ease; }
  .accordion.open .accordion-icon { background: var(--accent-color); color: #ffffff; }
  .accordion-meta { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .ring { position: relative; display: inline-block; width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto; background: conic-gradient(var(--ring-color, var(--brand)) calc(var(--pct, 0) * 1%), var(--border) 0); transition: background 0.4s ease; }
  .ring-hole { position: absolute; inset: 3px; border-radius: 50%; background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .accordion-header:hover .ring-hole { background: var(--surface); }
  .ring-label { font-size: 0.56rem; font-weight: 700; color: var(--ink); }
  .accordion-chevron { color: var(--ink-faint); font-size: 0.78rem; transition: transform 0.2s ease; flex: 0 0 auto; }
  .accordion.open .accordion-chevron { transform: rotate(180deg); }
  .accordion-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
  .accordion-body > .accordion-body-inner { overflow: hidden; }
  .accordion.open .accordion-body { grid-template-rows: 1fr; }
  .accordion-body-inner { padding: 0 14px; }
  .accordion.open .accordion-body-inner { padding: 0 14px 14px; }

  /* --- Deck / topic pickers --- */
  .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .picker-card { border: 1px solid var(--border); background: var(--paper); border-radius: 16px; padding: 11px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; transition: border-color 0.15s ease, transform 0.12s ease; }
  .picker-card:hover { border-color: var(--brand); transform: translateY(-2px); }
  .picker-card .ka { font-weight: 600; font-size: 1rem; }
  .picker-card .en { font-size: 0.8rem; color: var(--ink-faint); }
  .picker-card .meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }

  /* --- Item picker (full list of exercises/cards, click to jump directly) --- */
  .item-picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-bottom: 10px; width: 100%; }
  .item-picker-card {
    position: relative; border: 1.5px solid var(--border); background: var(--surface); border-radius: 16px;
    padding: 12px 8px 10px; text-align: center; cursor: pointer; font-weight: 600; font-size: 0.82rem;
    color: var(--ink-soft); transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .item-picker-card:hover { border-color: var(--brand); transform: translateY(-2px); }
  .item-picker-card:active { transform: scale(0.95); }
  .item-picker-num { display: block; font-family: 'Baloo 2', 'Noto Sans Georgian', sans-serif; font-size: 1.1rem; color: var(--ink); }
  .item-picker-card.status-correct { border-color: var(--green); background: var(--green-soft); }
  .item-picker-card.status-wrong { border-color: var(--rust); background: var(--rust-soft); }
  .item-picker-card.status-partial { border-color: var(--gold); background: var(--gold-soft); }
  .item-picker-status { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; background: var(--surface); border: 1px solid var(--border); color: var(--ink-faint); }
  .item-picker-card.status-correct .item-picker-status { background: var(--green); color: #fff; border-color: var(--green); }
  .item-picker-card.status-wrong .item-picker-status { background: var(--rust); color: #fff; border-color: var(--rust); }
  .item-picker-card.status-partial .item-picker-status { background: var(--gold); color: #fff; border-color: var(--gold); }
  .item-picker-wide-section { width: 100%; }

  /* --- Unit section tabs (navigate between lex/lexPractice/grammar/dialogue/reading while inside any one of them) --- */
  .unit-section-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .unit-section-tab {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, padding 0.15s ease, font-size 0.15s ease;
  }
  .unit-section-tab:hover { border-color: var(--brand); }
  .unit-section-tab.active {
    background: var(--brand-gradient); border-color: transparent; color: #fff;
    font-size: 1rem; padding: 10px 20px; font-weight: 800;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  }

  .back-link {
    background: var(--surface); border: 1.5px solid var(--border); color: var(--ink);
    font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 999px;
    padding: 8px 16px; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease; box-shadow: 0 2px 6px var(--shadow);
  }
  .back-link:hover { border-color: var(--info); color: var(--info); transform: translateX(-2px); }
  .back-link:active { transform: scale(0.96); }

  /* --- Flashcards --- */
  .card-stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .flip-wrap { width: min(420px, 100%); aspect-ratio: 3 / 2; perspective: 1400px; }
  .flip-card { position: relative; width: 100%; height: 100%; cursor: pointer; transition: transform 0.5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: var(--surface); box-shadow: 0 10px 26px var(--shadow); }
  .face.back { transform: rotateY(180deg); background: var(--brand-soft); }
  .face .word { font-family: 'Baloo 2', 'Noto Sans Georgian', sans-serif; font-size: clamp(1.4rem, 4vw, 2rem); color: var(--ink); }
  .face .ipa { color: var(--ink-faint); font-size: 0.92rem; margin-top: 4px; }
  .face .ka { font-family: 'Baloo 2', 'Noto Sans Georgian', sans-serif; font-size: clamp(1.3rem, 3.6vw, 1.8rem); color: var(--brand-ink); }
  .face .example { margin-top: 10px; font-size: 0.85rem; color: var(--ink-soft); max-width: 32ch; }
  .face .tap-hint { position: absolute; bottom: 10px; font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }

  .rate-row { display: flex; gap: 10px; }
  .rate-btn { border: 1px solid var(--border); background: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: border-color 0.15s ease, transform 0.1s ease; }
  .rate-btn .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .rate-btn[data-level="rust"] .swatch { background: var(--rust); }
  .rate-btn[data-level="gold"] .swatch { background: var(--gold); }
  .rate-btn[data-level="green"] .swatch { background: var(--green); }
  .rate-btn:hover { border-color: var(--ink-faint); transform: translateY(-1px); }
  .rate-btn.chosen[data-level="rust"] { background: var(--rust-soft); border-color: var(--rust); }
  .rate-btn.chosen[data-level="gold"] { background: var(--gold-soft); border-color: var(--gold); }
  .rate-btn.chosen[data-level="green"] { background: var(--green-soft); border-color: var(--green); }
  .rate-btn.chosen { animation: popIn 0.25s ease; }

  .deck-nav { display: flex; align-items: center; gap: 14px; }
  .nav-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; transition: border-color 0.15s ease, transform 0.1s ease; }
  .nav-btn:hover { border-color: var(--info); transform: scale(1.06); }
  .deck-count { font-size: 0.85rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  /* --- Quiz --- */
  .quiz-box { border: 1px solid var(--border); border-radius: 20px; padding: 22px clamp(16px, 4vw, 28px); background: var(--paper); max-width: 640px; margin: 0 auto; }
  .quiz-progress { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .quiz-prompt { font-size: 1.08rem; line-height: 1.55; margin: 6px 0 16px; }
  .quiz-prompt .blank-marker { border-bottom: 2px solid var(--ink-faint); padding: 0 6px; }
  .answer-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .answer-input { flex: 1 1 220px; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 1rem; font-family: inherit; }
  .answer-input:focus { border-color: var(--brand); }
  .check-btn {
    border: none; background: var(--brand-gradient); color: #fff; padding: 12px 22px; border-radius: 14px;
    font-weight: 700; cursor: pointer; font-size: 0.92rem; box-shadow: 0 4px 0 var(--brand-ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }
  .check-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--brand-ink); }
  .check-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-ink); }
  .feedback { margin-top: 16px; display: none; align-items: flex-start; gap: 10px; }
  .feedback.show { display: flex; }
  .feedback.correct { animation: popIn 0.35s ease; }
  .feedback.wrong { animation: shake 0.4s ease; }
  .feedback .mark { width: 30px; height: 30px; flex-shrink: 0; position: relative; }
  .feedback .msg { font-size: 0.94rem; padding-top: 3px; }
  .feedback .msg .hand { font-size: 1.25rem; }
  .feedback.correct .msg { color: var(--green-ink); }
  .feedback.wrong .msg { color: var(--rust); }
  .feedback .correct-answer { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 0.88rem; }
  .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .skip-btn { background: none; border: none; color: var(--ink-faint); font-size: 0.82rem; cursor: pointer; text-decoration: underline; }
  .next-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.88rem; display: none; transition: border-color 0.15s ease; }
  .next-btn:hover { border-color: var(--info); }
  .next-btn.show { display: inline-block; }

  .quiz-done { text-align: center; padding: 30px 10px; position: relative; }
  .quiz-done .big-confetti { position: absolute; top: 30%; left: 50%; }
  .quiz-done .score { font-family: 'Baloo 2', 'Noto Sans Georgian', sans-serif; font-size: 2.4rem; color: var(--brand-ink); }
  .redo-btn { margin-top: 16px; border: 1px solid var(--border); background: var(--surface); padding: 9px 18px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: border-color 0.15s ease; }
  .redo-btn:hover { border-color: var(--info); }

  /* --- Reference --- */
  .ref-search { width: 100%; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--paper); color: var(--ink); font-size: 0.98rem; margin-bottom: 20px; }
  .ref-search:focus { border-color: var(--brand); }
  .ref-group { margin-bottom: 24px; }
  .ref-group h3 { font-size: 1rem; color: var(--brand-ink); margin-bottom: 10px; }
  .ref-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .ref-table tr { border-bottom: 1px solid var(--border); transition: background 0.15s ease; }
  .ref-table tr:nth-child(even) { background: var(--paper); }
  .ref-table tr:hover { background: var(--info-soft); }
  .ref-table td { padding: 9px 10px; vertical-align: top; }
  .ref-table td.en { font-weight: 700; color: var(--ink); width: 40%; }
  .ref-table td.ipa { color: var(--ink-faint); font-size: 0.8rem; font-style: italic; width: 22%; }
  .ref-table td.ka { color: var(--info); font-weight: 600; }
  .ref-table tr.hide { display: none; }
  .ref-empty { color: var(--ink-faint); font-size: 0.9rem; padding: 10px 0; }

  .note { font-family: 'Caveat', cursive; font-size: 1.15rem; color: var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 10px 16px; display: inline-block; margin: 14px 0 0; transform: rotate(-1deg); }

  /* --- Unit dashboard header ("Calm Focus" design) --- */
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes fillA { from { stroke-dashoffset: 35; } to { stroke-dashoffset: var(--off); } }
  @keyframes pulseRing { 0% { transform: scale(0.9); opacity: 0.55; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes popIn2 { 0% { transform: scale(0.7); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  .dash-card { position: relative; z-index: 1; margin: 8px 0 0; }
  .dash-header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; animation: fadeSlide 0.5s ease-out; }
  .dash-avatar { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; overflow: hidden; box-shadow: 0 4px 10px var(--shadow); }
  .dash-avatar svg { width: 100%; height: 100%; display: block; }
  .dash-avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dash-welcome { margin: 0; font-family: 'Baloo 2', 'Noto Sans Georgian', sans-serif; font-size: 19px; color: var(--brand-ink); }
  .dash-subtitle { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }

  .dash-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .dash-stat { background: var(--info-soft); border-radius: 18px; padding: 4px 10px; text-align: center; animation: fadeSlide 0.5s ease-out both; box-shadow: 0 2px 8px var(--shadow); }
  .dash-stats .dash-stat:nth-child(1) { animation-delay: 0.05s; }
  .dash-stats .dash-stat:nth-child(2) { animation-delay: 0.1s; }
  .dash-stats .dash-stat:nth-child(3) { animation-delay: 0.15s; }
  .dash-stat-icon { margin: 0 auto 2px; position: relative; height: 14px; display: flex; align-items: center; justify-content: center; }
  .dash-streak-icon { width: 11px; height: 14px; background: var(--brand); clip-path: polygon(50% 0%, 100% 60%, 80% 100%, 20% 100%, 0% 60%); animation: pulseSoft 2.6s ease-in-out infinite; position: relative; z-index: 1; }
  .dash-streak-icon::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%; background: var(--brand-soft);
    z-index: -1; animation: pulseRing 2.6s ease-out infinite;
  }
  .dash-star-icon { width: 10px; height: 10px; background: var(--info); transform: rotate(45deg); border-radius: 2px; }
  .dash-ring-wrap { display: flex; align-items: center; justify-content: center; }
  .dash-stat-value { margin: 0; font-weight: 800; font-size: 18px; line-height: 1; color: var(--ink); }
  .dash-stat-label { margin: 0; font-size: 10px; line-height: 1.1; color: var(--ink-soft); }
  @media (max-width: 420px) { .dash-stats { grid-template-columns: 1fr; } }

  .progress-overview { background: var(--brand-soft); border-radius: 18px; padding: 9px 9px 10px; margin: 4px 0 12px; }
  .progress-overview-title { font-weight: 700; font-size: 0.76rem; color: var(--brand-ink); margin-bottom: 6px; }
  .type-progress-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 8px; }
  .type-progress-tile { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 5px 5px; min-width: 0; }
  .type-progress-label { display: flex; align-items: center; gap: 3px; font-size: 0.62rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
  .type-progress-label .icon { font-size: 0.7rem; }
  .type-progress-tile .bar { margin-bottom: 3px; height: 3px; }
  .type-progress-count { font-size: 0.6rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .type-progress-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
  }

  .activity-card { background: var(--surface); border-radius: 12px; padding: 7px 8px; }
  .activity-title { font-weight: 700; font-size: 0.76rem; color: var(--ink); margin-bottom: 6px; }
  .activity-row { display: flex; gap: 5px; justify-content: space-between; }
  .activity-day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.64rem; color: var(--ink-faint); flex: 1 1 0; }
  .activity-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); border: 2px solid transparent; }
  .activity-day.active .activity-dot { background: var(--brand); }
  .activity-day.today .activity-dot { border-color: var(--gold); }
  .activity-day.today { color: var(--ink); font-weight: 700; }

  /* --- Unit material preview (learning material only, no exercises) --- */
  .material-preview { margin: 0 0 20px; }
  .material-preview-title { font-weight: 700; font-size: 0.88rem; color: var(--brand-ink); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .material-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .material-card {
    --accent-color: var(--brand); --accent-soft: var(--brand-soft);
    border: 1px solid var(--border); border-left: 3px solid var(--accent-color);
    background: var(--surface); border-radius: 20px; padding: 12px 14px;
    box-shadow: 0 2px 8px var(--shadow); width: 100%; text-align: left; cursor: pointer;
  }
  .material-card[data-color="info"] { --accent-color: var(--info); --accent-soft: var(--info-soft); }
  .material-card[data-color="cyan"] { --accent-color: var(--cyan); --accent-soft: var(--cyan-soft); }
  .material-card[data-color="violet"] { --accent-color: var(--violet); --accent-soft: var(--violet-soft); }
  .material-card[data-color="gold"] { --accent-color: var(--gold); --accent-soft: var(--gold-soft); }
  .material-card-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; color: var(--ink); margin-bottom: 6px; }
  .material-card-head .icon { font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); flex-shrink: 0; }
  .material-card-body { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 6px; }
  .material-card-sample { font-size: 0.76rem; color: var(--ink-faint); line-height: 1.4; }
  .dash-chat-btn { display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px 8px; font-size: 0.72rem; margin: 0; }

  /* --- Vocabulary practice modes --- */
  .mode-card-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 12px; max-width: 360px; }
  .mode-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--border); background: var(--paper); color: var(--ink-soft); border-radius: 12px; padding: 10px 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer; text-align: center; aspect-ratio: 1 / 1; transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.1s ease; }
  .mode-card:hover { border-color: var(--brand); transform: translateY(-1px); }
  .mode-card.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .mode-card-icon { color: var(--brand); }
  .mode-card-icon svg { width: 26px; height: 26px; display: block; }
  .mode-card.active .mode-card-icon { color: var(--surface); }
  .mode-card-label { line-height: 1.2; }

  .practice-box { border: 1px solid var(--border); border-radius: 20px; padding: 26px clamp(16px, 4vw, 30px); background: var(--paper); max-width: 560px; margin: 0 auto; text-align: center; }
  .practice-progress { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .practice-box .bar { margin-bottom: 22px; }
  .practice-prompt-ka, .practice-prompt-en { font-family: 'Baloo 2', 'Noto Sans Georgian', sans-serif; font-size: clamp(1.6rem, 5vw, 2.2rem); color: var(--ink); margin-bottom: 20px; }
  .practice-prompt-en { margin-bottom: 6px; }
  .practice-ipa { color: var(--ink-faint); font-size: 0.92rem; margin-bottom: 16px; }

  .practice-mic-btn { width: 76px; height: 76px; border-radius: 50%; border: none; background: var(--brand-gradient); color: #fff; font-size: 1.8rem; cursor: pointer; box-shadow: 0 10px 26px var(--shadow); transition: background 0.15s ease, transform 0.1s ease; margin-bottom: 14px; }
  .practice-mic-btn:hover { background: var(--brand-ink); transform: scale(1.04); }

  .practice-status { font-size: 0.86rem; font-weight: 600; color: var(--ink-faint); min-height: 1.2em; margin: 8px 0; display: none; align-items: center; justify-content: center; }
  .practice-status.show { display: flex; }
  .practice-status.state-listening { color: var(--green-ink); }
  .practice-status.state-processing { color: var(--gold); }
  .practice-status.state-speaking { color: var(--green-ink); }

  .mc-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 18px 0 6px; }
  .mc-option { border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); padding: 13px 14px; border-radius: 14px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease; }
  .mc-option:hover { border-color: var(--brand); }
  .mc-option.correct { background: var(--green-soft); border-color: var(--green); color: var(--green-ink); animation: popIn 0.3s ease; }
  .mc-option.wrong { background: var(--rust-soft); border-color: var(--rust); color: var(--rust); animation: shake 0.4s ease; }

  /* --- Animations --- */

  var STORAGE_KEY = "nonaEnglishNotebook.v1";
  var CARD_MODES = ["flip", "voice", "written", "mc"];
  var state = loadState();

  function loadState() {
    var s;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      s = raw ? JSON.parse(raw) : { cards: {}, quiz: {} };
    } catch (e) { s = { cards: {}, quiz: {} }; }
    if (!s.cards) s.cards = {};
    if (!s.quiz) s.quiz = {};
    if (!s.activity) s.activity = {};
    /* migrate pre-existing flat {idx: level} per-deck records (before practice
       modes tracked separately) into the "flip" sub-record. */
    Object.keys(s.cards).forEach(function (deckId) {
      var rec = s.cards[deckId];
      var isOldFlat = false;
      for (var k in rec) {
        if (CARD_MODES.indexOf(k) === -1) { isOldFlat = true; break; }
      }
      if (isOldFlat) s.cards[deckId] = { flip: rec };
    });
    return s;
  }
  function dateKeyOf(d) {
    var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = "0" + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = "0" + dd;
    return d.getFullYear() + "-" + mm + "-" + dd;
  }
  function computeStreak() {
    var activity = state.activity || {};
    var day = new Date();
    if (!activity[dateKeyOf(day)]) day.setDate(day.getDate() - 1);
    var streak = 0;
    while (activity[dateKeyOf(day)]) {
      streak++;
      day.setDate(day.getDate() - 1);
    }
    return streak;
  }
  function saveState() {
    if (!state.activity) state.activity = {};
    state.activity[dateKeyOf(new Date())] = true;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function normalize(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/[’‘]/g, "'")
      .replace(/[.!?]+$/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  }

    html += "</span>";

  /* ---------- mastery helpers ---------- */
  function deckMastery(deck, mode) {
    var ratings = (state.cards[deck.id] || {})[mode || "flip"] || {};
    var total = deck.cards.length, rated = 0, green = 0;
    for (var i = 0; i < total; i++) {
      var lvl = ratings[i];
      if (lvl) { rated++; if (lvl === "green") green++; }
    }
    var pct = total ? green / total : 0;
    var colorState = rated === 0 ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { rated: rated, total: total, green: green, pct: pct, colorState: colorState };
  }
  function deckAllModesMastery(deck) {
    var sum = 0, any = false;
    CARD_MODES.forEach(function (m) {
      var dm = deckMastery(deck, m);
      sum += dm.pct;
      if (dm.rated) any = true;
    });
    var pct = sum / CARD_MODES.length;
    var colorState = !any ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState, rated: any };
  }
  function topicMastery(topic) {
    var rec = state.quiz[topic.id] || { answers: {} };
    var total = topic.items.length, attempted = 0, correct = 0;
    for (var i = 0; i < total; i++) {
      var a = rec.answers[i];
      if (a !== undefined) { attempted++; if (a) correct++; }
    }
    var pct = total ? correct / total : 0;
    var colorState = attempted === 0 ? "none" : pct >= 0.75 ? "green" : pct >= 0.4 ? "gold" : "rust";
    return { attempted: attempted, total: total, correct: correct, pct: pct, colorState: colorState };
  }
  function overallMastery(list, fn) {
    var sum = 0, cnt = 0, anyAttempt = false;
    list.forEach(function (x) {
      var m = fn(x);
      sum += m.pct; cnt++;
      if ((m.rated || m.attempted)) anyAttempt = true;
    });
    var pct = cnt ? sum / cnt : 0;
    var colorState = !anyAttempt ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState };
  }

  function unitDecks(unit) { return DECKS.filter(function (d) { return unit.deckIds.indexOf(d.id) !== -1; }); }
  function unitGrammarTopics(unit) { return GRAMMAR.filter(function (g) { return unit.grammarIds.indexOf(g.id) !== -1; }); }
  function unitTopicsByKind(unit, kind) { return unitGrammarTopics(unit).filter(function (g) { return g.kind === kind; }); }

  function unitMastery(unit) {
    var parts = unitDecks(unit).map(deckAllModesMastery).concat(unitGrammarTopics(unit).map(topicMastery));
    var sum = 0, cnt = parts.length, any = false;
    parts.forEach(function (m) { sum += m.pct; if (m.rated || m.attempted) any = true; });
    var pct = cnt ? sum / cnt : 0;
    var colorState = !any ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState };
  }

  function unitProgressCounts(unit) {
    var done = 0, total = 0;
    CARD_MODES.forEach(function (mode) {
      unitDecks(unit).forEach(function (d) { var m = deckMastery(d, mode); done += m.green; total += m.total; });
    });
    unitGrammarTopics(unit).forEach(function (t) { var m = topicMastery(t); done += m.correct; total += m.total; });
    return { done: done, total: total };
  }

    var rows = [];

    wrap.innerHTML = "";
    TABS.forEach(function (t) {
      var dotState = "none";
      if (t.id === "home") dotState = overallMastery(UNITS, unitMastery).colorState;
      var dot = el("span", { class: "dot" });
      if (dotState !== "none") dot.setAttribute("data-state", dotState);
      var btn = el("button", { class: "tab" + (currentView === t.id ? " active" : ""), type: "button" }, [
        dot, document.createTextNode(t.ka)
      ]);
      btn.addEventListener("click", function (id) { return function () {
        if (id === "chat" && chatScopeUnit !== null) { chatScopeUnit = null; chatHistory = []; chatStarted = false; }
        switchView(id);
      }; }(t.id));
      wrap.appendChild(btn);
    });

    wrap.appendChild(el("div", { class: "tab-divider" }));
    UNITS.forEach(function (unit) {
      var m = unitMastery(unit);
      var dot = el("span", { class: "dot" });
      if (m.colorState !== "none") dot.setAttribute("data-state", m.colorState);
      var btn = el("button", { class: "tab tab-unit" + (currentUnit === unit.id ? " active" : ""), type: "button" }, [
        dot, document.createTextNode(unit.short)
      ]);
      btn.addEventListener("click", function (id) { return function () { openUnit(id); }; }(unit.id));
      wrap.appendChild(btn);
    });
  }

  function switchView(id) {
    stopPracticeMic();
    currentView = id;
    if (id === "home") currentUnit = null;
    document.querySelector(".page").classList.remove("unit-mode");
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    document.getElementById("view-" + id).classList.add("active");
    renderTabs();
    if (id === "home") renderHome();
    if (id === "reference") renderReferenceView();
    if (id === "chat") renderChatView();
    if (id === "settings") renderSettingsView();
  }

  function currentUnitObj() {
    return currentUnit ? UNITS.filter(function (u) { return u.id === currentUnit; })[0] : null;
  }

  function openUnit(id) {
    var unit = UNITS.filter(function (u) { return u.id === id; })[0];
    currentUnit = id;
    cardsSub = null; grammarSub = null; practicePos = 0; cardsMode = "flip";
    currentView = "home";
    document.querySelector(".page").classList.add("unit-mode");
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    document.getElementById("view-home").classList.add("active");
    if (unit.deckIds.length) document.getElementById("view-cards").classList.add("active");
    if (unit.grammarIds.length) document.getElementById("view-grammar").classList.add("active");
    renderTabs();
    renderHome();
    if (unit.deckIds.length) renderCardsView();
    if (unit.grammarIds.length) renderGrammarView();
  }

  function backToUnits() {
    stopPracticeMic();
    currentUnit = null;
    document.querySelector(".page").classList.remove("unit-mode");
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    document.getElementById("view-home").classList.add("active");
    renderTabs();
    renderHome();
  }

  function openUnitChat(unit) {
    chatScopeUnit = unit.id;
    chatHistory = [];
    chatStarted = false;
    switchView("chat");
  }

  function pickChatUnit(id) {
    chatScopeUnit = id;
    chatHistory = [];
    chatStarted = false;
    renderChatView();
  }

  /* ---------- home / dashboard ---------- */
  function renderHome() {
    var root = document.getElementById("view-home");
    root.innerHTML = "";

    if (currentUnit) {
      renderUnitHeader(root);
      return;
    }

    if (appSettings.reminders && !(state.activity && state.activity[dateKeyOf(new Date())])) {
      root.appendChild(el("div", { class: "reminder-banner" }, [
        document.createTextNode("👋 დღეს ჯერ არ ისწავლე რამე — დაიწყე თუნდაც ერთი თავით!")
      ]));
    }

    var hero = el("div", { class: "home-hero" });
    var heroCard = el("div", { class: "hero-card" }, [
      el("div", { class: "hero-card-text" }, [
        el("div", { class: "hero-eyebrow" }, [document.createTextNode("კეთილი იყოს შენი მობრძანება")]),
        el("div", { class: "hero-title" }, [document.createTextNode(PROFILE.name + "-ს ინგლისურის მოგზაურობა")]),
        el("div", { class: "hero-sub" }, [document.createTextNode("ისწავლე, გაიმეორე, გაიზარდე — თავი თავის მიყოლებით.")])
      ]),
      el("div", { class: "hero-illustration", html: ILLUS_GLOBE_FLAGS })
    ]);
    hero.appendChild(heroCard);
    hero.appendChild(el("div", { class: "home-person-deco" }, [
      el("div", { class: "person-illus", html: PERSON_BOOK })
    ]));
    root.appendChild(hero);

    var initials = (PROFILE.nameEn[0] + PROFILE.surnameEn[0]).toUpperCase();
    var idCard = el("div", { class: "id-card" }, [
      el("div", { class: "avatar" }, [document.createTextNode(initials)]),
      el("div", {}, [
        el("div", { class: "eyebrow" }, [document.createTextNode("PERSONAL PROFILE")]),
        el("h3", { class: "display" }, [document.createTextNode(PROFILE.nameEn + " " + PROFILE.surnameEn)]),
        el("dl", {}, [
          el("dt", {}, [document.createTextNode("Age")]), el("dd", {}, [document.createTextNode(String(PROFILE.age))]),
          el("dt", {}, [document.createTextNode("From")]), el("dd", {}, [document.createTextNode(PROFILE.countryEn)]),
          el("dt", {}, [document.createTextNode("City")]), el("dd", {}, [document.createTextNode(PROFILE.cityEn)]),
          el("dt", {}, [document.createTextNode("Job")]), el("dd", {}, [document.createTextNode(PROFILE.jobEn)])
        ])
      ])
    ]);

    var introHtml =
      "<p>Hello, I am <span class='blank'>" + PROFILE.nameEn + "</span>.</p>" +
      "<p>My surname is <span class='blank'>" + PROFILE.surnameEn + "</span>.</p>" +
      "<p>I am a <span class='blank'>" + PROFILE.jobEn + "</span>.</p>" +
      "<p>I am <span class='blank'>" + PROFILE.age + "</span> years old.</p>" +
      "<p>I am from <span class='blank'>" + PROFILE.countryEn + "</span> and I live in <span class='blank'>" + PROFILE.cityEn + "</span>.</p>";
    var introCard = el("div", { class: "intro-card" }, [
      el("div", { class: "eyebrow" }, [document.createTextNode("საკუთარი თავის წარდგენა")]),
      el("div", { html: introHtml })
    ]);

    hero.appendChild(el("div", { class: "profile-row" }, [idCard, introCard]));

    var resetWrap = el("div", { style: "margin-top:30px" });
    var resetBtn = el("button", { class: "back-link", type: "button" }, [document.createTextNode("↺ პროგრესის გასუფთავება")]);
    resetBtn.addEventListener("click", function () {
      if (confirm("წავშალო მთელი პროგრესი?")) {
        state = { cards: {}, quiz: {} };
        saveState();
        renderHome();
        renderTabs();
      }
    });
    resetWrap.appendChild(resetBtn);
    root.appendChild(resetWrap);
  }

  function renderUnitHeader(root) {
    var unit = currentUnitObj();
    var back = el("button", { class: "back-link", type: "button" }, [document.createTextNode("← თავებთან დაბრუნება")]);
    back.addEventListener("click", backToUnits);
    root.appendChild(back);

    var m = unitMastery(unit);
    var counts = unitProgressCounts(unit);
    var streak = computeStreak();
    var pct = Math.round(m.pct * 100);
    var ringOff = Math.round(35 * (1 - pct / 100));

    var avatarHtml = unit.image
      ? "<img src='" + unit.image + "' alt='" + unit.ka + "' class='dash-avatar-img'>"
      : (UNIT_ICONS[unit.id] || ILLUS_STAR_BADGE);

    var chatBtn = el("button", { class: "check-btn dash-chat-btn", type: "button" }, [document.createTextNode("💬 ამ თავზე საუბარი")]);
    chatBtn.addEventListener("click", function () { openUnitChat(unit); });

    var dashCard = el("div", { class: "dash-card" }, [
      el("div", { class: "dash-header" }, [
        el("div", { class: "dash-avatar", html: avatarHtml }),
        el("div", {}, [
          el("p", { class: "dash-welcome" }, [document.createTextNode("გამარჯობა, " + PROFILE.name)]),
          el("p", { class: "dash-subtitle" }, [document.createTextNode(unit.ka)])
        ])
      ]),
      el("div", { class: "dash-stats" }, [
        el("div", { class: "dash-stat" }, [
          el("div", { class: "dash-stat-icon dash-streak-icon" }),
          el("p", { class: "dash-stat-value" }, [document.createTextNode(String(streak))]),
          el("p", { class: "dash-stat-label" }, [document.createTextNode("დღის სერია")])
        ]),
        el("div", { class: "dash-stat" }, [
          el("div", { class: "dash-stat-icon dash-star-icon" }),
          el("p", { class: "dash-stat-value" }, [document.createTextNode(String(counts.done))]),
          el("p", { class: "dash-stat-label" }, [document.createTextNode("ვარსკვლავი")])
        ]),
        el("div", { class: "dash-stat" }, [
          el("div", { class: "dash-stat-icon dash-ring-wrap", html:
            "<svg width='14' height='14' viewBox='0 0 14 14'>" +
            "<circle cx='7' cy='7' r='5.5' fill='none' stroke='var(--gold-soft)' stroke-width='2.2'/>" +
            "<circle cx='7' cy='7' r='5.5' fill='none' stroke='var(--gold)' stroke-width='2.2' stroke-linecap='round' stroke-dasharray='35' style='--off:" + ringOff + ";animation:fillA 1.2s ease-out forwards' transform='rotate(-90 7 7)'/>" +
            "</svg>"
          }),
          el("p", { class: "dash-stat-value" }, [document.createTextNode(pct + "%")]),
          el("p", { class: "dash-stat-label" }, [document.createTextNode("პროგრესი")])
        ]),
        chatBtn
      ])
    ]);
    root.appendChild(dashCard);

    if (counts.total > 0 && counts.done === counts.total) {
      root.appendChild(el("div", { class: "complete-badge" }, [
        el("span", { html: ILLUS_STAR_BADGE }),
        document.createTextNode("🎉 თავი დასრულებულია!")
      ]));
    }

    var overview = el("div", { class: "progress-overview" });
    var typeRows = unitTypeProgress(unit);
    if (typeRows.length) {
      overview.appendChild(el("div", { class: "progress-overview-title" }, [
        el("span", { html: ILLUS_PLANT, style: "width:26px;height:26px;display:inline-flex" }),
        document.createTextNode("შენი პროგრესი")
      ]));
      var grid = el("div", { class: "type-progress-grid" });
      typeRows.forEach(function (row) {
        var pct = row.total ? row.done / row.total : 0;
        var state2 = row.total === 0 ? "none" : pct >= 0.75 ? "green" : pct > 0 ? "gold" : "none";
        var tile = el("div", { class: "type-progress-tile" }, [
          el("div", { class: "type-progress-label" }, [
            el("span", { class: "icon" }, [document.createTextNode(row.icon)]),
            document.createTextNode(row.label)
          ]),
          el("div", { class: "bar", "data-state": state2 === "none" ? "" : state2, html: "<span style='width:" + Math.round(pct * 100) + "%'></span>" }),
          el("div", { class: "type-progress-count" }, [document.createTextNode(row.done + " / " + row.total)])
        ]);
        grid.appendChild(tile);
      });
      overview.appendChild(grid);
    }
    overview.appendChild(renderActivityWidget());
    root.appendChild(overview);

    var materialPreview = renderUnitMaterialPreview(unit);
    if (materialPreview) root.appendChild(materialPreview);
  }

  var materialDetailOpen = null;

  function unitMaterialCategories(unit) {
    var cats = [];
    if (unitDecks(unit).length) {
      cats.push({ key: "lex", icon: "📖", label: "ლექსიკონი", color: "info" });
    }
    [
      ["grammar", "📐", "გრამატიკა", "violet"],
      ["dialogue", "💬", "დიალოგები", "gold"],
      ["reading", "✏️", "ტექსტები", "cyan"]
    ].forEach(function (k) {
      if (unitTopicsByKind(unit, k[0]).length) {
        cats.push({ key: k[0], icon: k[1], label: k[2], color: k[3] });
      }
    });
    return cats;
  }

  function renderUnitMaterialPreview(unit) {
    var cats = unitMaterialCategories(unit);
    if (!cats.length) return null;
    var wrap = el("div", { class: "material-preview" });

    if (materialDetailOpen && cats.some(function (c) { return c.key === materialDetailOpen; })) {
      wrap.appendChild(renderMaterialDetail(unit, materialDetailOpen));
      return wrap;
    }

    wrap.appendChild(el("div", { class: "material-preview-title" }, [document.createTextNode("📚 ამ თავის სასწავლი მასალა")]));
    var grid = el("div", { class: "material-preview-grid" });
    cats.forEach(function (c) {
      var card = el("button", { class: "material-card", type: "button", "data-color": c.color || "" }, [
        el("div", { class: "material-card-head" }, [
          el("span", { class: "icon" }, [document.createTextNode(c.icon)]),
          document.createTextNode(c.label)
        ])
      ]);
      card.addEventListener("click", function (key) { return function () { materialDetailOpen = key; renderHome(); }; }(c.key));
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function renderMaterialDetail(unit, key) {
    var wrap = el("div", {});
    wrap.appendChild(renderUnitSectionTabs(unit, key));
    var back = el("button", { class: "back-link", type: "button" }, [document.createTextNode("← მასალის კატეგორიებში დაბრუნება")]);
    back.addEventListener("click", function () { materialDetailOpen = null; renderHome(); });
    wrap.appendChild(back);

    if (key === "lex") {
      wrap.appendChild(el("h3", { style: "margin:14px 0 10px" }, [document.createTextNode("📖 ლექსიკონი")]));
      unitDecks(unit).forEach(function (deck) {
        var group = el("div", { class: "ref-group" });
        group.appendChild(el("h3", {}, [document.createTextNode(deck.ka)]));
        var table = el("table", { class: "ref-table" });
        deck.cards.forEach(function (c) {
          table.appendChild(el("tr", {}, [
            el("td", { class: "en" }, [document.createTextNode(c.en)]),
            el("td", { class: "ipa" }, [document.createTextNode(c.ipa || "")]),
            el("td", { class: "ka" }, [document.createTextNode(c.ka)])
          ]));
        });
        group.appendChild(table);
        wrap.appendChild(group);
      });
      return wrap;
    }

    var meta = key === "grammar" ? ["📐", "გრამატიკა"] : key === "dialogue" ? ["💬", "დიალოგები"] : ["✏️", "ტექსტები"];
    wrap.appendChild(el("h3", { style: "margin:14px 0 10px" }, [document.createTextNode(meta[0] + " " + meta[1])]));
    unitTopicsByKind(unit, key).forEach(function (topic) {
      wrap.appendChild(el("h4", { style: "margin:16px 0 6px" }, [document.createTextNode(topic.ka)]));
      if (key === "dialogue") {
        topic.items.forEach(function (it) {
          var text = it.prompt.replace(/<u>|<\/u>/g, "").replace("___", it.answer);
          wrap.appendChild(el("p", { style: "white-space:pre-line;margin:0 0 12px;font-size:0.92rem;line-height:1.6" }, [document.createTextNode(text)]));
        });
      } else {
        wrap.appendChild(el("p", { style: "margin:0 0 14px;font-size:0.92rem;line-height:1.6;color:var(--ink-soft)" }, [document.createTextNode(topic.note || "")]));
      }
    });
    return wrap;
  }

  function renderActivityWidget() {
    var dayLabels = ["ორშ", "სამ", "ოთხ", "ხუთ", "პარ", "შაბ", "კვ"];
    var today = new Date();
    var dow = today.getDay();
    var mondayOffset = dow === 0 ? -6 : 1 - dow;
    var monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() + mondayOffset);
    var todayKey = dateKeyOf(today);

    var wrap = el("div", { class: "activity-card" });
    wrap.appendChild(el("div", { class: "activity-title" }, [document.createTextNode("🔥 დღიური აქტივობა")]));
    var row = el("div", { class: "activity-row" });
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
      var key = dateKeyOf(d);
      var active = !!(state.activity && state.activity[key]);
      var isToday = key === todayKey;
      var cell = el("div", { class: "activity-day" + (active ? " active" : "") + (isToday ? " today" : "") }, [
        el("span", { class: "activity-dot" }),
        document.createTextNode(dayLabels[i])
      ]);
      row.appendChild(cell);
    }
    wrap.appendChild(row);
    return wrap;
  }

  /* ---------- flashcards & vocabulary practice ---------- */
  var cardIndex = {};
  var cardsMode = "flip";
  var practicePos = 0;
  var practiceListOpen = true;

  function openDeck(id) { stopPracticeMic(); cardsSub = id; practicePos = 0; practiceListOpen = true; renderCardsView(); }
  function openDeckFlip(id) { cardsMode = "flip"; openDeck(id); }
  function backToDecks() { stopPracticeMic(); cardsSub = null; renderCardsView(); }
  function openPracticeItem(idx) { practicePos = idx; practiceListOpen = false; if (cardsMode === "flip") { cardIndex[cardsSub] = idx; } renderCardsView(); }
  function backToPracticeList() { practiceListOpen = true; renderCardsView(); }

  function sectionHeading(icon, title, sub) {
    var frag = document.createDocumentFragment();
    frag.appendChild(el("div", { class: "section-heading" }, [
      el("h2", {}, [document.createTextNode(icon + " " + title)]),
      el("div", { class: "rule" })
    ]));
    if (sub) frag.appendChild(el("p", { style: "color:var(--ink-soft);margin:0 0 10px;max-width:60ch;font-size:0.85rem" }, [document.createTextNode(sub)]));
    return frag;
  }

  var accordionOpen = {};
  function miniProgressHtml(done, total) {
    var pct = total ? Math.round((done / total) * 100) : 0;
    var color = total === 0 ? "var(--border)" : pct >= 75 ? "var(--green)" : pct > 0 ? "var(--gold)" : "var(--border)";
    return "<span class='ring' style='--pct:" + pct + ";--ring-color:" + color + "' title='" + done + " / " + total + "'>" +
      "<span class='ring-hole'><span class='ring-label'>" + pct + "%</span></span>" +
      "</span>";
  }

  function accordionSection(unitId, key, icon, title, metaHtml, buildBody, color, directNav) {
    var stateKey = unitId + ":" + key;
    var isOpen = !!accordionOpen[stateKey];
    var wrap = el("div", { class: "accordion" + (isOpen ? " open" : ""), "data-color": color || "" });
    var header = el("button", { class: "accordion-header", type: "button" }, [
      el("span", { class: "accordion-title" }, [
        el("span", { class: "accordion-icon" }, [document.createTextNode(icon)]),
        document.createTextNode(title)
      ]),
      el("span", { class: "accordion-meta", html: metaHtml }),
      el("span", { class: "accordion-chevron" }, [document.createTextNode("▾")])
    ]);
    var body = el("div", { class: "accordion-body" });
    var inner = el("div", { class: "accordion-body-inner" });
    buildBody(inner);
    body.appendChild(inner);
    header.addEventListener("click", function () {
      if (directNav) { directNav(); return; }
      accordionOpen[stateKey] = !accordionOpen[stateKey];
      wrap.classList.toggle("open");
    });
    wrap.appendChild(header);
    wrap.appendChild(body);
    return wrap;
  }

  /* ---------- unit section tabs (shown at top of any section-detail view) ---------- */
  var UNIT_SECTION_DEFS = [
    { key: "lex", icon: "📖", label: "ლექსიკონი" },
    { key: "lexPractice", icon: "✏️", label: "სავარჯიშოები — ლექსიკა" },
    { key: "grammar", icon: "📐", label: "გრამატიკა" },
    { key: "dialogue", icon: "💬", label: "დიალოგები" },
    { key: "reading", icon: "✏️", label: "სავარჯიშოები — წაკითხვის გაგება" }
  ];

  function unitSectionAvailable(unit, key) {
    if (key === "lex" || key === "lexPractice") return unitDecks(unit).length > 0;
    return unitTopicsByKind(unit, key).length > 0;
  }

  function gotoUnitSection(unit, key) {
    cardsSub = null;
    grammarSub = null;
    UNIT_SECTION_DEFS.forEach(function (s) { accordionOpen[unit.id + ":" + s.key] = (s.key === key); });
    if (key === "lex") {
      var decks = unitDecks(unit);
      if (decks.length === 1) { openDeckFlip(decks[0].id); return; }
    } else if (key === "grammar" || key === "dialogue" || key === "reading") {
      var topics = unitTopicsByKind(unit, key);
      if (topics.length === 1) { openTopic(topics[0].id); return; }
    }
    renderCardsView();
    renderGrammarView();
  }

  function renderUnitSectionTabs(unit, activeKey) {
    var wrap = el("div", { class: "unit-section-tabs" });
    UNIT_SECTION_DEFS.forEach(function (s) {
      if (!unitSectionAvailable(unit, s.key)) return;
      var btn = el("button", { class: "unit-section-tab" + (s.key === activeKey ? " active" : ""), type: "button" }, [
        el("span", {}, [document.createTextNode(s.icon)]),
        document.createTextNode(s.label)
      ]);
      btn.addEventListener("click", function (key) { return function () { gotoUnitSection(unit, key); }; }(s.key));
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function renderCardsView() {
    var root = document.getElementById("view-cards");
    root.innerHTML = "";
    if (cardsSub) {
      root.appendChild(renderUnitSectionTabs(currentUnitObj(), cardsMode === "flip" ? "lex" : "lexPractice"));
    }
    if (!cardsSub) {
      var unit = currentUnitObj();

      var flipAgg = { done: 0, total: 0 };
      unitDecks(unit).forEach(function (d) { var dm = deckMastery(d, "flip"); flipAgg.done += dm.green; flipAgg.total += dm.total; });
      root.appendChild(accordionSection(unit.id, "lex", "📖", "ლექსიკონი", miniProgressHtml(flipAgg.done, flipAgg.total), function (body) {
        body.appendChild(el("p", { style: "color:var(--ink-soft);margin:0 0 10px;max-width:60ch;font-size:0.85rem" }, [
          document.createTextNode("ამ თავის სიტყვები და ფრაზები — დააჭირე კომპლექტს ბარათების სანახავად.")
        ]));
        var vocabGrid = el("div", { class: "picker-grid" });
        unitDecks(unit).forEach(function (deck) {

  /* ---------- vocabulary practice: shared helpers ---------- */
  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pickDistractors(deck, correctIdx, count) {
    var pool = [];
    deck.cards.forEach(function (c, i) { if (i !== correctIdx && c.ka) pool.push(c); });
    pool = shuffleArr(pool);
    var picked = pool.slice(0, count);
    if (picked.length < count) {
      var extra = [];
      unitDecks(currentUnitObj()).forEach(function (d) { if (d.id !== deck.id) d.cards.forEach(function (c) { if (c.ka) extra.push(c); }); });
      extra = shuffleArr(extra);
      while (picked.length < count && extra.length) picked.push(extra.pop());
    }
    return picked;
  }

  /* ---------- vocabulary practice: text-to-speech ---------- */
  function hasVoiceForLang(prefix) {
    if (!window.speechSynthesis) return false;
    var voices = window.speechSynthesis.getVoices() || [];
    var re = new RegExp("^" + prefix, "i");
    return voices.some(function (v) { return re.test(v.lang); });
  }

  function speakPracticeText(text, lang, onEnd) {
    if (!window.speechSynthesis) { if (onEnd) onEnd(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    u.rate = 0.9;
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    window.speechSynthesis.speak(u);
  }

  /* ---------- vocabulary practice: mic (independent from the chat mic) ---------- */
  var practiceMicStream = null;
  var practiceRecorder = null;
  var practiceChunks = [];
  var practiceSilenceInterval = null;
  var practiceAudioCtx = null;

  function ensurePracticeMic() {
    if (practiceMicStream && practiceMicStream.getAudioTracks().some(function (t) { return t.readyState === "live"; })) {
      return Promise.resolve(practiceMicStream);
    }
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      practiceMicStream = stream;
      return stream;
    });
  }

  function stopPracticeMic() {
    stopPracticeSilenceWatcher();
    if (practiceRecorder && practiceRecorder.state === "recording") { try { practiceRecorder.stop(); } catch (e) {} }
    if (practiceMicStream) { practiceMicStream.getTracks().forEach(function (t) { t.stop(); }); practiceMicStream = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function startPracticeSilenceWatcher(stream, onSilence) {
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      practiceAudioCtx = new AudioContextClass();
      var source = practiceAudioCtx.createMediaStreamSource(stream);
      var analyserNode = practiceAudioCtx.createAnalyser();
      analyserNode.fftSize = 512;
      var data = new Uint8Array(analyserNode.frequencyBinCount);
      source.connect(analyserNode);
      var hasSpoken = false, lastLoud = Date.now(), start = Date.now();
      var MIN_RECORD_MS = 700;
      practiceSilenceInterval = setInterval(function () {
        analyserNode.getByteTimeDomainData(data);
        var sum = 0;
        for (var i = 0; i < data.length; i++) { var v = data[i] - 128; sum += v * v; }
        var rms = Math.sqrt(sum / data.length);
        var now = Date.now();
        if (now - start < MIN_RECORD_MS) return;
        if (rms > 14) { hasSpoken = true; lastLoud = now; }
        if (hasSpoken && (now - lastLoud) > 3200) { onSilence(); return; }
        if ((now - start) > 25000) { onSilence(); }
      }, 150);
    } catch (e) {}
  }
  function stopPracticeSilenceWatcher() {
    if (practiceSilenceInterval) { clearInterval(practiceSilenceInterval); practiceSilenceInterval = null; }
    if (practiceAudioCtx) { try { practiceAudioCtx.close(); } catch (e) {} practiceAudioCtx = null; }
  }

  function recordPracticeUtterance(stream, onDone) {
    var mimeType = pickRecorderMimeType();
    try {
      practiceRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
    } catch (e) {
      showPracticeNotice("ჩაწერის შეცდომა: " + e.message);
      return;
    }
    practiceChunks = [];
    practiceRecorder.addEventListener("dataavailable", function (e) {
      if (e.data && e.data.size > 0) practiceChunks.push(e.data);
    });
    practiceRecorder.addEventListener("stop", function () {
      stopPracticeSilenceWatcher();
      var base = baseMimeType(practiceRecorder.mimeType || mimeType) || "audio/webm";
      var blob = new Blob(practiceChunks, { type: base });
      onDone(blob);
    });
    practiceRecorder.start();
    startPracticeSilenceWatcher(stream, function () {
      if (practiceRecorder && practiceRecorder.state === "recording") practiceRecorder.stop();
    });
  }

  function transcribePracticeAnswer(blob, cb) {
    if (blob.size < 2000) {
      /* Too little audio to be a real answer — ask again instead of sending
         junk to Whisper (this is what caused the decode error). */
      cb(null, "TOO_SHORT");
      return;
    }
    var ext = extensionForMimeType(blob.type);
    var form = new FormData();
    form.append("file", blob, "answer." + ext);
    form.append("model", "whisper-1");
    form.append("language", "en");
    fetch(WHISPER_API_URL, {
      method: "POST",
      headers: { "Authorization": "Bearer " + getOpenAiKey() },
      body: form
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      if (!result.ok) {
        var msg = result.data && result.data.error && result.data.error.message ? result.data.error.message : "ტრანსკრიფცია ვერ შესრულდა";
        if (result.status === 401) msg = "OpenAI გასაღები არასწორია — შეამოწმე ⚙ ჩატის ტაბში.";
        cb(null, "Whisper შეცდომა: " + msg);
        return;
      }
      cb((result.data.text || "").trim(), null);
    }).catch(function (err) {
      cb(null, "კავშირის შეცდომა: " + err.message);
    });
  }

      var card = el("button", { class: "item-picker-card status-" + status, type: "button" }, [

      if (grammarTopics.length) {

        ? "<span class='hand'>ზუსტად ასეა!</span>"
        : "<span class='hand'>თითქმის!</span><span class='correct-answer'>სწორი პასუხია: " + (item.answer) + "</span>";

  function playDing() {
    if (!appSettings.soundEffects) return;
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      var ctx = new AudioContextClass();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.23);
      osc.onended = function () { ctx.close(); };
    } catch (e) {}
  }
