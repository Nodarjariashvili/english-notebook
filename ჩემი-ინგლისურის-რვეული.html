<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ჩემი ინგლისურის რვეული — Nono's English Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eee9dd;
    --paper-rule: rgba(35, 41, 31, 0.09);
    --surface: #fbf9f2;
    --ink: #23291f;
    --ink-soft: #5c5847;
    --ink-faint: #8b8672;
    --green: #2e6b4c;
    --green-ink: #1f4d37;
    --green-soft: #dbe6dc;
    --gold: #a3781f;
    --gold-soft: #f1e3c1;
    --rust: #a8432b;
    --rust-soft: #f2dbd0;
    --tab-bg: #e2d9c1;
    --tab-bg-active: var(--surface);
    --border: rgba(35, 41, 31, 0.16);
    --shadow: rgba(35, 41, 31, 0.18);
    --focus: #2e6b4c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14180f;
      --paper-rule: rgba(232, 228, 214, 0.07);
      --surface: #1b2015;
      --ink: #e9e5d7;
      --ink-soft: #aca788;
      --ink-faint: #756f57;
      --green: #6fbe8e;
      --green-ink: #8fd3a9;
      --green-soft: #1f3327;
      --gold: #e0b559;
      --gold-soft: #372c15;
      --rust: #e28468;
      --rust-soft: #3a2119;
      --tab-bg: #20261a;
      --tab-bg-active: var(--surface);
      --border: rgba(232, 228, 214, 0.14);
      --shadow: rgba(0, 0, 0, 0.45);
      --focus: #8fd3a9;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14180f;
    --paper-rule: rgba(232, 228, 214, 0.07);
    --surface: #1b2015;
    --ink: #e9e5d7;
    --ink-soft: #aca788;
    --ink-faint: #756f57;
    --green: #6fbe8e;
    --green-ink: #8fd3a9;
    --green-soft: #1f3327;
    --gold: #e0b559;
    --gold-soft: #372c15;
    --rust: #e28468;
    --rust-soft: #3a2119;
    --tab-bg: #20261a;
    --tab-bg-active: var(--surface);
    --border: rgba(232, 228, 214, 0.14);
    --shadow: rgba(0, 0, 0, 0.45);
    --focus: #8fd3a9;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --paper: #eee9dd;
    --paper-rule: rgba(35, 41, 31, 0.09);
    --surface: #fbf9f2;
    --ink: #23291f;
    --ink-soft: #5c5847;
    --ink-faint: #8b8672;
    --green: #2e6b4c;
    --green-ink: #1f4d37;
    --green-soft: #dbe6dc;
    --gold: #a3781f;
    --gold-soft: #f1e3c1;
    --rust: #a8432b;
    --rust-soft: #f2dbd0;
    --tab-bg: #e2d9c1;
    --tab-bg-active: var(--surface);
    --border: rgba(35, 41, 31, 0.16);
    --shadow: rgba(35, 41, 31, 0.18);
    --focus: #2e6b4c;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', 'Noto Sans Georgian', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(circle at 1px 1px, var(--paper-rule) 1px, transparent 0);
    background-size: 22px 22px;
    opacity: 0.5;
    z-index: 0;
  }

  h1, h2, h3, .display { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
  .hand { font-family: 'Caveat', 'Segoe Script', cursive; font-weight: 600; }
  .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); font-weight: 600; }
  button { font-family: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .desk { position: relative; z-index: 1; min-height: 100vh; display: flex; justify-content: center; padding: clamp(12px, 3vw, 40px); }
  .notebook { width: 100%; max-width: 980px; display: flex; align-items: flex-start; }

  /* --- Tab rail --- */
  .tabs { display: flex; flex-direction: column; gap: 10px; padding-top: 54px; flex-shrink: 0; z-index: 2; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    background: var(--tab-bg); color: var(--ink-soft);
    border: 1px solid var(--border); border-right: none;
    padding: 11px 16px 11px 14px; font-size: 0.92rem; font-weight: 600;
    border-radius: 10px 0 0 10px; cursor: pointer; margin-right: -1px;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    box-shadow: -2px 2px 6px var(--shadow);
    writing-mode: horizontal-tb; white-space: nowrap;
  }
  .tab:hover { transform: translateX(-2px); }
  .tab.active { background: var(--tab-bg-active); color: var(--ink); transform: translateX(-6px); border-color: var(--border); }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
  .tab .dot[data-state="green"] { background: var(--green); }
  .tab .dot[data-state="gold"] { background: var(--gold); }
  .tab .dot[data-state="rust"] { background: var(--rust); }
  .tab-divider { height: 1px; background: var(--border); margin: 4px 10px 4px 0; }
  .tab-unit { font-size: 0.82rem; font-weight: 500; padding: 8px 14px 8px 12px; opacity: 0.88; }
  .tab-unit.active { opacity: 1; }
  @media (max-width: 640px) { .tab-divider { display: none; } }

  /* --- Page surface --- */
  .page {
    flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px; box-shadow: 0 18px 40px var(--shadow), 0 2px 0 var(--border);
    position: relative; overflow: hidden;
  }
  .masthead {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px clamp(18px, 4vw, 34px); border-bottom: 2px solid var(--green);
    background: linear-gradient(180deg, var(--green-soft), transparent);
  }
  .masthead .title-block { display: flex; flex-direction: column; gap: 2px; }
  .masthead h1 { font-size: clamp(1.3rem, 2.6vw, 1.7rem); color: var(--green-ink); }
  .masthead .subtitle { color: var(--ink-soft); font-size: 0.88rem; }
  .theme-toggle {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 12px; font-size: 0.76rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: border-color 0.15s ease;
  }
  .theme-toggle:hover { border-color: var(--green); }

  .view { display: none; padding: 26px clamp(18px, 4vw, 34px) 28px; }
  .view.active { display: block; }
  .page.unit-mode #view-cards, .page.unit-mode #view-grammar { padding-top: 10px; }
  @media (min-width: 760px) {
    .page.unit-mode { display: grid; grid-template-columns: 1fr 1fr; align-items: start; column-gap: 6px; }
    .page.unit-mode #view-home { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-cards.active):not(:has(#view-grammar.active)) #view-cards { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-grammar.active):not(:has(#view-cards.active)) #view-grammar { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-cards.active):has(#view-grammar.active) #view-grammar { border-left: 1px solid var(--border); }
  }

  /* --- Dashboard --- */
  .profile-row { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 28px; }
  .id-card { flex: 1 1 300px; border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; background: var(--paper); display: flex; gap: 16px; align-items: center; }
  .avatar { width: 58px; height: 58px; border-radius: 50%; background: var(--green); color: var(--surface); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 600; flex-shrink: 0; }
  .id-card dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.86rem; }
  .id-card dt { color: var(--ink-faint); }
  .id-card dd { margin: 0; color: var(--ink); font-weight: 500; }

  .intro-card { flex: 1 1 320px; border: 1px dashed var(--border); border-radius: 10px; padding: 16px 20px; background: var(--surface); }
  .intro-card p { margin: 5px 0; font-size: 0.92rem; }
  .intro-card .blank { color: var(--green-ink); font-weight: 600; }

  .section-heading { display: flex; align-items: baseline; gap: 10px; margin: 20px 0 8px; }
  .view .section-heading:first-of-type { margin-top: 0; }
  .section-heading h2 { font-size: 1.05rem; }
  .section-heading .rule { flex: 1; height: 1px; background: var(--border); }

  .bar { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--ink-faint); border-radius: 4px; transition: width 0.5s cubic-bezier(.2,.8,.2,1); }
  .bar[data-state="green"] > span { background: var(--green); }
  .bar[data-state="gold"] > span { background: var(--gold); }
  .bar[data-state="rust"] > span { background: var(--rust); }

  /* --- Accordion sections (unit page: ლექსიკონი/გრამატიკა/დიალოგები/სავარჯიშოები) --- */
  .accordion { border: 1px solid var(--border); border-radius: 14px; background: var(--paper); margin: 0 0 10px; overflow: hidden; transition: border-color 0.15s ease; }
  .accordion.open { border-color: var(--green); }
  .accordion-header {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: none; border: none; cursor: pointer; text-align: left; font-family: inherit; color: var(--ink);
  }
  .accordion-header:hover { background: var(--surface); }
  .accordion-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; flex: 1 1 auto; }
  .accordion-icon { font-size: 1.05rem; }
  .accordion-meta { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .ring { position: relative; display: inline-block; width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto; background: conic-gradient(var(--ring-color, var(--green)) calc(var(--pct, 0) * 1%), var(--border) 0); transition: background 0.4s ease; }
  .ring-hole { position: absolute; inset: 3px; border-radius: 50%; background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .accordion-header:hover .ring-hole { background: var(--surface); }
  .ring-label { font-size: 0.56rem; font-weight: 700; color: var(--ink); }
  .accordion-chevron { color: var(--ink-faint); font-size: 0.78rem; transition: transform 0.2s ease; flex: 0 0 auto; }
  .accordion.open .accordion-chevron { transform: rotate(180deg); }
  .accordion-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
  .accordion-body > .accordion-body-inner { overflow: hidden; }
  .accordion.open .accordion-body { grid-template-rows: 1fr; }
  .accordion-body-inner { padding: 0 14px; }
  .accordion.open .accordion-body-inner { padding: 0 14px 14px; }

  /* --- Deck / topic pickers --- */
  .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .picker-card { border: 1px solid var(--border); background: var(--paper); border-radius: 10px; padding: 11px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; transition: border-color 0.15s ease, transform 0.12s ease; }
  .picker-card:hover { border-color: var(--green); transform: translateY(-2px); }
  .picker-card .ka { font-weight: 600; font-size: 1rem; }
  .picker-card .en { font-size: 0.8rem; color: var(--ink-faint); }
  .picker-card .meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }

  .back-link { background: none; border: none; color: var(--ink-soft); font-size: 0.85rem; cursor: pointer; padding: 4px 0 14px; display: inline-flex; align-items: center; gap: 6px; }
  .back-link:hover { color: var(--green-ink); }

  /* --- Flashcards --- */
  .card-stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .flip-wrap { width: min(420px, 100%); aspect-ratio: 3 / 2; perspective: 1400px; }
  .flip-card { position: relative; width: 100%; height: 100%; cursor: pointer; transition: transform 0.5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: var(--surface); box-shadow: 0 10px 26px var(--shadow); }
  .face.back { transform: rotateY(180deg); background: var(--green-soft); }
  .face .word { font-family: 'Fraunces', serif; font-size: clamp(1.4rem, 4vw, 2rem); color: var(--ink); }
  .face .ipa { color: var(--ink-faint); font-size: 0.92rem; margin-top: 4px; }
  .face .ka { font-family: 'Fraunces', serif; font-size: clamp(1.3rem, 3.6vw, 1.8rem); color: var(--green-ink); }
  .face .example { margin-top: 10px; font-size: 0.85rem; color: var(--ink-soft); max-width: 32ch; }
  .face .tap-hint { position: absolute; bottom: 10px; font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }

  .rate-row { display: flex; gap: 10px; }
  .rate-btn { border: 1px solid var(--border); background: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: border-color 0.15s ease, transform 0.1s ease; }
  .rate-btn .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .rate-btn[data-level="rust"] .swatch { background: var(--rust); }
  .rate-btn[data-level="gold"] .swatch { background: var(--gold); }
  .rate-btn[data-level="green"] .swatch { background: var(--green); }
  .rate-btn:hover { border-color: var(--ink-faint); transform: translateY(-1px); }
  .rate-btn.chosen[data-level="rust"] { background: var(--rust-soft); border-color: var(--rust); }
  .rate-btn.chosen[data-level="gold"] { background: var(--gold-soft); border-color: var(--gold); }
  .rate-btn.chosen[data-level="green"] { background: var(--green-soft); border-color: var(--green); }
  .rate-btn.chosen { animation: popIn 0.25s ease; }

  .deck-nav { display: flex; align-items: center; gap: 14px; }
  .nav-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; transition: border-color 0.15s ease, transform 0.1s ease; }
  .nav-btn:hover { border-color: var(--green); transform: scale(1.06); }
  .deck-count { font-size: 0.85rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  /* --- Quiz --- */
  .quiz-box { border: 1px solid var(--border); border-radius: 12px; padding: 22px clamp(16px, 4vw, 28px); background: var(--paper); max-width: 640px; margin: 0 auto; }
  .quiz-progress { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .quiz-prompt { font-size: 1.08rem; line-height: 1.55; margin: 6px 0 16px; }
  .quiz-prompt .blank-marker { border-bottom: 2px solid var(--ink-faint); padding: 0 6px; }
  .answer-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .answer-input { flex: 1 1 220px; padding: 11px 14px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 1rem; font-family: inherit; }
  .answer-input:focus { border-color: var(--green); }
  .check-btn { border: none; background: var(--green); color: var(--surface); padding: 11px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.92rem; transition: background 0.15s ease, transform 0.1s ease; }
  .check-btn:hover { background: var(--green-ink); transform: translateY(-1px); }
  .feedback { margin-top: 16px; display: none; align-items: flex-start; gap: 10px; }
  .feedback.show { display: flex; }
  .feedback.correct { animation: popIn 0.35s ease; }
  .feedback.wrong { animation: shake 0.4s ease; }
  .feedback .mark { width: 30px; height: 30px; flex-shrink: 0; }
  .feedback .msg { font-size: 0.94rem; padding-top: 3px; }
  .feedback .msg .hand { font-size: 1.25rem; }
  .feedback.correct .msg { color: var(--green-ink); }
  .feedback.wrong .msg { color: var(--rust); }
  .feedback .correct-answer { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 0.88rem; }
  .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .skip-btn { background: none; border: none; color: var(--ink-faint); font-size: 0.82rem; cursor: pointer; text-decoration: underline; }
  .next-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.88rem; display: none; transition: border-color 0.15s ease; }
  .next-btn:hover { border-color: var(--green); }
  .next-btn.show { display: inline-block; }

  .quiz-done { text-align: center; padding: 30px 10px; }
  .quiz-done .score { font-family: 'Fraunces', serif; font-size: 2.4rem; color: var(--green-ink); }
  .redo-btn { margin-top: 16px; border: 1px solid var(--border); background: var(--surface); padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: border-color 0.15s ease; }
  .redo-btn:hover { border-color: var(--green); }

  /* --- Reference --- */
  .ref-search { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--paper); color: var(--ink); font-size: 0.98rem; margin-bottom: 20px; }
  .ref-search:focus { border-color: var(--green); }
  .ref-group { margin-bottom: 24px; }
  .ref-group h3 { font-size: 1rem; color: var(--green-ink); margin-bottom: 10px; }
  .ref-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .ref-table tr { border-bottom: 1px solid var(--paper-rule); }
  .ref-table td { padding: 7px 8px; vertical-align: top; }
  .ref-table td.en { font-weight: 500; width: 40%; }
  .ref-table td.ipa { color: var(--ink-faint); font-size: 0.82rem; width: 22%; }
  .ref-table td.ka { color: var(--ink-soft); }
  .ref-table tr.hide { display: none; }
  .ref-empty { color: var(--ink-faint); font-size: 0.9rem; padding: 10px 0; }

  .note { font-family: 'Caveat', cursive; font-size: 1.15rem; color: var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 10px 16px; display: inline-block; margin: 14px 0 0; transform: rotate(-1deg); }

  /* --- Unit header --- */
  .unit-head { display: flex; gap: 18px; align-items: center; margin: 8px 0 10px; flex-wrap: wrap; }
  .unit-image { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 8px 20px var(--shadow); flex-shrink: 0; }
  .unit-head-text { flex: 1 1 260px; min-width: 220px; }
  .unit-head-text h2 { margin-bottom: 10px; }
  .unit-head-text .bar { max-width: 340px; }

  .progress-overview { background: var(--green-soft); border-radius: 18px; padding: 16px 16px 18px; margin: 4px 0 20px; }
  .progress-overview-title { font-weight: 700; font-size: 0.88rem; color: var(--green-ink); margin-bottom: 10px; }
  .type-progress-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 0 0 14px; }
  .type-progress-tile { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
  .type-progress-label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .type-progress-label .icon { font-size: 0.9rem; }
  .type-progress-tile .bar { margin-bottom: 5px; }
  .type-progress-count { font-size: 0.75rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .activity-card { background: var(--surface); border-radius: 12px; padding: 12px 14px; }
  .activity-title { font-weight: 700; font-size: 0.85rem; color: var(--ink); margin-bottom: 10px; }
  .activity-row { display: flex; gap: 8px; justify-content: space-between; }
  .activity-day { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--ink-faint); flex: 1 1 0; }
  .activity-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--border); border: 2px solid transparent; }
  .activity-day.active .activity-dot { background: var(--green); }
  .activity-day.today .activity-dot { border-color: var(--gold); }
  .activity-day.today { color: var(--ink); font-weight: 700; }

  /* --- Vocabulary practice modes --- */
  .mode-card-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 12px; max-width: 360px; }

  var STORAGE_KEY = "nonaEnglishNotebook.v1";
  var CARD_MODES = ["flip", "voice", "written", "mc"];

  function loadState() {
    var s;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      s = raw ? JSON.parse(raw) : { cards: {}, quiz: {} };
    } catch (e) { s = { cards: {}, quiz: {} }; }
    if (!s.cards) s.cards = {};
    if (!s.quiz) s.quiz = {};
    if (!s.activity) s.activity = {};
    /* migrate pre-existing flat {idx: level} per-deck records (before practice
       modes tracked separately) into the "flip" sub-record. */
    Object.keys(s.cards).forEach(function (deckId) {
      var rec = s.cards[deckId];
      var isOldFlat = false;
      for (var k in rec) {
        if (CARD_MODES.indexOf(k) === -1) { isOldFlat = true; break; }
      }
      if (isOldFlat) s.cards[deckId] = { flip: rec };
    });
    return s;
  }
  function dateKeyOf(d) {
    var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = "0" + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = "0" + dd;
    return d.getFullYear() + "-" + mm + "-" + dd;
  }
  function saveState() {
    if (!state.activity) state.activity = {};
    state.activity[dateKeyOf(new Date())] = true;

  }

  function normalize(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/[’‘]/g, "'")
      .replace(/[.!?]+$/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function checkMarkSvg(ok) {
    var color = ok ? "var(--green)" : "var(--rust)";
    if (ok) {

    }
    return '<svg viewBox="0 0 30 30" width="30" height="30" style="transform:rotate(3deg)"><line x1="6" y1="6" x2="24" y2="24" stroke="' + color + '" stroke-width="3.4" stroke-linecap="round"/><line x1="24" y1="6" x2="6" y2="24" stroke="' + color + '" stroke-width="3.4" stroke-linecap="round"/></svg>';
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  /* ---------- mastery helpers ---------- */
  function deckMastery(deck, mode) {
    var ratings = (state.cards[deck.id] || {})[mode || "flip"] || {};
    var total = deck.cards.length, rated = 0, green = 0;
    for (var i = 0; i < total; i++) {
      var lvl = ratings[i];
      if (lvl) { rated++; if (lvl === "green") green++; }
    }
    var pct = total ? green / total : 0;
    var colorState = rated === 0 ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { rated: rated, total: total, green: green, pct: pct, colorState: colorState };
  }
  function deckAllModesMastery(deck) {
    var sum = 0, any = false;
    CARD_MODES.forEach(function (m) {
      var dm = deckMastery(deck, m);
      sum += dm.pct;
      if (dm.rated) any = true;
    });
    var pct = sum / CARD_MODES.length;
    var colorState = !any ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState, rated: any };
  }
  function topicMastery(topic) {
    var rec = state.quiz[topic.id] || { answers: {} };
    var total = topic.items.length, attempted = 0, correct = 0;
    for (var i = 0; i < total; i++) {
      var a = rec.answers[i];
      if (a !== undefined) { attempted++; if (a) correct++; }
    }
    var pct = total ? correct / total : 0;
    var colorState = attempted === 0 ? "none" : pct >= 0.75 ? "green" : pct >= 0.4 ? "gold" : "rust";
    return { attempted: attempted, total: total, correct: correct, pct: pct, colorState: colorState };
  }
  function overallMastery(list, fn) {
    var sum = 0, cnt = 0, anyAttempt = false;
    list.forEach(function (x) {
      var m = fn(x);
      sum += m.pct; cnt++;
      if ((m.rated || m.attempted)) anyAttempt = true;
    });
    var pct = cnt ? sum / cnt : 0;
    var colorState = !anyAttempt ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState };
  }

  function unitDecks(unit) { return DECKS.filter(function (d) { return unit.deckIds.indexOf(d.id) !== -1; }); }
  function unitGrammarTopics(unit) { return GRAMMAR.filter(function (g) { return unit.grammarIds.indexOf(g.id) !== -1; }); }
  function unitTopicsByKind(unit, kind) { return unitGrammarTopics(unit).filter(function (g) { return g.kind === kind; }); }

  function unitMastery(unit) {
    var parts = unitDecks(unit).map(deckAllModesMastery).concat(unitGrammarTopics(unit).map(topicMastery));
    var sum = 0, cnt = parts.length, any = false;
    parts.forEach(function (m) { sum += m.pct; if (m.rated || m.attempted) any = true; });
    var pct = cnt ? sum / cnt : 0;
    var colorState = !any ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState };
  }

  function unitProgressCounts(unit) {
    var done = 0, total = 0;
    CARD_MODES.forEach(function (mode) {
      unitDecks(unit).forEach(function (d) { var m = deckMastery(d, mode); done += m.green; total += m.total; });
    });
    unitGrammarTopics(unit).forEach(function (t) { var m = topicMastery(t); done += m.correct; total += m.total; });
    return { done: done, total: total };
  }

  var TYPE_META = {
    flip: { icon: "📖", label: "ლექსიკონი" },

    grammar: { icon: "📐", label: "გრამატიკა" },

    reading: { icon: "📖", label: "წაკითხვის გაგება" }
  };

  function unitTypeProgress(unit) {
    var rows = [];
    var decks = unitDecks(unit);
    if (decks.length) {
      CARD_MODES.forEach(function (mode) {
        var done = 0, total = 0;
        decks.forEach(function (d) { var dm = deckMastery(d, mode); done += dm.green; total += dm.total; });
        rows.push({ key: mode, icon: TYPE_META[mode].icon, label: TYPE_META[mode].label, done: done, total: total });
      });
    }
    ["grammar", "dialogue", "reading"].forEach(function (kind) {
      var topics = unitTopicsByKind(unit, kind);
      if (!topics.length) return;
      var done = 0, total = 0;
      topics.forEach(function (t) { var tm = topicMastery(t); done += tm.correct; total += tm.total; });
      rows.push({ key: kind, icon: TYPE_META[kind].icon, label: TYPE_META[kind].label, done: done, total: total });
    });
    return rows;
  }

      var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);

  function accordionSection(unitId, key, icon, title, metaHtml, buildBody) {
    var stateKey = unitId + ":" + key;
    var isOpen = !!accordionOpen[stateKey];
    var wrap = el("div", { class: "accordion" + (isOpen ? " open" : "") });
    var header = el("button", { class: "accordion-header", type: "button" }, [
      el("span", { class: "accordion-title" }, [
        el("span", { class: "accordion-icon" }, [document.createTextNode(icon)]),

      ]),
      el("span", { class: "accordion-meta", html: metaHtml }),
      el("span", { class: "accordion-chevron" }, [document.createTextNode("▾")])
    ]);
    var body = el("div", { class: "accordion-body" });
    var inner = el("div", { class: "accordion-body-inner" });
    buildBody(inner);
    body.appendChild(inner);
    header.addEventListener("click", function () {
      accordionOpen[stateKey] = !accordionOpen[stateKey];
      wrap.classList.toggle("open");
    });

  /* ---------- vocabulary practice: shared helpers ---------- */
  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pickDistractors(deck, correctIdx, count) {
    var pool = [];
    deck.cards.forEach(function (c, i) { if (i !== correctIdx && c.ka) pool.push(c); });
    pool = shuffleArr(pool);
    var picked = pool.slice(0, count);
    if (picked.length < count) {
      var extra = [];
      unitDecks(currentUnitObj()).forEach(function (d) { if (d.id !== deck.id) d.cards.forEach(function (c) { if (c.ka) extra.push(c); }); });
      extra = shuffleArr(extra);
      while (picked.length < count && extra.length) picked.push(extra.pop());
    }
    return picked;
  }

  function markPracticeResult(deck, idx, ok, mode) {
    state.cards[deck.id] = state.cards[deck.id] || {};
    state.cards[deck.id][mode] = state.cards[deck.id][mode] || {};
    state.cards[deck.id][mode][idx] = ok ? "green" : "rust";
    saveState();
    renderTabs();
  }

  /* ---------- vocabulary practice: text-to-speech ---------- */
  function hasVoiceForLang(prefix) {
    if (!window.speechSynthesis) return false;
    var voices = window.speechSynthesis.getVoices() || [];
    var re = new RegExp("^" + prefix, "i");
    return voices.some(function (v) { return re.test(v.lang); });
  }

  function speakPracticeText(text, lang, onEnd) {
    if (!window.speechSynthesis) { if (onEnd) onEnd(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    u.rate = 0.9;
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    window.speechSynthesis.speak(u);
  }

  /* ---------- vocabulary practice: mic (independent from the chat mic) ---------- */
  var practiceMicStream = null;
  var practiceRecorder = null;
  var practiceChunks = [];
  var practiceSilenceInterval = null;
  var practiceAudioCtx = null;

  function ensurePracticeMic() {
    if (practiceMicStream && practiceMicStream.getAudioTracks().some(function (t) { return t.readyState === "live"; })) {
      return Promise.resolve(practiceMicStream);
    }
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      practiceMicStream = stream;
      return stream;
    });
  }

  function stopPracticeMic() {
    stopPracticeSilenceWatcher();
    if (practiceRecorder && practiceRecorder.state === "recording") { try { practiceRecorder.stop(); } catch (e) {} }
    if (practiceMicStream) { practiceMicStream.getTracks().forEach(function (t) { t.stop(); }); practiceMicStream = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function startPracticeSilenceWatcher(stream, onSilence) {
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      practiceAudioCtx = new AudioContextClass();
      var source = practiceAudioCtx.createMediaStreamSource(stream);
      var analyserNode = practiceAudioCtx.createAnalyser();
      analyserNode.fftSize = 512;
      var data = new Uint8Array(analyserNode.frequencyBinCount);
      source.connect(analyserNode);
      var hasSpoken = false, lastLoud = Date.now(), start = Date.now();
      var MIN_RECORD_MS = 700;
      practiceSilenceInterval = setInterval(function () {
        analyserNode.getByteTimeDomainData(data);
        var sum = 0;
        for (var i = 0; i < data.length; i++) { var v = data[i] - 128; sum += v * v; }
        var rms = Math.sqrt(sum / data.length);
        var now = Date.now();
        if (now - start < MIN_RECORD_MS) return;
        if (rms > 14) { hasSpoken = true; lastLoud = now; }
        if (hasSpoken && (now - lastLoud) > 3200) { onSilence(); return; }
        if ((now - start) > 25000) { onSilence(); }
      }, 150);
    } catch (e) {}
  }
  function stopPracticeSilenceWatcher() {
    if (practiceSilenceInterval) { clearInterval(practiceSilenceInterval); practiceSilenceInterval = null; }
    if (practiceAudioCtx) { try { practiceAudioCtx.close(); } catch (e) {} practiceAudioCtx = null; }
  }

  function recordPracticeUtterance(stream, onDone) {
    var mimeType = pickRecorderMimeType();
    try {
      practiceRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
    } catch (e) {
      showPracticeNotice("ჩაწერის შეცდომა: " + e.message);
      return;
    }
    practiceChunks = [];
    practiceRecorder.addEventListener("dataavailable", function (e) {
      if (e.data && e.data.size > 0) practiceChunks.push(e.data);
    });
    practiceRecorder.addEventListener("stop", function () {
      stopPracticeSilenceWatcher();
      var base = baseMimeType(practiceRecorder.mimeType || mimeType) || "audio/webm";
      var blob = new Blob(practiceChunks, { type: base });
      onDone(blob);
    });
    practiceRecorder.start();
    startPracticeSilenceWatcher(stream, function () {
      if (practiceRecorder && practiceRecorder.state === "recording") practiceRecorder.stop();
    });
  }

  function showPracticeNotice(msg) {
    var n = document.getElementById("practiceNotice");
    if (n) { n.textContent = msg; n.style.display = "block"; }
  }
  function hidePracticeNotice() {
    var n = document.getElementById("practiceNotice");

  function setPracticeStatus(state, label) {
    var s = document.getElementById("practiceStatus");
    if (!s) return;
    s.textContent = label || "";
    s.className = "practice-status" + (label ? " show" : "") + (state ? " state-" + state : "");

  /* ---------- exercise 1: voice translation (KA spoken -> EN spoken) ---------- */
  function renderVoicePractice(root) {
    var deck = DECKS.filter(function (d) { return d.id === cardsSub; })[0];
    practiceHeader(root, deck, "ხმოვანი თარგმანი");
    if (practicePos >= deck.cards.length) { renderPracticeDone(root, deck, "voice"); return; }

    var item = deck.cards[practicePos];
    var box = el("div", { class: "practice-box" });
    box.appendChild(el("div", { class: "practice-progress" }, [document.createTextNode((practicePos + 1) + " / " + deck.cards.length)]));
    box.appendChild(el("div", { class: "bar", "data-state": "green" }, [el("span", { style: "width:" + Math.round((practicePos / deck.cards.length) * 100) + "%" })]));
    box.appendChild(el("div", { class: "practice-prompt-ka" }, [document.createTextNode(item.ka)]));

    var micBtn = el("button", { class: "practice-mic-btn", id: "practiceMicBtn", type: "button", title: "პასუხის თქმა" }, [document.createTextNode("🎙")]);
    box.appendChild(micBtn);
    box.appendChild(el("div", { class: "practice-status", id: "practiceStatus" }));
    box.appendChild(el("div", { class: "chat-error", id: "practiceNotice", style: "display:none" }));
    box.appendChild(el("div", { class: "feedback", id: "practiceFeedback" }));
    root.appendChild(box);

    function askAgain() {
      hidePracticeNotice();
      var fb = document.getElementById("practiceFeedback");
      if (fb) fb.className = "feedback";
      if (hasVoiceForLang("ka")) {
        setPracticeStatus("speaking", "ისმენ ქართულ სიტყვას...");
        speakPracticeText(item.ka, "ka-GE", function () { listenForAnswer(); });
      } else {
        listenForAnswer();
      }
    }

    function listenForAnswer() {
      if (!getOpenAiKey()) {
        showPracticeNotice("ხმოვანი სავარჯიშოსთვის საჭიროა OpenAI API გასაღები — დაამატე ⚙ ჩატის ტაბში.");
        setPracticeStatus("", "");
        return;
      }
      setPracticeStatus("listening", "გისმენ...");
      ensurePracticeMic().then(function (stream) {
        recordPracticeUtterance(stream, function (blob) {
          setPracticeStatus("processing", "ვამუშავებ...");
          transcribePracticeAnswer(blob, function (heard, err) {
            if (err === "TOO_SHORT") { listenForAnswer(); return; }
            if (err) { showPracticeNotice(err); setPracticeStatus("", ""); return; }
            evaluateVoiceAnswer(deck, item, heard);
          });
        });
      }).catch(function (err) {
        showPracticeNotice("მიკროფონზე წვდომა ვერ მოხერხდა: " + err.message);
        setPracticeStatus("", "");
      });
    }

    function evaluateVoiceAnswer(deck, item, heard) {
      var accepted = [item.en].concat(item.accept || []).map(normalize);
      var ok = accepted.indexOf(normalize(heard)) !== -1;
      markPracticeResult(deck, practicePos, ok, "voice");
      var fb = document.getElementById("practiceFeedback");
      if (fb) {
        fb.className = "feedback show " + (ok ? "correct" : "wrong");
        fb.innerHTML = "<span class='mark'>" + checkMarkSvg(ok) + "</span><span class='msg'>" +
          (ok
            ? "<span class='hand'>ზუსტად ასეა!</span> — გავიგონე: \"" + chatEscapeHtml(heard) + "\""
            : "<span class='hand'>თითქმის!</span><span class='correct-answer'>გავიგონე: \"" + chatEscapeHtml(heard) + "\" — სწორი პასუხია: " + item.en + "</span>") +
          "</span>";
      }
      if (ok) {
        setPracticeStatus("speaking", "პასუხობს...");
        speakPracticeText(item.en, "en-US", function () { practicePos++; renderCardsView(); });
      } else {
        setPracticeStatus("speaking", "სწორი პასუხი...");
        speakPracticeText("Not quite. The correct answer is: " + item.en, "en-US", function () {
          askAgain();
        });
      }
    }

    micBtn.addEventListener("click", listenForAnswer);
    askAgain();
  }

  function transcribePracticeAnswer(blob, cb) {
    if (blob.size < 2000) {
      /* Too little audio to be a real answer — ask again instead of sending
         junk to Whisper (this is what caused the decode error). */
      cb(null, "TOO_SHORT");
      return;
    }
    var ext = extensionForMimeType(blob.type);
    var form = new FormData();
    form.append("file", blob, "answer." + ext);
    form.append("model", "whisper-1");
    form.append("language", "en");
    fetch(WHISPER_API_URL, {
      method: "POST",
      headers: { "Authorization": "Bearer " + getOpenAiKey() },
      body: form
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      if (!result.ok) {
        var msg = result.data && result.data.error && result.data.error.message ? result.data.error.message : "ტრანსკრიფცია ვერ შესრულდა";
        if (result.status === 401) msg = "OpenAI გასაღები არასწორია — შეამოწმე ⚙ ჩატის ტაბში.";
        cb(null, "Whisper შეცდომა: " + msg);
        return;
      }
      cb((result.data.text || "").trim(), null);
    }).catch(function (err) {
      cb(null, "კავშირის შეცდომა: " + err.message);
    });
  }

      state.quiz[topic.id] = state.quiz[topic.id] || { answers: {} };

    function showFeedback(ok, revealed) {
      feedback.className = "feedback show " + (ok ? "correct" : "wrong");

    checkBtn.addEventListener("click", function () {

    }

      passages.push("PASSAGE — Keira & Liam's routines: \"Keira gets up at 2 a.m., showers, gets dressed, leaves home at 3 a.m., gets to work at 3.30, has a quick breakfast at work, reads the plan for the morning — her breakfast TV program starts at 5 a.m. Liam gets up at 3 p.m., spends time with family, leaves for work at 8.30 p.m. because he worries about traffic, starts work at 10 p.m. at the hospital helping patients and doctors, has coffee and a snack instead of lunch, finishes at 6 a.m., has dinner, gets home at 7 a.m. and goes to bed exhausted.\"");
    }

    var lines = [
      "You are " + PROFILE.nameEn + "'s friendly English conversation partner for spoken/written practice.",
      "",
      "Learner profile: " + PROFILE.nameEn + " (" + PROFILE.name + ") " + PROFILE.surnameEn + ", " + PROFILE.age + ", from " + PROFILE.countryEn + ", lives in " + PROFILE.cityEn + ", works as a " + PROFILE.jobEn + ".",
      "She is an elementary (A1-A2) English learner working through Unit 1 of a textbook called \"Speaking Tags.\"",

      lines.push("This conversation is a THEMED PRACTICE SESSION focused specifically on " + scopedUnit.ka + " — keep it centered on this unit's material only, don't wander into other units' vocabulary or grammar.");
      lines.push("");
      if (wordList) {
        lines.push("The exact vocabulary she knows for this unit is: " + wordList + ".");
        lines.push("STRICT RULE: use ONLY words from this list (plus basic A1 function words: a, the, is, am, are, was, were, in, on, at, and, but, or, I, you, he, she, it, we, they, this, that, do, does, don't, doesn't, have, has, my, your, his, her, its, our, their, yes, no, please, thank you). Do NOT introduce new content vocabulary beyond this unit's list, even if it would be natural in a normal conversation.");
        lines.push("A small drift in topic is fine (e.g. a related follow-up question), but never let the vocabulary or grammar get harder than this unit's level — if you need a concept outside the list, rephrase it using only the words above.");
        lines.push("");
      }
    }
    lines.push("Vocabulary topics she has studied — steer the conversation toward these: " + deckTopics + ".");
    lines.push("Grammar she has studied — stay within this level: " + grammarTopics + ".");
    lines.push("");
    if (passages.length) {
      lines.push("She has also read " + (passages.length > 1 ? "these passages" : "this passage") + " from her textbook, and can be quizzed on " + (passages.length > 1 ? "them" : "it") + " by voice:");
      passages.forEach(function (p) { lines.push(p); });
      lines.push("When she asks to be quizzed on a passage, ask her simple comprehension questions about it ONE AT A TIME in English, wait for her spoken answer, gently confirm or correct the factual content in your reply, and continue with the next question — in addition to the grammar correction in has_correction/corrected/explanation.");

      "3. Never blend the correction into the reply — keep them completely separate."
    ];

    if (scopedUnit) {
      var badge = el("div", { class: "chat-scope-badge" }, [document.createTextNode("თემა: " + scopedUnit.ka)]);
      var clearBtn = el("button", { type: "button", title: "ზოგად ჩატზე დაბრუნება" }, [document.createTextNode("✕")]);
      clearBtn.addEventListener("click", function () {
        chatScopeUnit = null; chatHistory = []; chatStarted = false;
        renderChatView();
      });
      badge.appendChild(clearBtn);
      topbar.appendChild(badge);
    } else {
      topbar.appendChild(el("span", {}));
    }
    var settingsBtn = el("button", { class: "chat-icon-btn", type: "button", title: "API გასაღებების მართვა" }, [document.createTextNode("⚙")]);
    settingsBtn.addEventListener("click", function () {
      chatSettingsOpen = true;
      renderChatView();
    });
    topbar.appendChild(settingsBtn);
    root.appendChild(topbar);

    if (!scopedUnit) {
      var modeBox = el("div", { class: "chat-mode-row" });
      modeBox.appendChild(el("span", { class: "chat-mode-label" }, [document.createTextNode("📘 თემატური საუბარი კონკრეტულ თავზე:")]));
      var unitChips = el("div", { class: "chat-unit-chips" });
      UNITS.forEach(function (u) {
        var chip = el("button", { class: "chat-chip", type: "button" }, [document.createTextNode(u.short)]);
        chip.addEventListener("click", function (id) { return function () { pickChatUnit(id); }; }(u.id));
        unitChips.appendChild(chip);
      });
      modeBox.appendChild(unitChips);
      root.appendChild(modeBox);
    }

    var errorBanner = el("div", { class: "chat-error", id: "chatErrorBanner", style: "display:none" });
    root.appendChild(errorBanner);

    var chips = el("div", { class: "chat-chips" });
    [
      ["მისალმება", "Hello! My name is Nono."],
      ["ოჯახი", "I want to talk about my family."],
      ["დღის რეჟიმი", "Let's talk about my daily routine."],
      ["მოწონება/არმოწონება", "I want to talk about things I like and dislike."],
      ["კითხვები ჩემზე", "Can you ask me questions about myself?"],
      ["ჯეიქობის ოჯახზე კითხვები", "Can you quiz me about Jacob's family from the reading?"],
      ["კეირასა და ლიამზე", "Can you quiz me about Keira and Liam's daily routines?"]
    ].forEach(function (pair) {
      var chip = el("button", { class: "chat-chip", type: "button" }, [document.createTextNode(pair[0])]);
      chip.addEventListener("click", function () {
        var ta = document.getElementById("chatUserInput");
        ta.value = pair[1];
        ta.focus();
      });
      chips.appendChild(chip);
    });
    root.appendChild(chips);

    var messagesEl = el("div", { class: "chat-messages", id: "chatMessages" });
    root.appendChild(messagesEl);

    var inputBar = el("div", { class: "chat-input-bar" });
    var micBtn = el("button", { class: "chat-mic-btn", id: "chatMicBtn", type: "button", title: "ხმოვანი დიალოგის დაწყება" }, [document.createTextNode("🎙")]);
    var textarea = el("textarea", { id: "chatUserInput", rows: "1", placeholder: "დაწერე ინგლისურად ან დააჭირე 🎙-ს ხმოვანი დიალოგისთვის..." });
    var sendBtn = el("button", { class: "chat-send-btn", id: "chatSendBtn", type: "button" }, [document.createTextNode("➤")]);
    inputBar.appendChild(micBtn);
    inputBar.appendChild(textarea);
    inputBar.appendChild(sendBtn);
    root.appendChild(inputBar);
    var statusEl = el("div", { class: "chat-voice-status", id: "chatVoiceStatus" }, [el("span", { class: "pulse-dot" }), el("span", { id: "chatVoiceStatusText" })]);
    root.appendChild(statusEl);

    sendBtn.addEventListener("click", function () { sendChatMessage(); });
    micBtn.addEventListener("click", toggleVoiceMode);
    textarea.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    });
    textarea.addEventListener("input", function () {
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
    });

    updateMicButton();
    if (voiceModeOn) setVoiceStatus(voiceState || "listening");

    if (!chatStarted) {
      chatStarted = true;
      addChatBubble("assistant", "Hi Nono! 😊 How are you today? Let's practice some English — tell me about your day, or pick a topic above to get started.", null);
    } else {
      chatHistory.forEach(function (m) {
        if (m.role === "user") addChatBubble("user", m.content, null);
        else addChatBubble("assistant", m.content, null);
      });
    }
    textarea.focus();
  }

  function addChatBubble(role, text, correction) {
    var messagesEl = document.getElementById("chatMessages");
    if (!messagesEl) return;
    var wrap = el("div", { class: "chat-msg " + role });
    var bubbleRow = el("div", { class: "chat-bubble-row" });
    bubbleRow.appendChild(el("div", { class: "chat-bubble", html: chatEscapeHtml(text) }));
    if (role === "assistant") {
      var speakBtn = el("button", { class: "chat-speak-btn", type: "button", title: "ხმამაღლა მოსმენა" }, [document.createTextNode("🔊")]);
      speakBtn.addEventListener("click", function () { speakChatText(text); });
      bubbleRow.appendChild(speakBtn);
    }
    wrap.appendChild(bubbleRow);
    if (correction && correction.has_correction) {
      wrap.appendChild(el("div", { class: "chat-correction", html:
        "<span class='label'>შესწორება:</span> <strong>" + chatEscapeHtml(correction.corrected) + "</strong> — " + chatEscapeHtml(correction.explanation)
      }));
    }
    messagesEl.appendChild(wrap);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function addChatTyping() {
    var messagesEl = document.getElementById("chatMessages");
    if (!messagesEl) return;
    var wrap = el("div", { class: "chat-msg assistant", id: "chatTyping" });
    wrap.appendChild(el("div", { class: "chat-bubble chat-typing", html: "<span></span><span></span><span></span>" }));
    messagesEl.appendChild(wrap);
    window.scrollTo(0, document.body.scrollHeight);
  }
  function removeChatTyping() {
    var el2 = document.getElementById("chatTyping");
    if (el2) el2.remove();
  }

  function showChatError(msg) {
    var banner = document.getElementById("chatErrorBanner");
    if (!banner) return;
    banner.textContent = msg;
    banner.style.display = "block";
  }
  function hideChatError() {
    var banner = document.getElementById("chatErrorBanner");
    if (banner) banner.style.display = "none";
  }

  function sendChatMessage(voiceText) {
    var isVoiceTurn = typeof voiceText === "string";
    var textarea = document.getElementById("chatUserInput");
    var sendBtn = document.getElementById("chatSendBtn");
    var text = isVoiceTurn ? voiceText.trim() : (textarea ? textarea.value.trim() : "");
    if (!text) {
      if (voiceModeOn) resumeListening();
      return;
    }
    hideChatError();
    addChatBubble("user", text, null);
    chatHistory.push({ role: "user", content: text });
    if (!isVoiceTurn && textarea) { textarea.value = ""; textarea.style.height = "auto"; }
    if (sendBtn) sendBtn.disabled = true;
    addChatTyping();
    if (voiceModeOn) setVoiceStatus("processing");

    fetch(CHAT_API_URL, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": getChatKey(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: CHAT_MODEL,
        max_tokens: 700,
        system: buildSystemPrompt(),
        messages: chatHistory,
        output_config: {
          effort: "medium",
          format: { type: "json_schema", schema: CHAT_OUTPUT_SCHEMA }
        }
      })
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      removeChatTyping();
      if (!result.ok) {
        if (result.status === 401) {
          showChatError("API გასაღები არასწორია ან ვადაგასულია. გთხოვ შეამოწმე ⚙ მენიუში.");
        } else if (result.status === 429) {
          showChatError("მოთხოვნები ძალიან ხშირია (rate limit) — მოიცადე ცოტა ხანი და სცადე ისევ.");
        } else {
          showChatError("შეცდომა: " + (result.data && result.data.error && result.data.error.message ? result.data.error.message : "უცნობი შეცდომა"));
        }
        chatHistory.pop();
        if (sendBtn) sendBtn.disabled = false;
        if (voiceModeOn) exitVoiceMode();
        return;
      }
      var content = result.data.content || [];
      var textBlock = null;
      for (var i = 0; i < content.length; i++) {
        if (content[i].type === "text") { textBlock = content[i]; break; }
      }
      if (!textBlock) {
        showChatError("პასუხი ვერ მოვიდა — სცადე ისევ.");
        if (sendBtn) sendBtn.disabled = false;
        if (voiceModeOn) exitVoiceMode();
        return;
      }
      var parsed = JSON.parse(textBlock.text);
      addChatBubble("assistant", parsed.reply, parsed);
      chatHistory.push({ role: "assistant", content: parsed.reply });
      if (sendBtn) sendBtn.disabled = false;
      if (voiceModeOn) {
        setVoiceStatus("speaking");
        speakChatTextAuto(parsed);
      } else if (!isVoiceTurn && textarea) {
        textarea.focus();
      }
    }).catch(function (err) {
      removeChatTyping();
      showChatError("კავშირის შეცდომა: " + err.message);
      chatHistory.pop();
      if (sendBtn) sendBtn.disabled = false;
      if (voiceModeOn) exitVoiceMode();
    });
  }

  /* ---------- voice: status indicator ---------- */
  var VOICE_STATUS_LABELS = { listening: "გისმენ...", processing: "ვამუშავებ...", speaking: "პასუხობს..." };

  function setVoiceStatus(state) {
    voiceState = state;
    var wrap = document.getElementById("chatVoiceStatus");
    var text = document.getElementById("chatVoiceStatusText");
    if (!wrap || !text) return;
    text.textContent = VOICE_STATUS_LABELS[state] || "";
    wrap.className = "chat-voice-status show state-" + state;
  }
  function hideVoiceStatus() {
    voiceState = "";
    var wrap = document.getElementById("chatVoiceStatus");
    if (wrap) wrap.className = "chat-voice-status";
  }

  /* ---------- voice: text-to-speech ---------- */
  function speakChatText(text) {
    if (!window.speechSynthesis) {
      showChatError("ეს ბრაუზერი ხმის სინთეზს ვერ უჭერს მხარს.");
      return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }

  /* Speaks the assistant's reply and, when the turn included a correction,
     follows it with a spoken correction (English phrase + Georgian
     explanation if a Georgian voice is available) before resuming
     listening — so a mistake is corrected out loud, not just shown as text. */
  function speakChatTextAuto(parsed) {
    if (!window.speechSynthesis) {
      if (voiceModeOn) resumeListening();
      return;
    }
    window.speechSynthesis.cancel();

    var utterances = [];
    var mainU = new SpeechSynthesisUtterance(parsed.reply);
    mainU.lang = "en-US";
    mainU.rate = 0.95;
    utterances.push(mainU);

    if (parsed.has_correction && parsed.corrected) {
      var correctionEn = new SpeechSynthesisUtterance("Quick correction — the right way to say that is: " + parsed.corrected);
      correctionEn.lang = "en-US";
      correctionEn.rate = 0.92;
      utterances.push(correctionEn);
      if (parsed.explanation && hasVoiceForLang("ka")) {
        var correctionKa = new SpeechSynthesisUtterance(parsed.explanation);
        correctionKa.lang = "ka-GE";
        correctionKa.rate = 0.95;
        utterances.push(correctionKa);
      }
    }

    var last = utterances[utterances.length - 1];
    last.onend = function () { if (voiceModeOn) resumeListening(); };
    last.onerror = function () { if (voiceModeOn) resumeListening(); };
    utterances.forEach(function (u) { window.speechSynthesis.speak(u); });
  }

  /* ---------- voice: continuous hands-free dialogue mode ----------
     One getUserMedia() permission request per voice-mode session: the
     mic MediaStream is acquired once in enterVoiceMode() and reused for
     every recording turn (a fresh MediaRecorder per turn, same stream) —
     it's only released when the mode is exited. This is what keeps the
     browser from re-prompting for microphone access on every turn. */
  var voiceStream = null;

  function toggleVoiceMode() {
    if (voiceModeOn) exitVoiceMode(); else enterVoiceMode();
  }

  function enterVoiceMode() {
    hideChatError();
    if (!getOpenAiKey()) {
      showChatError("ხმოვანი დიალოგისთვის საჭიროა OpenAI API გასაღები — დაამატე ⚙ მენიუში.");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      showChatError("ეს ბრაუზერი მიკროფონის ჩაწერას ვერ უჭერს მხარს.");
      return;
    }
    voiceModeOn = true;
    updateMicButton();
    setVoiceStatus("listening");
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (!voiceModeOn) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      voiceStream = stream;
      beginRecordingTurn();
    }).catch(function (err) {
      showChatError("მიკროფონზე წვდომა ვერ მოხერხდა: " + err.message);
      voiceModeOn = false;
      updateMicButton();
      hideVoiceStatus();
    });
  }

  function exitVoiceMode() {
    voiceModeOn = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (mediaRecorder && mediaRecorder.state === "recording") {
      recordingCancelled = true;
      mediaRecorder.stop();
    }
    stopSilenceWatcher();
    teardownAnalyser();
    if (voiceStream) {
      voiceStream.getTracks().forEach(function (t) { t.stop(); });
      voiceStream = null;
    }
    isRecording = false;
    updateMicButton();
    hideVoiceStatus();
  }

  function resumeListening() {
    if (!voiceModeOn) return;
    setVoiceStatus("listening");
    var trackLive = voiceStream && voiceStream.getAudioTracks().some(function (t) { return t.readyState === "live"; });
    if (trackLive) {
      beginRecordingTurn();
      return;
    }
    /* Mic track ended unexpectedly (e.g. device unplugged) — re-acquire once. */
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (!voiceModeOn) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      voiceStream = stream;
      beginRecordingTurn();
    }).catch(function (err) {
      showChatError("მიკროფონზე წვდომა ვერ მოხერხდა: " + err.message);
      exitVoiceMode();
    });
  }

  function updateMicButton() {
    var btn = document.getElementById("chatMicBtn");
    if (!btn) return;
    btn.classList.toggle("recording", isRecording);
    btn.classList.toggle("voice-active", voiceModeOn);
    if (voiceModeOn) {
      btn.textContent = "⏹";
      btn.title = "ხმოვანი დიალოგის შეწყვეტა";
    } else {
      btn.textContent = "🎙";
      btn.title = "ხმოვანი დიალოგის დაწყება";
    }
  }

  /* ---------- voice: speech-to-text via MediaRecorder + Whisper ---------- */
  function pickRecorderMimeType() {
    var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/mp4;codecs=mp4a.40.2", "audio/ogg;codecs=opus"];
    for (var i = 0; i < candidates.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return "";
  }

  /* The MediaRecorder needs the full "audio/webm;codecs=opus" string to pick
     the right encoder, but Whisper's format-sniffing gets confused when that
     same codecs parameter rides along as the uploaded file's Content-Type —
     that mismatch is what produced "audio file could not be decoded". Strip
     it down to the bare container type ("audio/webm") for the Blob/upload. */
  function baseMimeType(m) {
    return m ? m.split(";")[0] : "";
  }

  function extensionForMimeType(base) {
    if (base.indexOf("mp4") !== -1) return "m4a";
    if (base.indexOf("ogg") !== -1) return "ogg";
    if (base.indexOf("wav") !== -1) return "wav";
    return "webm";
  }

  function beginRecordingTurn() {
    if (!voiceStream) {
      showChatError("მიკროფონის ნაკადი ვერ მოიძებნა.");
      exitVoiceMode();
      return;
    }
    var mimeType = pickRecorderMimeType();
    try {
      mediaRecorder = mimeType ? new MediaRecorder(voiceStream, { mimeType: mimeType }) : new MediaRecorder(voiceStream);
    } catch (e) {
      showChatError("ჩაწერის დაწყება ვერ მოხერხდა: " + e.message);
      exitVoiceMode();
      return;
    }
    audioChunks = [];
    mediaRecorder.addEventListener("dataavailable", function (e) {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    });
    mediaRecorder.addEventListener("stop", function () {
      stopSilenceWatcher();
      isRecording = false;
      updateMicButton();
      if (recordingCancelled) { recordingCancelled = false; return; }
      var base = baseMimeType(mediaRecorder.mimeType || mimeType) || "audio/webm";
      var blob = new Blob(audioChunks, { type: base });
      handleVoiceTurn(blob);
    });
    mediaRecorder.start();
    isRecording = true;
    updateMicButton();
    startSilenceWatcher(voiceStream);
  }

  function stopRecordingForSilence() {
    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  }

  /* Web Audio API AnalyserNode: watches mic input level and auto-stops
     recording after ~2.5s of silence (following at least a bit of speech),
     or after a hard cap so a stuck mic can't record forever. The
     AudioContext/analyser are created once per voice-mode session
     (ensureAnalyser) and just re-armed each turn — not recreated. */
  function ensureAnalyser(stream) {
    if (analyser) return true;
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return false;
      audioCtx = new AudioContextClass();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      return true;
    } catch (e) {
      return false;
    }
  }

  function teardownAnalyser() {
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    analyser = null;
  }

  function startSilenceWatcher(stream) {
    if (!ensureAnalyser(stream)) return;
    var data = new Uint8Array(analyser.frequencyBinCount);
    var SPEECH_RMS_THRESHOLD = 14;
    var SILENCE_MS = 4000;
    var MAX_RECORD_MS = 60000;
    var MIN_RECORD_MS = 700;
    var hasSpoken = false;
    var lastLoudTs = Date.now();
    var startTs = Date.now();

    silenceCheckInterval = setInterval(function () {
      if (!analyser) return;
      analyser.getByteTimeDomainData(data);
      var sumSq = 0;
      for (var i = 0; i < data.length; i++) {
        var v = data[i] - 128;
        sumSq += v * v;
      }
      var rms = Math.sqrt(sumSq / data.length);
      var now = Date.now();
      if (now - startTs < MIN_RECORD_MS) return;
      if (rms > SPEECH_RMS_THRESHOLD) { hasSpoken = true; lastLoudTs = now; }
      if (hasSpoken && (now - lastLoudTs) > SILENCE_MS) { stopRecordingForSilence(); return; }
      if ((now - startTs) > MAX_RECORD_MS) { stopRecordingForSilence(); }
    }, 150);
  }

  function stopSilenceWatcher() {
    if (silenceCheckInterval) { clearInterval(silenceCheckInterval); silenceCheckInterval = null; }
  }

  function handleVoiceTurn(blob) {
    if (!voiceModeOn) return;
    if (blob.size < 2000) {
      /* Too little audio to be a real answer (mic blip, or silence-detection
         fired before any speech) — re-listen instead of sending junk to Whisper. */
      resumeListening();
      return;
    }
    setVoiceStatus("processing");
    var ext = extensionForMimeType(blob.type);
    var form = new FormData();
    form.append("file", blob, "recording." + ext);
    form.append("model", "whisper-1");
    form.append("language", "en");

    fetch(WHISPER_API_URL, {
      method: "POST",
      headers: { "Authorization": "Bearer " + getOpenAiKey() },
      body: form
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      if (!voiceModeOn) return;
      if (!result.ok) {
        var msg = result.data && result.data.error && result.data.error.message ? result.data.error.message : "ტრანსკრიფცია ვერ შესრულდა";
        if (result.status === 401) msg = "OpenAI გასაღები არასწორია — შეამოწმე ⚙ მენიუში.";
        showChatError("Whisper შეცდომა: " + msg);
        exitVoiceMode();
        return;
      }
      var text = (result.data.text || "").trim();
      if (!text) { resumeListening(); return; }
      sendChatMessage(text);
    }).catch(function (err) {
      if (!voiceModeOn) return;
      showChatError("კავშირის შეცდომა (Whisper): " + err.message);
      exitVoiceMode();
    });
  }

  /* ---------- theme ---------- */
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem("nonaEnglishNotebook.theme"); } catch (e) {}
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    document.getElementById("themeToggle").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var effectiveDark = cur ? cur === "dark" : prefersDark;
      var next = effectiveDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("nonaEnglishNotebook.theme", next); } catch (e) {}
    });
  }

  initTheme();
  switchView("home");
})();
</script>

</body>
