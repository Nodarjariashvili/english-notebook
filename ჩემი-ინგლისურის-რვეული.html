    }

    micBtn.addEventListener("click", listenForAnswer);
    askAgain();
  }

  /* Vocabulary hint for the speech-to-text model: telling it which words
     the learner is practising makes it far less likely to drop or mishear
     them (especially with a non-native accent). */
  function transcriptionHint() {
    var scopedUnit = chatScopeUnit ? UNITS.filter(function (u) { return u.id === chatScopeUnit; })[0] : null;
    var decks = scopedUnit ? unitDecks(scopedUnit) : DECKS;
    var words = [];
    decks.forEach(function (d) { d.cards.forEach(function (c) { words.push(c.en); }); });
    var hint = "An English learner from Georgia is speaking simple English. Words they practise: " + words.join(", ");
    return hint.length > 900 ? hint.slice(0, 900) : hint;
  }

  function transcribePracticeAnswer(blob, cb) {
    if (blob.size < 2000) {
      /* Too little audio to be a real answer — ask again instead of sending
         junk to Whisper (this is what caused the decode error). */
      cb(null, "TOO_SHORT");
      return;
    }
    var ext = extensionForMimeType(blob.type);
    var form = new FormData();
    form.append("file", blob, "answer." + ext);
    form.append("model", TRANSCRIBE_MODEL);
    form.append("language", "en");
    form.append("prompt", transcriptionHint());
    postToEdgeFunction(WHISPER_FUNCTION_URL, {}, form).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      if (!result.ok) {
        var msg = result.data && result.data.error && result.data.error.message ? result.data.error.message : "ტრანსკრიფცია ვერ შესრულდა";
        if (result.status === 429) msg = "დღიური ლიმიტი ამოიწურა — სცადე ხვალ, ან განაახლე Premium-ზე მაღალი ლიმიტისთვის.";
        if (result.status === 401) msg = "სესია ვადაგასულია — გთხოვ თავიდან შედი ანგარიშზე.";
        console.error("transcribePracticeAnswer: Whisper error", result.status, result.data);
        cb(null, "Whisper შეცდომა: " + msg);
        return;
      }
      cb((result.data.text || "").trim(), null);
    }).catch(function (err) {
      cb(null, "კავშირის შეცდომა: " + err.message);
    });
  }

    if (practicePos >= deck.cards.length) { renderPracticeDone(root, deck, "mc"); return; }

    var item = deck.cards[practicePos];
    var box = el("div", { class: "practice-box" });
    box.appendChild(el("div", { class: "practice-progress" }, [document.createTextNode((practicePos + 1) + " / " + deck.cards.length)]));
    box.appendChild(el("div", { class: "bar", "data-state": "green" }, [el("span", { style: "width:" + Math.round((practicePos / deck.cards.length) * 100) + "%" })]));
    box.appendChild(el("div", { class: "practice-prompt-en" }, [document.createTextNode(item.en)]));
    if (item.ipa) box.appendChild(el("div", { class: "practice-ipa" }, [document.createTextNode(item.ipa)]));

    var speakBtn = el("button", { class: "chat-speak-btn", type: "button", title: "მოსმენა" }, [document.createTextNode("🔊")]);
    speakBtn.addEventListener("click", function () { speakPracticeText(item.en, "en-US"); });
    box.appendChild(speakBtn);

    var options = item.ka ? shuffleArr([item].concat(pickDistractors(deck, practicePos, 3))) : [item];
    var answered = false;
    var optWrap = el("div", { class: "mc-options" });
    options.forEach(function (opt) {
      var optBtn = el("button", { class: "mc-option", type: "button" }, [document.createTextNode(opt.ka)]);
      optBtn.addEventListener("click", function () {
        if (answered) return;
        var ok = opt === item;
        if (ok) {
          answered = true;
          optBtn.classList.add("correct");
          burstConfettiEl(optBtn);
          markPracticeResult(deck, practicePos, true, "mc");
          setPracticeStatus("speaking", "პასუხობს...");
          speakPracticeText(item.en, "en-US", function () { practicePos++; renderCardsView(); });
        } else {
          optBtn.classList.add("wrong");
          markPracticeResult(deck, practicePos, false, "mc");
        }
      });
      optWrap.appendChild(optBtn);
    });
    box.appendChild(optWrap);
    box.appendChild(el("div", { class: "practice-status", id: "practiceStatus" }));
    root.appendChild(box);

    speakPracticeText(item.en, "en-US");
  }

  /* ---------- grammar quiz ---------- */
  var quizPos = {};
  var quizItemOpen = {};

  function openTopic(id) { grammarSub = id; quizItemOpen[id] = false; renderGrammarView(); }
  function openQuizItem(topicId, idx) { quizPos[topicId] = idx; quizItemOpen[topicId] = true; renderGrammarView(); }
  function backToQuizList(topicId) { quizItemOpen[topicId] = false; renderGrammarView(); }

  function renderItemPickerGrid(count, statusFn, onSelect) {
    var grid = el("div", { class: "item-picker-grid" });
    for (var i = 0; i < count; i++) {
      var status = statusFn(i);
      var statusChar = status === "correct" ? "✓" : status === "wrong" ? "✕" : status === "partial" ? "~" : "";
      var card = el("button", { class: "item-picker-card status-" + status, type: "button" }, [
        el("span", { class: "item-picker-num" }, [document.createTextNode(String(i + 1))]),
        el("span", { class: "item-picker-status" }, [document.createTextNode(statusChar)])
      ]);
      card.addEventListener("click", function (idx) { return function () { onSelect(idx); }; }(i));
      grid.appendChild(card);
    }
    return grid;
  }

  function renderGrammarView() {
    var root = document.getElementById("view-grammar");
    root.innerHTML = "";
    if (unitActiveSection !== "grammar" && unitActiveSection !== "dialogue" && unitActiveSection !== "reading") return;
    if (!grammarSub) {
      var unit = currentUnitObj();

      function topicGrid(topics) {
        var g = el("div", { class: "picker-grid" });
        topics.forEach(function (topic) {
          var m = topicMastery(topic);
          var card = el("button", { class: "picker-card", type: "button" }, [
            el("span", { class: "ka" }, [document.createTextNode(topic.ka)]),
            el("span", { class: "en" }, [document.createTextNode(topic.en)]),
            el("span", { class: "meta" }, [document.createTextNode(topic.items.length + " კითხვა · " + m.correct + "/" + m.total + " სწორი")])
          ]);
          card.addEventListener("click", function (id) { return function () { openTopic(id); }; }(topic.id));
          g.appendChild(card);
        });
        return g;
      }

      var topics = unitTopicsByKind(unit, unitActiveSection);
      var introText = unitActiveSection === "grammar" ? "გრამატიკის წესები და სავარჯიშოები ამ თავიდან."
        : unitActiveSection === "dialogue" ? "დიალოგები ამ თავიდან — აირჩიე დიალოგი."
        : "წაიკითხე ტექსტი და უპასუხე კითხვებს.";

      if (!topics.length) {
        root.appendChild(el("p", { style: "color:var(--ink-soft);margin:0;max-width:60ch;font-size:0.92rem" }, [document.createTextNode("ამ განყოფილების მასალა წიგნის გადაღებულ გვერდებში ჯერ არ არის. დაემატება, როცა ამ თავის დარჩენილ გვერდებს გადაიღებ.")]));
        return;
      }

      if (topics.length > 1) {
        var direct = el("div", {});
        direct.appendChild(el("p", { style: "color:var(--ink-soft);margin:0 0 10px;max-width:60ch;font-size:0.85rem" }, [document.createTextNode(introText)]));
        direct.appendChild(topicGrid(topics));
        root.appendChild(direct);
      }
      return;
    }

    var topic = GRAMMAR.filter(function (t) { return t.id === grammarSub; })[0];
    var back = el("button", { class: "back-link", type: "button" }, [document.createTextNode("← თემებთან დაბრუნება")]);
    back.addEventListener("click", function () { grammarSub = null; renderGrammarView(); });
    root.appendChild(back);
    root.appendChild(el("h2", { class: topic.kind === "grammar" ? "topic-heading-warm" : topic.kind === "reading" ? "topic-heading-accent" : "" }, [document.createTextNode(topic.ka)]));
    if (topic.commenters) {
      var commentersWrap = el("div", { class: "commenters-wrap" });
      topic.commenters.forEach(function (c) {
        commentersWrap.appendChild(el("div", { class: "commenter-block" }, [
          el("div", { class: "commenter-name" }, [document.createTextNode(c.name)]),
          el("p", { class: "commenter-text" }, [document.createTextNode(c.text)])
        ]));
      });
      root.appendChild(commentersWrap);
      if (topic.instruction) root.appendChild(el("p", { class: "commenters-instruction" }, [document.createTextNode(topic.instruction)]));
    } else if (topic.sections) {
      var sectionsWrap = el("div", { class: "grammar-sections-wrap" });
      topic.sections.forEach(function (s) {
        if (s.type === "intro") {
          sectionsWrap.appendChild(el("p", { class: "grammar-intro-text", html: s.html }));
        } else if (s.type === "block") {
          sectionsWrap.appendChild(el("div", { class: "grammar-block" }, [
            el("div", { class: "grammar-block-label" }, [document.createTextNode(s.label)]),
            el("p", { html: s.html })
          ]));
        }
      });
      root.appendChild(sectionsWrap);
    } else if (topic.note && topic.kind === "grammar") {
      root.appendChild(el("div", { class: "grammar-note-card" }, [
        el("p", {}, [document.createTextNode(topic.note)])
      ]));
    } else if (topic.note) {
      root.appendChild(el("p", { style: "color:var(--ink-soft);max-width:64ch;margin:6px 0 18px;font-size:0.92rem" }, [document.createTextNode(topic.note)]));
    }

    if (!quizItemOpen[topic.id]) {
      root.appendChild(el("p", { style: "color:var(--ink-soft);margin:0 0 12px;font-size:0.85rem" }, [document.createTextNode("აირჩიე სავარჯიშო სიიდან:")]));
      root.appendChild(renderItemPickerGrid(topic.items.length, function (i) {
        var rec = state.quiz[topic.id];
        if (!rec || rec.answers[i] === undefined) return "none";
        return rec.answers[i] ? "correct" : "wrong";
      }, function (idx) { openQuizItem(topic.id, idx); }));
      return;
    }

    var backToList = el("button", { class: "back-link", type: "button" }, [document.createTextNode("← სავარჯიშოების სიაში დაბრუნება")]);
    backToList.addEventListener("click", function () { backToQuizList(topic.id); });
    root.appendChild(backToList);

    if (quizPos[topic.id] === undefined) quizPos[topic.id] = 0;
    var pos = quizPos[topic.id];

    if (pos >= topic.items.length) {
      var m = topicMastery(topic);
      var done = el("div", { class: "quiz-box quiz-done" }, [
        el("div", { class: "big-confetti-wrap", html: bigConfettiHtml() }),
        el("div", { html: ILLUS_STAR_BADGE, style: "width:44px;margin:0 auto 8px" }),
        el("div", { class: "eyebrow" }, [document.createTextNode("დასრულებულია")]),
        el("div", { class: "score" }, [document.createTextNode(m.correct + " / " + m.total)])
      ]);
      var redo = el("button", { class: "redo-btn", type: "button" }, [document.createTextNode("თავიდან დაწყება")]);
      redo.addEventListener("click", function () { quizPos[topic.id] = 0; renderGrammarView(); });
      done.appendChild(redo);
      root.appendChild(done);
      return;
    }

    var item = reversedTranslateItem(topic, topic.items[pos]);
    var box = el("div", { class: "quiz-box" });
    box.appendChild(el("div", { class: "quiz-progress" }, [document.createTextNode((pos + 1) + " / " + topic.items.length)]));

    var hasBlank = item.prompt.indexOf("___") !== -1;
    /* "დიალოგი" topics mix two very different item shapes: fill-in-the-blank
       ones (prompt has "___", same as grammar items -- hasBlank handles those
       identically below) and "თარგმნე ქართულად/ინგლისურად" translate items
       (no blank at all; the whole prompt is already the complete sentence in
       one language, item.answer the translation in the other). Only the
       latter get the extra speech behaviour this block adds. */
    var isDialogueTranslate = topic.kind === "dialogue" && !hasBlank;
    var promptIsGeorgian = textIsGeorgian(item.prompt);
    var answerIsGeorgian = textIsGeorgian(item.answer);
    var fullSentence = fillBlankSentence(item.prompt, item.answer);

    var promptEl = el("div", { class: "quiz-prompt" });
    promptEl.appendChild(el("div", { html: item.instruction }));
    if (isDialogueTranslate && !promptIsGeorgian) {
      var promptLine = el("div", { class: "quiz-prompt-speak-row" });
      promptLine.appendChild(el("strong", {}, [document.createTextNode(item.prompt)]));
      var promptSpeakBtn = el("button", { class: "chat-speak-btn", type: "button", title: "ხელახლა მოსმენა" }, [document.createTextNode("🔊")]);
      promptSpeakBtn.addEventListener("click", function () { speakPracticeSequence([item.prompt]); });
      promptLine.appendChild(promptSpeakBtn);
      promptEl.appendChild(promptLine);
    } else {
      promptEl.appendChild(el("strong", {}, [document.createTextNode(item.prompt)]));
    }
    box.appendChild(promptEl);

    /* a NEW question just appeared on screen, triggered synchronously by
       whichever click brought us here (picking it from the list, "შემდეგი",
       or "თავიდან დაწყება" all call renderGrammarView() straight from their
       click handler, with no async gap) -- iOS Safari only allows audio to
       start from inside that same call stack. Only the English-prompt side
       of a translate item is read here; the Georgian instruction line never
       is, and a Georgian prompt (a hypothetical "translate to English" item)
       is left for the check/reveal step below instead of guessing at it. */
    if (appSettings.exerciseSpeak && isDialogueTranslate && !promptIsGeorgian) {
      speakPracticeSequence([item.prompt]);
    }

    var answerRow = el("div", { class: "answer-row" });
    var input = el("input", { class: "answer-input", type: "text", autocomplete: "off", spellcheck: "false", placeholder: "დაწერე პასუხი..." });
    var checkBtn = el("button", { class: "check-btn", type: "button" }, [document.createTextNode("შემოწმება")]);
    answerRow.appendChild(input);
    answerRow.appendChild(checkBtn);
    box.appendChild(answerRow);

    var feedback = el("div", { class: "feedback" });
    box.appendChild(feedback);

    var footer = el("div", { class: "quiz-footer" });
    var skip = el("button", { class: "skip-btn", type: "button" }, [document.createTextNode("პასუხის ნახვა")]);
    footer.appendChild(skip);
    box.appendChild(footer);
    root.appendChild(box);

    function recordResult(ok) {
      state.quiz[topic.id] = state.quiz[topic.id] || { answers: {} };
      state.quiz[topic.id].answers[pos] = ok;
      saveState();
      renderTabs();
    }

    /* what to speak once the answer is checked/revealed, as an array for
       speakPracticeSequence() -- shared between the automatic speech in
       showFeedback() and the manual replay button below, so both always say
       exactly the same thing.
         - fill-in-the-blank items (grammar, dialogue, or in principle
           reading): the full corrected sentence, with "the correct answer
           is X" first if the check was wrong.
         - dialogue translate items with a Georgian answer: the Georgian
           translation in a ka voice if the device has one, otherwise the
           English prompt again (never item.answer in an en-US voice).
         - dialogue translate items with an English answer (a "translate to
           English" item): the English answer, with the same "correct answer
           is" prefix on a wrong check.
         - anything else with no blank (true/false reading items): just the
           unchanged prompt, regardless of right/wrong -- there's no English
           "answer phrase" to read for those. */
    function correctionSpeech(ok, revealed) {
      if (isDialogueTranslate) {
        if (answerIsGeorgian) {
          return hasVoiceForLang("ka") ? [{ text: item.answer, lang: "ka-GE" }] : [item.prompt];
        }
        return (revealed || ok) ? [item.answer] : ["The correct answer is: " + item.answer + "."];
      }
      if (revealed || ok || !hasBlank) return [fullSentence];
      return ["The correct answer is: " + item.answer + ".", fullSentence];
    }

    function appendSentenceSpeakRow(ok, revealed) {
      var speech = correctionSpeech(ok, revealed);
      var displayText = speech.map(function (s) { return typeof s === "string" ? s : s.text; }).join(" ");
      var row = el("div", { class: "quiz-sentence-row" });
      row.appendChild(el("span", { class: "quiz-sentence-text" }, [document.createTextNode(displayText)]));
      var replayBtn = el("button", { class: "chat-speak-btn", type: "button", title: "ხელახლა მოსმენა" }, [document.createTextNode("🔊")]);
      replayBtn.addEventListener("click", function () { speakPracticeSequence(speech); });
      row.appendChild(replayBtn);
      feedback.appendChild(row);
    }

    /* called synchronously from the check/skip click handlers (never from
       inside a .then()) so the very first speechSynthesis.speak() call of
       this exercise happens inside the tap's own call stack -- iOS Safari
       only allows audio to start that way. */
    function showFeedback(ok, revealed) {
      feedback.className = "feedback show " + (ok ? "correct" : "wrong");
      var msgHtml = ok
        ? "<span class='hand'>ზუსტად ასეა!</span>"
        : "<span class='hand'>თითქმის!</span><span class='correct-answer'>სწორი პასუხია: " + (item.answerAll || item.answer) + "</span>";
      feedback.innerHTML = markWithConfetti(ok) + "<span class='msg'>" + msgHtml + "</span>";
      appendSentenceSpeakRow(ok, revealed);
      /* the check button itself becomes the "next" button -- one button, one
         place to tap, instead of a second button appearing further down */
      input.disabled = true; skip.style.display = "none";
      if (!revealed) markAnswerInput(input, ok);
      answerShown = true;
      checkBtn.textContent = "შემდეგი →";
      if (!revealed) recordResult(ok);

      if (appSettings.exerciseSpeak) speakPracticeSequence(correctionSpeech(ok, revealed));
    }

    var answerShown = false;
    function goToNextItem() { quizPos[topic.id] = pos + 1; renderGrammarView(); }
    checkBtn.addEventListener("click", function () {
      if (answerShown) { goToNextItem(); return; }
      if (!input.value.trim()) { input.focus(); return; }
      var ok = answerMatches(item, input.value);
      showFeedback(ok, false);
    });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") checkBtn.click(); });
    skip.addEventListener("click", function () { showFeedback(false, true); });
  }

  /* ---------- daily quiz (opened from the home button or a push notification) ----------
     Twenty questions drawn from everything in the units the learner has
     reached: vocabulary cards (multiple choice) plus the grammar and
     dialogue exercise items (typed answer). Reading items are left out --
     they need their passage on screen.

     The quiz keeps its own history per item in state.daily.items:
       n = times asked, w = times wrong, c = correct answers in a row,
       ok = last answer, t = when it was last asked.
     pickDailyQuizItems() uses it so the same things don't come up every
     time: a mistake comes back in a later quiz the same day, a correct
     answer rests for a growing interval (half a day, 1, 3, 7, 14, 30 days),
     and items never asked here start from how they went in the unit pages.
     Answers also feed the normal progress (card "mc" results, state.quiz). */
  var DAILY_QUIZ_LENGTH = 20;
  var DAILY_TYPED_MAX = 8; /* typing is slower than tapping an option */
  var DAILY_REST_DAYS = [0.5, 1, 3, 7, 14, 30];
  var dailyQuiz = null;

  function dailyStats() {
    if (!state.daily) state.daily = {};
    if (!state.daily.items) state.daily.items = {};
    return state.daily.items;
  }

  function quizCoveredUnits() {
    var lastPractised = 0;
    UNITS.forEach(function (u, i) {
      var cardsDone = unitDecks(u).some(function (d) { return state.cards[d.id] && Object.keys(state.cards[d.id]).length; });
      var exercisesDone = unitGrammarTopics(u).some(function (g) { return state.quiz[g.id]; });
      if (cardsDone || exercisesDone) lastPractised = i;
    });
    return UNITS.slice(0, lastPractised + 1);
  }

  function dailyQuizPool() {
    var pool = [], seen = {};
    quizCoveredUnits().forEach(function (unit) {
      unitDecks(unit).forEach(function (deck) {
        deck.cards.forEach(function (card, idx) {
          var key = "c:" + deck.id + ":" + idx;
          if (!card.en || !card.ka || seen[key]) return;
          seen[key] = true;
          pool.push({ key: key, type: "card", deck: deck, idx: idx, card: card });
        });
      });
      unitGrammarTopics(unit).forEach(function (topic) {
        if (topic.kind === "reading" || !topic.items) return;
        topic.items.forEach(function (item, pos) {
          var key = "q:" + topic.id + ":" + pos;
          if (!item.prompt || !item.answer || seen[key]) return;
          seen[key] = true;
          pool.push({ key: key, type: "typed", topic: topic, pos: pos, item: item });
        });
      });
    });
    return pool;
  }

  /* how the item went in the unit pages, for items the daily quiz hasn't asked yet */
  function dailyStartingScore(q) {
    if (q.type === "card") {
      var modes = state.cards[q.deck.id] || {};
      var seen = false, worst = 3;
      Object.keys(modes).forEach(function (mode) {
        var result = cardLastResult((modes[mode] || {})[q.idx]);
        if (!result) return;
        seen = true;
        if (result === "rust") worst = Math.min(worst, 0);
        else if (result === "gold") worst = Math.min(worst, 1);
      });
      if (!seen) return 50;
      return worst === 0 ? 90 : (worst === 1 ? 75 : 35);
    }
    var answer = ((state.quiz[q.topic.id] || {}).answers || {})[q.pos];
    return answer === false ? 90 : (answer === true ? 35 : 50);
  }

  /* higher = ask sooner; -1 = resting, only used to fill a short quiz */
  function dailyPriority(q, now) {
    var st = dailyStats()[q.key];
    if (!st) return dailyStartingScore(q);
    var hours = (now - Date.parse(st.t)) / 3600000;
    if (st.ok === false) return hours >= 2 ? 100 : -1;
    var restDays = DAILY_REST_DAYS[Math.min(Math.max(st.c, 1), DAILY_REST_DAYS.length) - 1];
    if (hours < restDays * 24) return -1;
    return 60 + Math.min(hours / 24 / restDays, 3) * 5;
  }

  function pickDailyQuizItems() {
    var now = Date.now();
    var ranked = shuffleArr(dailyQuizPool()).map(function (q) {
      return { q: q, score: dailyPriority(q, now) };
    }).sort(function (a, b) { return b.score - a.score; });

    var picked = [], typedCount = 0;
    function take(onlyDue) {
      ranked.forEach(function (r) {
        if (picked.length >= DAILY_QUIZ_LENGTH || picked.indexOf(r.q) !== -1) return;
        if (onlyDue && r.score < 0) return;
        if (r.q.type === "typed") {
          if (typedCount >= DAILY_TYPED_MAX) return;
          typedCount++;
        }
        picked.push(r.q);
      });
    }
    take(true);
    take(false); /* everything due is used up -- fill with resting items */
    return picked;
  }

  function buildDailyQuiz() {
    var cardPool = dailyQuizPool().filter(function (q) { return q.type === "card"; });
    var questions = pickDailyQuizItems().map(function (q, n) {
      if (q.type !== "card") return q;
      var toGeorgian = n % 2 === 0;
      var side = toGeorgian ? "ka" : "en";
      var wrong = [];
      shuffleArr(cardPool).forEach(function (other) {
        if (wrong.length >= 3 || other.card[side] === q.card[side]) return;
        if (wrong.some(function (w) { return w[side] === other.card[side]; })) return;
        wrong.push(other.card);
      });
      return { key: q.key, type: "card", deck: q.deck, idx: q.idx, card: q.card, toGeorgian: toGeorgian, options: shuffleArr([q.card].concat(wrong)) };
    });
    return { questions: shuffleArr(questions), pos: 0, score: 0, mistakes: [] };
  }

  function dailyItemLabel(q) {
    if (q.type === "card") return q.card.en + " — " + q.card.ka;
    return fillBlankSentence(q.item.prompt, q.item.answer) + (q.item.prompt.indexOf("___") === -1 ? " — " + q.item.answer : "");
  }

  function recordDailyAnswer(q, ok) {
    var stats = dailyStats();
    var st = stats[q.key] || { n: 0, w: 0, c: 0 };
    st.n++;
    if (ok) { st.c++; } else { st.w++; st.c = 0; }
    st.ok = ok;
    st.t = new Date().toISOString();
    stats[q.key] = st;
    if (ok) dailyQuiz.score++; else dailyQuiz.mistakes.push(q);

    if (q.type === "card") {
      markPracticeResult(q.deck, q.idx, ok, "mc"); /* saves state */
    } else {
      state.quiz[q.topic.id] = state.quiz[q.topic.id] || { answers: {} };
      state.quiz[q.topic.id].answers[q.pos] = ok;
      saveState();
      renderTabs();
    }
  }

  function openDailyQuiz() {
    dailyQuiz = buildDailyQuiz();
    if (location.hash === "#quiz") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
    switchView("quiz");
  }

  function openDailyAnalysis() {
    dailyQuiz = { analysisOnly: true };
    switchView("quiz");
  }

  /* right answer: move on by itself after a moment; a wrong one waits for
     the learner to read the correction and tap Next */
  function dailyAdvanceSoon(delayMs) {
    var quizAtAnswer = dailyQuiz, posAtAnswer = dailyQuiz.pos;
    setTimeout(function () {
      if (dailyQuiz !== quizAtAnswer || dailyQuiz.pos !== posAtAnswer || currentView !== "quiz") return;
      dailyQuiz.pos++;
      renderDailyQuizView();
    }, delayMs);
  }

  function renderDailyAnalysis(box) {
    var pool = dailyQuizPool();
    var stats = dailyStats();
    var asked = 0, learned = 0, weak = [];

  /* ---------- quiz push notifications ----------
     Subscribes this device to Web Push and stores the subscription in
     public.push_subscriptions; the send-quiz-push Edge Function then pushes
     "your quiz is ready" several times a day. On iPhone this only exists
     when the app runs from the Home Screen icon (not in a Safari tab). */
  var VAPID_PUBLIC_KEY = "BEf6jQgC2NcOFHoPbh4tiXA_poVy7SRUSLcxX9NnojZ0jmHn_aadhtNzDIDLA1tfcfI2EtJhxL_yZ9_D8ofkg8E";

  function quizPushSupported() {
    return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  }

  function vapidKeyBytes() {
    var b64 = (VAPID_PUBLIC_KEY + "===".slice((VAPID_PUBLIC_KEY.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(b64);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  /* must be called straight from a tap: the permission prompt needs it */
  function enableQuizPush() {
    return Notification.requestPermission().then(function (permission) {
      if (permission !== "granted") throw new Error("შეტყობინებები მოწყობილობის პარამეტრებში გამორთულია.");
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKeyBytes() });
    }).then(function (sub) {
      var json = sub.toJSON();
      return supabaseClient.from("push_subscriptions").upsert({
        endpoint: json.endpoint,
        user_id: currentAuthUser.id,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
        user_agent: navigator.userAgent.slice(0, 200)
      }, { onConflict: "endpoint" });
    }).then(function (res) {
      if (res.error) throw new Error(res.error.message);
    });
  }

  function disableQuizPush() {
    return navigator.serviceWorker.ready.then(function (reg) {
      return reg.pushManager.getSubscription();
    }).then(function (sub) {
      if (!sub) return;
      return supabaseClient.from("push_subscriptions").delete().eq("endpoint", sub.endpoint).then(function () {
        return sub.unsubscribe();
      });
    });
  }

  /* ---------- chat ---------- */
  /* Anthropic/OpenAI calls go through Supabase Edge Functions now, not directly
     to api.anthropic.com/api.openai.com -- the real keys live server-side only
     (ANTHROPIC_API_KEY / OPENAI_API_KEY secrets), the Edge Function verifies the
     caller's Supabase session and enforces a 50/day-per-user rate limit. */
  var ANTHROPIC_CHAT_FUNCTION_URL = "https://wddqjehzoicwkqyqfiqs.supabase.co/functions/v1/anthropic-chat";
  var WHISPER_FUNCTION_URL = "https://wddqjehzoicwkqyqfiqs.supabase.co/functions/v1/whisper-transcribe";

  /* headers Supabase Edge Functions require: apikey (the project anon key) plus
     the signed-in user's own access token, so the function can verify who's calling. */
  function edgeFunctionHeaders(extra) {
    return supabaseClient.auth.getSession().then(function (res) {
      var token = res.data && res.data.session ? res.data.session.access_token : null;
      var headers = { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + (token || "") };
      for (var k in extra) headers[k] = extra[k];
      return headers;
    });
  }

  /* getSession() is supposed to transparently refresh an expired access token
     before returning it, but on a mobile PWA that gets suspended in the
     background for a while (iOS in particular), the SDK's own refresh timer
     can miss its window -- the very first request after the app comes back
     to the foreground has been seen going out with a token that's already
     past its exp claim, and the edge function correctly bounces it with 401.
     Rather than surface that as a dead end ("სესია ვადაგასულია" with no way
     forward but a manual re-login), retry exactly once: force a real
     refreshSession() call (bypassing whatever the SDK thought was still
     valid) and resend with the new token. Only a still-invalid refresh_token
     (a genuinely expired session) falls through to the caller's 401
     handling now. */
  function postToEdgeFunction(url, extra, body) {
    function attempt(hasRetried) {
      return edgeFunctionHeaders(extra).then(function (headers) {
        return fetch(url, { method: "POST", headers: headers, body: body });
      }).then(function (res) {
        if (res.status === 401 && !hasRetried) {
          console.warn("postToEdgeFunction: got 401, forcing refreshSession() and retrying once:", url);
          return supabaseClient.auth.refreshSession().then(function (refreshRes) {
            if (refreshRes.error || !refreshRes.data.session) {
              console.error("postToEdgeFunction: refreshSession() failed -- session is genuinely expired", refreshRes.error);
              return res; /* no valid refresh_token left -- surface the original 401 as-is */
            }
            return attempt(true);
          });
        }
        return res;
      });
    }
    return attempt(false);
  }

  /* ---------- profile (Settings -> Edit Profile), synced via Supabase ---------- */
  var PROFILE_FIELDS = ["name", "nameEn", "surname", "surnameEn", "age", "city", "cityEn", "job", "jobEn"];

  function profileRowToLocal(row) {
    return {
      name: row.name, nameEn: row.name_en, surname: row.surname, surnameEn: row.surname_en,
      age: row.age, city: row.city, cityEn: row.city_en, job: row.job, jobEn: row.job_en
    };
  }
  function localProfileToRow(over) {
    return {
      user_id: currentAuthUser.id,
      name: over.name, name_en: over.nameEn, surname: over.surname, surname_en: over.surnameEn,
      age: over.age, city: over.city, city_en: over.cityEn, job: over.job, job_en: over.jobEn,
      updated_at: new Date().toISOString()
    };
  }
  function readLegacyLocalProfileOverride() {
    var raw;
    try { raw = localStorage.getItem(PROFILE_STORAGE); } catch (e) { return null; }
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  /* Loads the signed-in user's profile row. If none exists yet (first login
     since this migration), seeds it from any legacy per-device localStorage
     override, falling back to the current (hardcoded default) PROFILE
     values, and writes that as their first real row so it's there next time. */
  function loadProfileFromSupabase() {
    if (!currentAuthUser) return Promise.resolve();
    return supabaseClient.from("profiles").select("*").eq("user_id", currentAuthUser.id).maybeSingle()
      .then(function (res) {
        if (res.data) {
          var row = profileRowToLocal(res.data);
          PROFILE_FIELDS.forEach(function (k) { if (row[k] !== null && row[k] !== undefined) PROFILE[k] = row[k]; });
          return;
        }
        var legacy = readLegacyLocalProfileOverride();
        var seed = {};
        PROFILE_FIELDS.forEach(function (k) { seed[k] = (legacy && legacy[k] !== undefined) ? legacy[k] : PROFILE[k]; });
        PROFILE_FIELDS.forEach(function (k) { PROFILE[k] = seed[k]; });
        return supabaseClient.from("profiles").upsert(localProfileToRow(seed), { onConflict: "user_id" });
      })
      .catch(function () { /* leave PROFILE at its current (default) values */ });
  }

  function saveProfileToSupabase(over) {
    if (!currentAuthUser) return Promise.reject(new Error("Not signed in"));
    return supabaseClient.from("profiles").upsert(localProfileToRow(over), { onConflict: "user_id" });
  }

  /* ---------- app settings (settings page) ---------- */
  function loadSettings() {
    var raw;
    try { raw = localStorage.getItem(SETTINGS_STORAGE); } catch (e) { raw = null; }
    var parsed = {};
    if (raw) { try { parsed = JSON.parse(raw); } catch (e) { parsed = {}; } }
    var out = {};
    Object.keys(SETTINGS_DEFAULTS).forEach(function (k) {
      out[k] = (parsed[k] !== undefined) ? parsed[k] : SETTINGS_DEFAULTS[k];
    });
    return out;
  }

  }

  /* ---------- chat mistake categorization (pedagogical groundwork) ----------
     Per-device tally only, not yet surfaced in any UI -- collected so a future
     "what do you struggle with" view or SRS scheduler has data to read. */
  function loadMistakeStats() {
    var raw;
    try { raw = localStorage.getItem(MISTAKE_STATS_STORAGE); } catch (e) { raw = null; }
    var parsed = {};
    if (raw) { try { parsed = JSON.parse(raw); } catch (e) { parsed = {}; } }
    var out = {};
    MISTAKE_CATEGORIES.forEach(function (c) { out[c] = parsed[c] > 0 ? parsed[c] : 0; });
    return out;
  }
  function recordMistakeCategory(category) {
    if (MISTAKE_CATEGORIES.indexOf(category) === -1) category = "other";
    var stats = loadMistakeStats();
    stats[category] += 1;
    try { localStorage.setItem(MISTAKE_STATS_STORAGE, JSON.stringify(stats)); } catch (e) {}
  }
  function playDing() {
    if (!appSettings.soundEffects) return;
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      var ctx = new AudioContextClass();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.23);
      osc.onended = function () { ctx.close(); };
    } catch (e) {}
  }

  function buildSystemPrompt() {
    var scopedUnit = chatScopeUnit ? UNITS.filter(function (u) { return u.id === chatScopeUnit; })[0] : null;
    var relevantDecks = scopedUnit ? unitDecks(scopedUnit) : DECKS;
    var relevantGrammar = scopedUnit ? unitGrammarTopics(scopedUnit) : GRAMMAR;
    var relevantIds = relevantGrammar.map(function (g) { return g.id; });
    var deckTopics = relevantDecks.map(function (d) { return d.ka + " (" + d.en + ")"; }).join(", ") || "(none for this unit — focus on the grammar below)";
    var grammarTopics = relevantGrammar.map(function (g) { return g.ka + " — " + g.en; }).join("; ") || "(none for this unit — focus on the vocabulary above)";
    var wordList = relevantDecks.length
      ? relevantDecks.map(function (d) { return d.cards.map(function (c) { return c.en; }).join(", "); }).join(", ")
      : "";

    var passages = [];
    if (relevantIds.indexOf("readingJacob") !== -1) {
      passages.push("PASSAGE — Jacob's Family: \"My name is Jacob Thompson, and I am 28 years old. I am from Great Britain and live in London with my family. I have a big family — mother, father, grandparents, wife, and children — but I don't have any sisters or brothers. I am the only child. Only 7 of us are in the family photo; my parents are not with us. My mum is a busy teacher. My father is a truck driver who is always on the road. Grandma is 78 and retired. Grandpa is 80 and an energetic university professor. I fell in love with my wife, Helen, when I was 17 and we soon married. We have two sons, Alex and Jack, and a daughter, Sally, aged 6, 8, and 7. We all love and respect each other.\"");
    }
    if (relevantIds.indexOf("readingKeiraLiam") !== -1) {
      passages.push("PASSAGE — Keira & Liam's routines: \"Keira gets up at 2 a.m., showers, gets dressed, leaves home at 3 a.m., gets to work at 3.30, has a quick breakfast at work, reads the plan for the morning — her breakfast TV program starts at 5 a.m. Liam gets up at 3 p.m., spends time with family, leaves for work at 8.30 p.m. because he worries about traffic, starts work at 10 p.m. at the hospital helping patients and doctors, has coffee and a snack instead of lunch, finishes at 6 a.m., has dinner, gets home at 7 a.m. and goes to bed exhausted.\"");
    }

    var lines = [
      "You are " + PROFILE.nameEn + "'s friendly English conversation partner for spoken/written practice.",
      "",
      "Learner profile: " + PROFILE.nameEn + " (" + PROFILE.name + ") " + PROFILE.surnameEn + ", " + PROFILE.age + ", from " + PROFILE.countryEn + ", lives in " + PROFILE.cityEn + ", works as a " + PROFILE.jobEn + ".",
      "She is " + (LEVEL_META[appSettings.level] || LEVEL_META.beginner).prompt + " English learner working through a textbook called \"Speaking Tags.\"",
      ""
    ];
    if (scopedUnit) {
      lines.push("This conversation is a THEMED PRACTICE SESSION focused specifically on " + scopedUnit.ka + " — keep it centered on this unit's material only, don't wander into other units' vocabulary or grammar.");
      lines.push("");
      if (wordList) {
        lines.push("The exact vocabulary she knows for this unit is: " + wordList + ".");
        lines.push("STRICT RULE: use ONLY words from this list (plus basic A1 function words: a, the, is, am, are, was, were, in, on, at, and, but, or, I, you, he, she, it, we, they, this, that, do, does, don't, doesn't, have, has, my, your, his, her, its, our, their, yes, no, please, thank you). Do NOT introduce new content vocabulary beyond this unit's list, even if it would be natural in a normal conversation.");
        lines.push("A small drift in topic is fine (e.g. a related follow-up question), but never let the vocabulary or grammar get harder than this unit's level — if you need a concept outside the list, rephrase it using only the words above.");
        lines.push("");
      }
    }
    lines.push("Vocabulary topics she has studied — steer the conversation toward these: " + deckTopics + ".");
    lines.push("Grammar she has studied — stay within this level: " + grammarTopics + ".");
    lines.push("");
    if (passages.length) {
      lines.push("She has also read " + (passages.length > 1 ? "these passages" : "this passage") + " from her textbook, and can be quizzed on " + (passages.length > 1 ? "them" : "it") + " by voice:");
      passages.forEach(function (p) { lines.push(p); });
      lines.push("When she asks to be quizzed on a passage, ask her simple comprehension questions about it ONE AT A TIME in English, wait for her spoken answer, gently confirm or correct the factual content in your reply, and continue with the next question — in addition to the grammar correction in has_correction/corrected/explanation.");
      lines.push("");
    }
    lines.push("Your job on every turn:");
    var tail = [
      "1. Reply naturally and warmly in ENGLISH ONLY, continuing the conversation, asking a simple follow-up question, short sentences, common A1-A2 words. Keep it brief (2-4 sentences).",
      "2. Separately, check her most recent message for English grammar or vocabulary mistakes.",
      "   - If there IS a mistake: set has_correction to true, give the corrected English phrase in 'corrected', a very short explanation IN GEORGIAN (one sentence) in 'explanation', and classify it in 'mistake_category' as one of: grammar, vocabulary, pronunciation, other.",
      "   - If her message has no mistakes: set has_correction to false, leave 'corrected'/'explanation' as empty strings, and set 'mistake_category' to \"other\".",
      "3. Never blend the correction into the reply — keep them completely separate."
    ];
    return lines.concat(tail).join("\n");
  }

  function chatEscapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

    var sendBtn = el("button", { class: "chat-send-btn", id: "chatSendBtn", type: "button" }, [document.createTextNode("➤")]);

    root.appendChild(statusEl);

    });

      textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
    });

    updateMicButton();

  function addChatBubble(role, text, correction) {
    var messagesEl = document.getElementById("chatMessages");
    if (!messagesEl) return;
    var wrap = el("div", { class: "chat-msg " + role });
    var bubbleRow = el("div", { class: "chat-bubble-row" });
    bubbleRow.appendChild(el("div", { class: "chat-bubble", html: chatEscapeHtml(text) }));
    if (role === "assistant") {
      var speakBtn = el("button", { class: "chat-speak-btn", type: "button", title: "ხმამაღლა მოსმენა" }, [document.createTextNode("🔊")]);
      speakBtn.addEventListener("click", function () { speakChatText(text); });
      bubbleRow.appendChild(speakBtn);
    }
    wrap.appendChild(bubbleRow);
    if (correction && correction.has_correction) {
      wrap.appendChild(el("div", { class: "chat-correction", html:
        "<span class='label'>შესწორება:</span> <strong>" + chatEscapeHtml(correction.corrected) + "</strong> — " + chatEscapeHtml(correction.explanation)
      }));
    }
    messagesEl.appendChild(wrap);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function addChatTyping() {
    var messagesEl = document.getElementById("chatMessages");
    if (!messagesEl) return;
    var wrap = el("div", { class: "chat-msg assistant", id: "chatTyping" });
    wrap.appendChild(el("div", { class: "chat-bubble chat-typing", html: "<span></span><span></span><span></span>" }));
    messagesEl.appendChild(wrap);
    window.scrollTo(0, document.body.scrollHeight);
  }
  function removeChatTyping() {
    var el2 = document.getElementById("chatTyping");
    if (el2) el2.remove();
  }

  function showChatError(msg) {
    var banner = document.getElementById("chatErrorBanner");
    if (!banner) return;
    banner.textContent = msg;
    banner.style.display = "block";
  }
  function hideChatError() {
    var banner = document.getElementById("chatErrorBanner");
    if (banner) banner.style.display = "none";
  }

  function sendChatMessage(voiceText) {
    var isVoiceTurn = typeof voiceText === "string";
    var textarea = document.getElementById("chatUserInput");
    var sendBtn = document.getElementById("chatSendBtn");
    var text = isVoiceTurn ? voiceText.trim() : (textarea ? textarea.value.trim() : "");
    if (!text) {
      if (voiceModeOn) resumeListening();
      return;
    }
    hideChatError();
    addChatBubble("user", text, null);
    chatHistory.push({ role: "user", content: text });
    if (!isVoiceTurn && textarea) { textarea.value = ""; textarea.style.height = "auto"; }
    if (sendBtn) sendBtn.disabled = true;
    addChatTyping();
    if (voiceModeOn) setVoiceStatus("processing");

    postToEdgeFunction(ANTHROPIC_CHAT_FUNCTION_URL, { "content-type": "application/json" }, JSON.stringify({
      model: CHAT_MODEL,
      max_tokens: 1024,
      /* short conversational turns: no thinking keeps replies fast (and
         thinking tokens can't eat into max_tokens and truncate the JSON) */
      thinking: { type: "disabled" },
      /* caches the system prompt + earlier turns between requests */
      cache_control: { type: "ephemeral" },
      system: buildSystemPrompt(),
      messages: chatHistory,
      output_config: {
        effort: "low",
        format: { type: "json_schema", schema: CHAT_OUTPUT_SCHEMA }
      }
    })).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      removeChatTyping();
      if (!result.ok) {
        if (result.status === 401) {
          showChatError("სესია ვადაგასულია — გთხოვ თავიდან შედი ანგარიშზე.");
        } else if (result.status === 429) {
          showChatError("მოთხოვნები ძალიან ხშირია (rate limit) — მოიცადე ცოტა ხანი და სცადე ისევ.");
        } else {
          console.error("sendChatMessage: anthropic-chat error", result.status, result.data);
          showChatError("შეცდომა: " + (result.data && result.data.error && result.data.error.message ? result.data.error.message : "უცნობი შეცდომა"));
        }
        chatHistory.pop();
        if (sendBtn) sendBtn.disabled = false;
        if (voiceModeOn) exitVoiceMode();
        return;
      }
      var content = result.data.content || [];
      var textBlock = null;
      for (var i = 0; i < content.length; i++) {
        if (content[i].type === "text") { textBlock = content[i]; break; }
      }
      if (!textBlock) {
        showChatError("პასუხი ვერ მოვიდა — სცადე ისევ.");
        if (sendBtn) sendBtn.disabled = false;
        if (voiceModeOn) exitVoiceMode();
        return;
      }
      var parsed = JSON.parse(textBlock.text);
      if (parsed.has_correction) recordMistakeCategory(parsed.mistake_category);
      addChatBubble("assistant", parsed.reply, parsed);
      chatHistory.push({ role: "assistant", content: parsed.reply });
      if (sendBtn) sendBtn.disabled = false;
      if (voiceModeOn) {
        setVoiceStatus("speaking");
        speakChatTextAuto(parsed);
      } else {
        if (appSettings.autoSpeak) speakChatText(parsed.reply);
        if (!isVoiceTurn && textarea) textarea.focus();
      }
    }).catch(function (err) {
      removeChatTyping();
      console.error("sendChatMessage: request failed", err);
      showChatError("კავშირის შეცდომა: " + err.message);
      chatHistory.pop();
      if (sendBtn) sendBtn.disabled = false;
      if (voiceModeOn) exitVoiceMode();
    });
  }

  /* ---------- voice: status indicator ---------- */
  var VOICE_STATUS_LABELS = { listening: "გისმენ...", processing: "ვამუშავებ...", speaking: "პასუხობს..." };

  function setVoiceStatus(state) {
    voiceState = state;
    var wrap = document.getElementById("chatVoiceStatus");
    var text = document.getElementById("chatVoiceStatusText");
    if (!wrap || !text) return;
    text.textContent = VOICE_STATUS_LABELS[state] || "";
    wrap.className = "chat-voice-status show state-" + state;
  }
  function hideVoiceStatus() {
    voiceState = "";
    var wrap = document.getElementById("chatVoiceStatus");
    if (wrap) wrap.className = "chat-voice-status";
  }

  /* ---------- voice: text-to-speech ---------- */
  function speakChatText(text) {
    if (!window.speechSynthesis) {
      showChatError("ეს ბრაუზერი ხმის სინთეზს ვერ უჭერს მხარს.");
      return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }

  /* Speaks the assistant's reply and, when the turn included a correction,
     follows it with a spoken correction (English phrase + Georgian
     explanation if a Georgian voice is available) before resuming
     listening — so a mistake is corrected out loud, not just shown as text. */
  function speakChatTextAuto(parsed) {
    var englishText = parsed.reply;
    if (parsed.has_correction && parsed.corrected) {
      englishText += " Quick correction — the right way to say that is: " + parsed.corrected;
    }
    speakWithAiVoice(englishText, function () {
      speakGeorgianExplanation(parsed);
    }, function () {
      speakChatTextAutoBrowser(parsed);
    });
  }

  /* The Georgian correction note is only spoken if the device has a Georgian
     voice (the AI voice is used for English only); otherwise it stays as text. */
  function speakGeorgianExplanation(parsed) {
    if (!(parsed.has_correction && parsed.explanation && window.speechSynthesis && hasVoiceForLang("ka"))) {
      if (voiceModeOn) resumeListening();
      return;
    }
    var u = new SpeechSynthesisUtterance(parsed.explanation);
    u.lang = "ka-GE";
    u.rate = 0.95;
    u.onend = function () { if (voiceModeOn) resumeListening(); };
    u.onerror = function () { if (voiceModeOn) resumeListening(); };
    window.speechSynthesis.speak(u);
  }

  /* ---------- voice: natural AI voice (OpenAI TTS via the openai-tts Edge Function) ----------
     iOS only lets audio play from a user tap, so one <audio> element is
     "unlocked" when voice mode is switched on (a tap) and reused for every
     reply afterwards. Any failure (function not deployed, network, limit)
     calls onFail so the browser's built-in voice takes over. */
  var aiVoiceAudio = null;
  var SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

  function unlockAiVoiceAudio() {
    if (!aiVoiceAudio) aiVoiceAudio = new Audio();
    aiVoiceAudio.src = SILENT_WAV;
    var p = aiVoiceAudio.play();
    if (p && p.catch) p.catch(function () {});
  }

  function stopAiVoiceAudio() {
    if (aiVoiceAudio) { aiVoiceAudio.onended = null; aiVoiceAudio.onerror = null; aiVoiceAudio.pause(); }
  }

  function speakWithAiVoice(text, onDone, onFail) {
    postToEdgeFunction(TTS_FUNCTION_URL, { "content-type": "application/json" }, JSON.stringify({ input: text })).then(function (res) {
      if (!res.ok) throw new Error("TTS status " + res.status);
      return res.blob();
    }).then(function (blob) {
      if (!voiceModeOn) return;
      if (!aiVoiceAudio) aiVoiceAudio = new Audio();
      var url = URL.createObjectURL(blob);
      aiVoiceAudio.onended = function () { URL.revokeObjectURL(url); onDone(); };
      aiVoiceAudio.onerror = function () { URL.revokeObjectURL(url); onFail(); };
      aiVoiceAudio.src = url;
      var p = aiVoiceAudio.play();
      if (p && p.catch) p.catch(function (err) {
        console.error("speakWithAiVoice: playback blocked", err);
        aiVoiceAudio.onended = null;
        aiVoiceAudio.onerror = null;
        URL.revokeObjectURL(url);
        onFail();
      });
    }).catch(function (err) {
      console.error("speakWithAiVoice: falling back to browser voice", err);
      if (voiceModeOn) onFail();
    });
  }

  /* Browser built-in voice — fallback when the AI voice is unavailable. */
  function speakChatTextAutoBrowser(parsed) {
    if (!window.speechSynthesis) {
      if (voiceModeOn) resumeListening();
      return;
    }
    window.speechSynthesis.cancel();

    var utterances = [];
    var mainU = new SpeechSynthesisUtterance(parsed.reply);
    mainU.lang = "en-US";
    mainU.rate = 0.95;
    utterances.push(mainU);

    if (parsed.has_correction && parsed.corrected) {
      var correctionEn = new SpeechSynthesisUtterance("Quick correction — the right way to say that is: " + parsed.corrected);
      correctionEn.lang = "en-US";
      correctionEn.rate = 0.92;
      utterances.push(correctionEn);
      if (parsed.explanation && hasVoiceForLang("ka")) {
        var correctionKa = new SpeechSynthesisUtterance(parsed.explanation);
        correctionKa.lang = "ka-GE";
        correctionKa.rate = 0.95;
        utterances.push(correctionKa);
      }
    }

    var last = utterances[utterances.length - 1];
    last.onend = function () { if (voiceModeOn) resumeListening(); };
    last.onerror = function () { if (voiceModeOn) resumeListening(); };
    utterances.forEach(function (u) { window.speechSynthesis.speak(u); });
  }

  /* ---------- voice: continuous hands-free dialogue mode ----------
     One getUserMedia() permission request per voice-mode session: the
     mic MediaStream is acquired once in enterVoiceMode() and reused for
     every recording turn (a fresh MediaRecorder per turn, same stream) —
     it's only released when the mode is exited. This is what keeps the
     browser from re-prompting for microphone access on every turn. */
  var voiceStream = null;

  /* getUserMedia() is known to silently hang forever — never resolving,
     never rejecting — in some browser contexts (notably iOS Safari when
     the app is running as a home-screen/standalone PWA). Without a
     timeout that looks exactly like "does nothing when started": the
     status flips to "listening" and then nothing ever happens, with no
     error to explain why. Racing it against a timer turns that silent
     hang into a visible, actionable error. */
  function getUserMediaWithTimeout(constraints, ms) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject(new Error("timeout"));
      }, ms);
      navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
        if (settled) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        settled = true;
        clearTimeout(timer);
        resolve(stream);
      }, function (err) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        reject(err);
      });
    });
  }

  function isStandalonePwa() {
    return (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

  function micErrorMessage(err) {
    if (err && err.message === "timeout") {
      return isStandalonePwa()
        ? "მიკროფონი არ პასუხობს — Home Screen-ზე დამატებულ აპებში ეს ცნობილი iOS-ის ბაგია. სცადე გახსნა უბრალო Safari-ის tab-ში (არა Home Screen-ის აიქონიდან)."
        : "მიკროფონმა არ უპასუხა — სცადე გვერდის განახლება, ან შემდეგში ბრაუზერის მიკროფონის წვდომა გადაამოწმე პარამეტრებში.";
    }
    return "მიკროფონზე წვდომა ვერ მოხერხდა: " + (err && err.message ? err.message : String(err));
  }

  function toggleVoiceMode() {
    if (voiceModeOn) exitVoiceMode(); else enterVoiceMode();
  }

  function enterVoiceMode() {
    hideChatError();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      showChatError("ეს ბრაუზერი მიკროფონის ჩაწერას ვერ უჭერს მხარს.");
      return;
    }
    voiceModeOn = true;
    unlockAiVoiceAudio();
    updateMicButton();
    setVoiceStatus("listening");
    getUserMediaWithTimeout({ audio: true }, 10000).then(function (stream) {
      if (!voiceModeOn) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      voiceStream = stream;
      beginRecordingTurn();
    }).catch(function (err) {
      console.error("enterVoiceMode: getUserMedia failed", err);
      showChatError(micErrorMessage(err));
      voiceModeOn = false;
      updateMicButton();
      hideVoiceStatus();
    });
  }

  function exitVoiceMode() {
    voiceModeOn = false;
    stopAiVoiceAudio();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (mediaRecorder && mediaRecorder.state === "recording") {
      recordingCancelled = true;
      mediaRecorder.stop();
    }
    stopSilenceWatcher();
    teardownAnalyser();
    if (voiceStream) {
      voiceStream.getTracks().forEach(function (t) { t.stop(); });
      voiceStream = null;
    }
    isRecording = false;
    updateMicButton();
    hideVoiceStatus();
  }

  function resumeListening() {
    if (!voiceModeOn) return;
    setVoiceStatus("listening");
    var trackLive = voiceStream && voiceStream.getAudioTracks().some(function (t) { return t.readyState === "live"; });
    if (trackLive) {
      beginRecordingTurn();
      return;
    }
    /* Mic track ended unexpectedly (e.g. device unplugged) — re-acquire once. */
    getUserMediaWithTimeout({ audio: true }, 10000).then(function (stream) {
      if (!voiceModeOn) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      voiceStream = stream;
      beginRecordingTurn();
    }).catch(function (err) {
      console.error("resumeListening: getUserMedia failed", err);
      showChatError(micErrorMessage(err));
      exitVoiceMode();
    });
  }

  function updateMicButton() {
    var btn = document.getElementById("chatMicBtn");
    if (!btn) return;
    btn.classList.toggle("recording", isRecording);
    btn.classList.toggle("voice-active", voiceModeOn);
    if (voiceModeOn) {
      btn.textContent = "⏹";
      btn.title = "ხმოვანი დიალოგის შეწყვეტა";
    } else {
      btn.textContent = "🎙";
      btn.title = "ხმოვანი დიალოგის დაწყება";
    }
  }

  /* ---------- voice: speech-to-text via MediaRecorder + Whisper ---------- */
  function pickRecorderMimeType() {
    var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/mp4;codecs=mp4a.40.2", "audio/ogg;codecs=opus"];
    for (var i = 0; i < candidates.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return "";
  }

  /* The MediaRecorder needs the full "audio/webm;codecs=opus" string to pick
     the right encoder, but Whisper's format-sniffing gets confused when that
     same codecs parameter rides along as the uploaded file's Content-Type —
     that mismatch is what produced "audio file could not be decoded". Strip
     it down to the bare container type ("audio/webm") for the Blob/upload. */
  function baseMimeType(m) {
    return m ? m.split(";")[0] : "";
  }

  function extensionForMimeType(base) {
    if (base.indexOf("mp4") !== -1) return "m4a";
    if (base.indexOf("ogg") !== -1) return "ogg";
    if (base.indexOf("wav") !== -1) return "wav";
    return "webm";
  }

  function beginRecordingTurn() {
    if (!voiceStream) {
      console.error("beginRecordingTurn: no voiceStream");
      showChatError("მიკროფონის ნაკადი ვერ მოიძებნა.");
      exitVoiceMode();
      return;
    }
    var mimeType = pickRecorderMimeType();
    try {
      mediaRecorder = mimeType ? new MediaRecorder(voiceStream, { mimeType: mimeType }) : new MediaRecorder(voiceStream);
    } catch (e) {
      console.error("beginRecordingTurn: MediaRecorder construction failed", e);
      showChatError("ჩაწერის დაწყება ვერ მოხერხდა: " + e.message);
      exitVoiceMode();
      return;
    }
    audioChunks = [];
    mediaRecorder.addEventListener("dataavailable", function (e) {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    });
    mediaRecorder.addEventListener("stop", function () {
      stopSilenceWatcher();
      isRecording = false;
      updateMicButton();
      if (recordingCancelled) { recordingCancelled = false; return; }
      var base = baseMimeType(mediaRecorder.mimeType || mimeType) || "audio/webm";
      var blob = new Blob(audioChunks, { type: base });
      handleVoiceTurn(blob);
    });
    mediaRecorder.start();
    isRecording = true;
    updateMicButton();
    startSilenceWatcher(voiceStream);
  }

  function stopRecordingForSilence() {
    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  }

  /* Web Audio API AnalyserNode: watches mic input level and auto-stops
     recording after ~2.5s of silence (following at least a bit of speech),
     or after a hard cap so a stuck mic can't record forever. The
     AudioContext/analyser are created once per voice-mode session
     (ensureAnalyser) and just re-armed each turn — not recreated. */
  function ensureAnalyser(stream) {
    if (analyser) return true;
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return false;
      audioCtx = new AudioContextClass();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      return true;
    } catch (e) {
      return false;
    }
  }

  function teardownAnalyser() {
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    analyser = null;
  }

  function startSilenceWatcher(stream) {
    if (!ensureAnalyser(stream)) return;
    var data = new Uint8Array(analyser.frequencyBinCount);
    var SPEECH_RMS_THRESHOLD = 14;
    var SILENCE_MS = 2000;
    var MAX_RECORD_MS = 60000;
    var MIN_RECORD_MS = 700;
    var hasSpoken = false;
    var lastLoudTs = Date.now();
    var startTs = Date.now();

    silenceCheckInterval = setInterval(function () {
      if (!analyser) return;
      analyser.getByteTimeDomainData(data);
      var sumSq = 0;
      for (var i = 0; i < data.length; i++) {
        var v = data[i] - 128;
        sumSq += v * v;
      }
      var rms = Math.sqrt(sumSq / data.length);
      var now = Date.now();
      if (now - startTs < MIN_RECORD_MS) return;
      if (rms > SPEECH_RMS_THRESHOLD) { hasSpoken = true; lastLoudTs = now; }
      if (hasSpoken && (now - lastLoudTs) > SILENCE_MS) { stopRecordingForSilence(); return; }
      if ((now - startTs) > MAX_RECORD_MS) { stopRecordingForSilence(); }
    }, 150);
  }

  function stopSilenceWatcher() {
    if (silenceCheckInterval) { clearInterval(silenceCheckInterval); silenceCheckInterval = null; }
  }

  function handleVoiceTurn(blob) {
    if (!voiceModeOn) return;
    if (blob.size < 2000) {
      /* Too little audio to be a real answer (mic blip, or silence-detection
         fired before any speech) — re-listen instead of sending junk to Whisper. */
      resumeListening();
      return;
    }
    setVoiceStatus("processing");
    var ext = extensionForMimeType(blob.type);
    var form = new FormData();
    form.append("file", blob, "recording." + ext);
    form.append("model", TRANSCRIBE_MODEL);
    form.append("language", "en");
    form.append("prompt", transcriptionHint());

    postToEdgeFunction(WHISPER_FUNCTION_URL, {}, form).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      if (!voiceModeOn) return;
      if (!result.ok) {
        var msg = result.data && result.data.error && result.data.error.message ? result.data.error.message : "ტრანსკრიფცია ვერ შესრულდა";
        if (result.status === 429) msg = "დღიური ლიმიტი ამოიწურა — სცადე ხვალ, ან განაახლე Premium-ზე მაღალი ლიმიტისთვის.";
        if (result.status === 401) msg = "სესია ვადაგასულია — გთხოვ თავიდან შედი ანგარიშზე.";
        console.error("handleVoiceTurn: Whisper error", result.status, result.data);
        showChatError("Whisper შეცდომა: " + msg);
        exitVoiceMode();
        return;
      }
      var text = (result.data.text || "").trim();
      if (!text) { resumeListening(); return; }
      sendChatMessage(text);
    }).catch(function (err) {
      if (!voiceModeOn) return;
      console.error("handleVoiceTurn: request failed", err);
      showChatError("კავშირის შეცდომა (Whisper): " + err.message);
      exitVoiceMode();
    });
  }

  /* ---------- page reader (admin view, reached via #admin) ----------
     Reads one photographed textbook page and shows every PRINTED thing on
     it, split into blocks in reading order. Handwriting on the page (the
     learner's pencilled answers and notes) is ignored, nothing is solved,
     translated or added: the output is a transcription and nothing else.

     Two model calls per page: the first transcribes, the second gets the
     photo together with that transcription and hunts for anything missed
     or misread, returning the corrected whole. On top of that the client
     checks the numbering of every list for gaps. Finished scans are stored
     in public.page_scans, so looking at one again costs nothing.

     Placing the material into units is deliberately not done here yet. */
  var PAGE_READER_MODEL = "claude-opus-5";
  var PAGE_READER_USD_PER_MTOK = { input: 5, output: 25 };
  var PAGE_IMAGE_MAX_SIDE = 2200;
  var UNREADABLE_MARK = "[ვერ იკითხება]";

  var PAGE_BLOCK_KINDS = {

    explanation: "ახსნა", note: "შენიშვნა", table: "ცხრილი", vocabulary: "სიტყვები",
    examples: "მაგალითები", exercise: "სავარჯიშო", word_box: "სიტყვების ჩარჩო",
    dialogue: "დიალოგი", reading_text: "ტექსტი", caption: "სურათის წარწერა",
    page_footer: "გვერდის ბოლო", other: "სხვა"
  };

  var PAGE_BLOCK_SCHEMA = {
    type: "object",
    properties: {
      kind: { type: "string", enum: Object.keys(PAGE_BLOCK_KINDS) },
      heading: { type: "string", description: "The block's own printed heading or label, e.g. 'GRAMMAR 1 personal pronouns' or 'A PRACTICE'. Empty if it has none." },
      instruction: { type: "string", description: "The printed task sentence of an exercise. Empty otherwise." },
      lines: { type: "array", items: { type: "string" }, description: "Every printed line, sentence or numbered/lettered item of the block, one per entry, each with its printed number or letter. Empty when the block is purely a vocabulary list or a table." },
      vocabulary: {
        type: "array",
        items: {
          type: "object",
          properties: {
            en: { type: "string" },
            ipa: { type: "string", description: "The printed transcription including its slashes; empty if none is printed." },
            ka: { type: "string", description: "The printed Georgian meaning; empty if none is printed." }
          },
          required: ["en", "ipa", "ka"],
          additionalProperties: false
        }
      },
      table: {
        type: "array",
        description: "Rows of a printed table, top to bottom, header row first.",
        items: {
          type: "object",
          properties: { cells: { type: "array", items: { type: "string" } } },
          required: ["cells"],
          additionalProperties: false
        }
      }
    },
    required: ["kind", "heading", "instruction", "lines", "vocabulary", "table"],
    additionalProperties: false
  };

  function pageSchema(withChanges) {
    var properties = {
      page_number: { type: "string", description: "The printed page number; empty if it is not visible." },
      unit: { type: "string", description: "The unit as printed, e.g. 'UNIT 4'; empty if the page does not print it." },
      unit_title: { type: "string", description: "The printed unit title or question; empty if not on this page." },
      blocks: { type: "array", items: PAGE_BLOCK_SCHEMA },
      notes: { type: "array", items: { type: "string" }, description: "In Georgian. One entry per problem: printed text that could not be read and where it is, text that continues from or onto another page, anything else the reader of this transcription must know." }
    };
    var required = ["page_number", "unit", "unit_title", "blocks", "notes"];
    if (withChanges) {
      properties.changes = { type: "array", items: { type: "string" }, description: "In Georgian. One entry per thing you added, removed or corrected compared with the first transcription; empty if it was already complete and exact." };
      required.push("changes");
    }
    return { type: "object", properties: properties, required: required, additionalProperties: false };
  }

  var PAGE_READER_SYSTEM = [

  ].join("\n");

  var PAGE_VERIFY_PROMPT = [
    "Below is a first transcription of this page. Check it against the photo, region by region from the top of the page to the bottom, and in both columns where there are two.",
    "",
    "Look for printed things that are missing, cut short, merged together, misread or out of order: a skipped item in a numbered list, a missing table row or column, a dropped caption or word box, a lost instruction, a transcription or Georgian meaning left off a word, the page number. Look also for the opposite mistake: handwriting that was copied in, a blank that was filled, an exercise that was answered, or anything that is not printed on the page.",

    "",

  ].join("\n");

  var heic2anyLoadPromise = null;
  function loadHeic2Any() {
    if (window.heic2any) return Promise.resolve();
    if (heic2anyLoadPromise) return heic2anyLoadPromise;
    heic2anyLoadPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
      s.onload = function () { resolve(); };
      s.onerror = function () { heic2anyLoadPromise = null; reject(new Error("HEIC ფოტოების გადამყვანის ჩატვირთვა ვერ მოხერხდა — ინტერნეტი შეამოწმე.")); };
      document.head.appendChild(s);
    });
    return heic2anyLoadPromise;
  }

  function isHeicFile(file) {
    return /image\/hei[cf]/i.test(file.type || "") || /\.hei[cf]$/i.test(file.name || "");
  }

  /* Any photo -> an upright JPEG no longer than PAGE_IMAGE_MAX_SIDE on its
     long side: large enough to read small print, small enough to send. */
  function preparePageImage(file) {
    var toBlob = isHeicFile(file)
      ? loadHeic2Any().then(function () { return window.heic2any({ blob: file, toType: "image/jpeg", quality: 0.92 }); })
          .then(function (out) { return Array.isArray(out) ? out[0] : out; })
      : Promise.resolve(file);
    return toBlob.then(function (blob) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(blob);
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, PAGE_IMAGE_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.naturalWidth * scale);
          canvas.height = Math.round(img.naturalHeight * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          var dataUrl = canvas.toDataURL("image/jpeg", 0.9);
          resolve({ dataUrl: dataUrl, base64: dataUrl.split(",")[1] });
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("ფოტო ვერ გაიხსნა.")); };
        img.src = url;
      });
    });
  }

  function callPageReader(content, schema) {
    return postToEdgeFunction(ANTHROPIC_CHAT_FUNCTION_URL, { "content-type": "application/json" }, JSON.stringify({
      model: PAGE_READER_MODEL,
      max_tokens: 16000,
      system: PAGE_READER_SYSTEM,
      messages: [{ role: "user", content: content }],
      output_config: { format: { type: "json_schema", schema: schema } }
    })).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = JSON.parse(text); } catch (e) {}
        if (!res.ok || !data) {
          var msg = data && data.error && data.error.message ? data.error.message : "სერვერმა პასუხი არ დააბრუნა (სტატუსი " + res.status + ")";
          if (res.status === 401) msg = "სესია ვადაგასულია — შედი თავიდან.";
          if (res.status === 429) msg = "დღიური ლიმიტი ამოიწურა — გააგრძელე ხვალ.";
          if (res.status === 504 || res.status === 546) msg = "წაკითხვას ძალიან დიდი დრო დასჭირდა და შეწყდა — სცადე თავიდან.";
          throw new Error(msg);
        }
        if (data.stop_reason === "refusal") throw new Error("მოდელმა ამ გვერდის წაკითხვაზე უარი თქვა.");
        if (data.stop_reason === "max_tokens") throw new Error("გვერდზე ძალიან ბევრი ტექსტია და პასუხი შუაში შეწყდა.");
        var textBlock = (data.content || []).filter(function (c) { return c.type === "text"; })[0];
        if (!textBlock) throw new Error("პასუხი ცარიელი მოვიდა.");
        return { page: JSON.parse(textBlock.text), usage: data.usage || {} };
      });
    });
  }

  function readPage(image, onStage) {
    var imageBlock = { type: "image", source: { type: "base64", media_type: "image/jpeg", data: image.base64 } };
    var tokens = { input: 0, output: 0 };
    function count(usage) {
      tokens.input += (usage.input_tokens || 0) + (usage.cache_creation_input_tokens || 0) + (usage.cache_read_input_tokens || 0);
      tokens.output += usage.output_tokens || 0;
    }
    onStage("1/2 — გვერდს ვკითხულობ…");
    return callPageReader([imageBlock, { type: "text", text: "Transcribe this page." }], pageSchema(false)).then(function (first) {
      count(first.usage);
      onStage("2/2 — ვამოწმებ, რამე ხომ არ გამომრჩა…");
      return callPageReader([imageBlock, { type: "text", text: PAGE_VERIFY_PROMPT + "\n\n" + JSON.stringify(first.page) }], pageSchema(true));
    }).then(function (second) {
      count(second.usage);
      var page = second.page;
      var changes = page.changes || [];
      delete page.changes;
      return { page: page, changes: changes, tokens: tokens };
    });
  }

  function pageScanCostUsd(tokens) {
    return (tokens.input * PAGE_READER_USD_PER_MTOK.input + tokens.output * PAGE_READER_USD_PER_MTOK.output) / 1e6;
  }

  /* Numbered lists must run without gaps: a jump from 4 to 6 means an item
     was lost. A list that starts above 1 is only reported as a possible
     continuation from the previous page. */
  function pageNumberingWarnings(page) {
    var warnings = [];
    page.blocks.forEach(function (block) {
      var name = block.heading || PAGE_BLOCK_KINDS[block.kind] || block.kind;
      var run = [];
      function closeRun() {
        if (run.length > 1) {
          if (run[0] > 1) warnings.push("„" + name + "“: ნუმერაცია იწყება " + run[0] + "-დან — შესაძლოა წინა გვერდიდან გრძელდება.");
          for (var i = 1; i < run.length; i++) {
            if (run[i] !== run[i - 1] + 1) warnings.push("„" + name + "“: " + run[i - 1] + "-ის შემდეგ მოდის " + run[i] + " — შესაძლოა პუნქტი გამორჩა.");
          }
        }
        run = [];
      }
      block.lines.forEach(function (line) {
        var m = /^\s*(\d{1,2})[.)]\s/.exec(line);
        if (!m) return;
        var n = parseInt(m[1], 10);
        if (run.length && n <= run[run.length - 1]) closeRun(); /* a second list inside the same block */
        run.push(n);
      });
      closeRun();
    });
    return warnings;
  }

  function pageScanStats(page) {
    var stats = { blocks: page.blocks.length, words: 0, exercises: 0, items: 0, unreadable: 0 };
    var all = JSON.stringify(page);
    stats.unreadable = all.split(UNREADABLE_MARK).length - 1;
    page.blocks.forEach(function (block) {
      stats.words += block.vocabulary.length;
      if (block.kind === "exercise") { stats.exercises++; stats.items += block.lines.length; }
    });
    return stats;
  }

  function renderPageBlocks(page) {
    var wrap = el("div", {});
    page.blocks.forEach(function (block) {
      var card = el("div", { style: "border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:var(--surface)" });
      card.appendChild(el("div", { class: "eyebrow" }, [document.createTextNode(PAGE_BLOCK_KINDS[block.kind] || block.kind)]));
      if (block.heading) card.appendChild(el("div", { style: "font-weight:700;margin:4px 0" }, [document.createTextNode(block.heading)]));
      if (block.instruction) card.appendChild(el("div", { style: "font-style:italic;margin:4px 0;color:var(--ink-soft)" }, [document.createTextNode(block.instruction)]));
      block.lines.forEach(function (line) {
        card.appendChild(el("div", { style: "margin:3px 0;white-space:pre-wrap;font-size:0.92rem;line-height:1.5" }, [document.createTextNode(line)]));
      });
      function grid(rows) {
        var table = el("table", { style: "border-collapse:collapse;width:100%;font-size:0.88rem;margin:6px 0" });
        rows.forEach(function (cells) {
          var tr = el("tr", {});
          cells.forEach(function (cell) {
            tr.appendChild(el("td", { style: "border:1px solid var(--border);padding:5px 8px;vertical-align:top;white-space:pre-wrap" }, [document.createTextNode(cell)]));
          });
          table.appendChild(tr);
        });
        return table;
      }
      if (block.vocabulary.length) card.appendChild(grid(block.vocabulary.map(function (w) { return [w.en, w.ipa, w.ka]; })));
      if (block.table.length) card.appendChild(grid(block.table.map(function (row) { return row.cells; })));
      wrap.appendChild(card);
    });
    return wrap;
  }
