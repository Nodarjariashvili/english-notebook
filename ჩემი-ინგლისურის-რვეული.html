  function buildSystemPrompt() {
    var scopedUnit = chatScopeUnit ? UNITS.filter(function (u) { return u.id === chatScopeUnit; })[0] : null;
    var relevantDecks = scopedUnit ? unitDecks(scopedUnit) : DECKS;
    var relevantGrammar = scopedUnit ? unitGrammarTopics(scopedUnit) : GRAMMAR;
    var relevantIds = relevantGrammar.map(function (g) { return g.id; });
    var deckTopics = relevantDecks.map(function (d) { return d.ka + " (" + d.en + ")"; }).join(", ") || "(none for this unit — focus on the grammar below)";
    var grammarTopics = relevantGrammar.map(function (g) { return g.ka + " — " + g.en; }).join("; ") || "(none for this unit — focus on the vocabulary above)";
    var wordList = relevantDecks.length
      ? relevantDecks.map(function (d) { return d.cards.map(function (c) { return c.en; }).join(", "); }).join(", ")
      : "";

    var passages = [];
    if (relevantIds.indexOf("readingJacob") !== -1) {
      passages.push("PASSAGE — Jacob's Family: \"My name is Jacob Thompson, and I am 28 years old. I am from Great Britain and live in London with my family. I have a big family — mother, father, grandparents, wife, and children — but I don't have any sisters or brothers. I am the only child. Only 7 of us are in the family photo; my parents are not with us. My mum is a busy teacher. My father is a truck driver who is always on the road. Grandma is 78 and retired. Grandpa is 80 and an energetic university professor. I fell in love with my wife, Helen, when I was 17 and we soon married. We have two sons, Alex and Jack, and a daughter, Sally, aged 6, 8, and 7. We all love and respect each other.\"");
    }
    if (relevantIds.indexOf("readingKeiraLiam") !== -1) {
      passages.push("PASSAGE — Keira & Liam's routines: \"Keira gets up at 2 a.m., showers, gets dressed, leaves home at 3 a.m., gets to work at 3.30, has a quick breakfast at work, reads the plan for the morning — her breakfast TV program starts at 5 a.m. Liam gets up at 3 p.m., spends time with family, leaves for work at 8.30 p.m. because he worries about traffic, starts work at 10 p.m. at the hospital helping patients and doctors, has coffee and a snack instead of lunch, finishes at 6 a.m., has dinner, gets home at 7 a.m. and goes to bed exhausted.\"");
    }

    var lines = [
      "You are " + PROFILE.nameEn + "'s friendly English conversation partner for spoken/written practice.",
      "",
      "Learner profile: " + PROFILE.nameEn + " (" + PROFILE.name + ") " + PROFILE.surnameEn + ", " + PROFILE.age + ", from " + PROFILE.countryEn + ", lives in " + PROFILE.cityEn + ", works as a " + PROFILE.jobEn + ".",
      "She is " + (LEVEL_META[appSettings.level] || LEVEL_META.beginner).prompt + " English learner working through a textbook called \"Speaking Tags.\"",
      ""
    ];
    if (scopedUnit) {
      lines.push("This conversation is a THEMED PRACTICE SESSION focused specifically on " + scopedUnit.ka + " — keep it centered on this unit's material only, don't wander into other units' vocabulary or grammar.");
      lines.push("");
      if (wordList) {
        lines.push("The exact vocabulary she knows for this unit is: " + wordList + ".");
        lines.push("STRICT RULE: use ONLY words from this list (plus basic A1 function words: a, the, is, am, are, was, were, in, on, at, and, but, or, I, you, he, she, it, we, they, this, that, do, does, don't, doesn't, have, has, my, your, his, her, its, our, their, yes, no, please, thank you). Do NOT introduce new content vocabulary beyond this unit's list, even if it would be natural in a normal conversation.");
        lines.push("A small drift in topic is fine (e.g. a related follow-up question), but never let the vocabulary or grammar get harder than this unit's level — if you need a concept outside the list, rephrase it using only the words above.");
        lines.push("");
      }
    }
    lines.push("Vocabulary topics she has studied — steer the conversation toward these: " + deckTopics + ".");
    lines.push("Grammar she has studied — stay within this level: " + grammarTopics + ".");
    lines.push("");
    if (passages.length) {
      lines.push("She has also read " + (passages.length > 1 ? "these passages" : "this passage") + " from her textbook, and can be quizzed on " + (passages.length > 1 ? "them" : "it") + " by voice:");
      passages.forEach(function (p) { lines.push(p); });
      lines.push("When she asks to be quizzed on a passage, ask her simple comprehension questions about it ONE AT A TIME in English, wait for her spoken answer, gently confirm or correct the factual content in your reply, and continue with the next question — in addition to the grammar correction in has_correction/corrected/explanation.");
      lines.push("");
    }
    lines.push("Your job on every turn:");
    var tail = [
      "1. Reply naturally and warmly in ENGLISH ONLY, continuing the conversation, asking a simple follow-up question, short sentences, common A1-A2 words. Keep it brief (2-4 sentences).",
      "2. Separately, check her most recent message for English grammar or vocabulary mistakes.",
      "   - If there IS a mistake: set has_correction to true, give the corrected English phrase in 'corrected', and a very short explanation IN GEORGIAN (one sentence) in 'explanation'.",
      "   - If her message has no mistakes: set has_correction to false and leave 'corrected'/'explanation' as empty strings.",
      "3. Never blend the correction into the reply — keep them completely separate."
    ];
    return lines.concat(tail).join("\n");
  }

      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

    if (!scopedUnit) {
      var modeBox = el("div", { class: "chat-mode-row" });
      modeBox.appendChild(el("span", { class: "chat-mode-label" }, [document.createTextNode("📘 თემატური საუბარი კონკრეტულ თავზე:")]));
      var unitChips = el("div", { class: "chat-unit-chips" });
      UNITS.forEach(function (u) {
        var chip = el("button", { class: "chat-chip", type: "button" }, [document.createTextNode(u.short)]);
        chip.addEventListener("click", function (id) { return function () { pickChatUnit(id); }; }(u.id));
        unitChips.appendChild(chip);
      });
      modeBox.appendChild(unitChips);
      root.appendChild(modeBox);
    }

    var errorBanner = el("div", { class: "chat-error", id: "chatErrorBanner", style: "display:none" });
    root.appendChild(errorBanner);

    var chips = el("div", { class: "chat-chips" });
    var chipList = scopedUnit ? (CHAT_TOPIC_CHIPS[scopedUnit.id] || GENERAL_CHAT_CHIPS) : GENERAL_CHAT_CHIPS;
    chipList.forEach(function (pair) {
      var chip = el("button", { class: "chat-chip", type: "button" }, [document.createTextNode(pair[0])]);
      chip.addEventListener("click", function () {
        var ta = document.getElementById("chatUserInput");
        ta.value = pair[1];
        ta.focus();
      });
      chips.appendChild(chip);
    });
    root.appendChild(chips);

    var messagesEl = el("div", { class: "chat-messages", id: "chatMessages" });
    root.appendChild(messagesEl);

    var inputBar = el("div", { class: "chat-input-bar" });
    var micBtn = el("button", { class: "chat-mic-btn", id: "chatMicBtn", type: "button", title: "ხმოვანი დიალოგის დაწყება" }, [document.createTextNode("🎙")]);
    var textarea = el("textarea", { id: "chatUserInput", rows: "1", placeholder: "დაწერე ინგლისურად ან დააჭირე 🎙-ს ხმოვანი დიალოგისთვის..." });
    var sendBtn = el("button", { class: "chat-send-btn", id: "chatSendBtn", type: "button" }, [document.createTextNode("➤")]);
    inputBar.appendChild(micBtn);
    inputBar.appendChild(textarea);
    inputBar.appendChild(sendBtn);
    root.appendChild(inputBar);
    var statusEl = el("div", { class: "chat-voice-status", id: "chatVoiceStatus" }, [el("span", { class: "pulse-dot" }), el("span", { id: "chatVoiceStatusText" })]);
    root.appendChild(statusEl);

    sendBtn.addEventListener("click", function () { sendChatMessage(); });
    micBtn.addEventListener("click", toggleVoiceMode);
    textarea.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    });
    textarea.addEventListener("input", function () {
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
    });

    updateMicButton();
    if (voiceModeOn) setVoiceStatus(voiceState || "listening");

    if (!chatStarted) {
      chatStarted = true;
      addChatBubble("assistant", "Hi Nono! 😊 How are you today? Let's practice some English — tell me about your day, or pick a topic above to get started.", null);
    } else {
      chatHistory.forEach(function (m) {
        if (m.role === "user") addChatBubble("user", m.content, null);
        else addChatBubble("assistant", m.content, null);
      });
    }
    textarea.focus();
  }

  function addChatBubble(role, text, correction) {
    var messagesEl = document.getElementById("chatMessages");
    if (!messagesEl) return;
    var wrap = el("div", { class: "chat-msg " + role });
    var bubbleRow = el("div", { class: "chat-bubble-row" });
    bubbleRow.appendChild(el("div", { class: "chat-bubble", html: chatEscapeHtml(text) }));
    if (role === "assistant") {
      var speakBtn = el("button", { class: "chat-speak-btn", type: "button", title: "ხმამაღლა მოსმენა" }, [document.createTextNode("🔊")]);
      speakBtn.addEventListener("click", function () { speakChatText(text); });
      bubbleRow.appendChild(speakBtn);
    }
    wrap.appendChild(bubbleRow);
    if (correction && correction.has_correction) {
      wrap.appendChild(el("div", { class: "chat-correction", html:
        "<span class='label'>შესწორება:</span> <strong>" + chatEscapeHtml(correction.corrected) + "</strong> — " + chatEscapeHtml(correction.explanation)
      }));
    }
    messagesEl.appendChild(wrap);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function addChatTyping() {
    var messagesEl = document.getElementById("chatMessages");
    if (!messagesEl) return;
    var wrap = el("div", { class: "chat-msg assistant", id: "chatTyping" });
    wrap.appendChild(el("div", { class: "chat-bubble chat-typing", html: "<span></span><span></span><span></span>" }));
    messagesEl.appendChild(wrap);
    window.scrollTo(0, document.body.scrollHeight);
  }
  function removeChatTyping() {
    var el2 = document.getElementById("chatTyping");
    if (el2) el2.remove();
  }

  function showChatError(msg) {
    var banner = document.getElementById("chatErrorBanner");
    if (!banner) return;
    banner.textContent = msg;
    banner.style.display = "block";
  }
  function hideChatError() {
    var banner = document.getElementById("chatErrorBanner");
    if (banner) banner.style.display = "none";
  }

  function sendChatMessage(voiceText) {
    var isVoiceTurn = typeof voiceText === "string";
    var textarea = document.getElementById("chatUserInput");
    var sendBtn = document.getElementById("chatSendBtn");
    var text = isVoiceTurn ? voiceText.trim() : (textarea ? textarea.value.trim() : "");
    if (!text) {
      if (voiceModeOn) resumeListening();
      return;
    }
    hideChatError();
    addChatBubble("user", text, null);
    chatHistory.push({ role: "user", content: text });
    if (!isVoiceTurn && textarea) { textarea.value = ""; textarea.style.height = "auto"; }
    if (sendBtn) sendBtn.disabled = true;
    addChatTyping();
    if (voiceModeOn) setVoiceStatus("processing");

    fetch(CHAT_API_URL, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": getChatKey(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: CHAT_MODEL,
        max_tokens: 700,
        system: buildSystemPrompt(),
        messages: chatHistory,
        output_config: {
          effort: "medium",
          format: { type: "json_schema", schema: CHAT_OUTPUT_SCHEMA }
        }
      })
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      removeChatTyping();
      if (!result.ok) {
        if (result.status === 401) {
          showChatError("API გასაღები არასწორია ან ვადაგასულია. გთხოვ შეამოწმე ⚙ მენიუში.");
        } else if (result.status === 429) {
          showChatError("მოთხოვნები ძალიან ხშირია (rate limit) — მოიცადე ცოტა ხანი და სცადე ისევ.");
        } else {
          showChatError("შეცდომა: " + (result.data && result.data.error && result.data.error.message ? result.data.error.message : "უცნობი შეცდომა"));
        }
        chatHistory.pop();
        if (sendBtn) sendBtn.disabled = false;
        if (voiceModeOn) exitVoiceMode();
        return;
      }
      var content = result.data.content || [];
      var textBlock = null;
      for (var i = 0; i < content.length; i++) {
        if (content[i].type === "text") { textBlock = content[i]; break; }
      }
      if (!textBlock) {
        showChatError("პასუხი ვერ მოვიდა — სცადე ისევ.");
        if (sendBtn) sendBtn.disabled = false;
        if (voiceModeOn) exitVoiceMode();
        return;
      }
      var parsed = JSON.parse(textBlock.text);
      addChatBubble("assistant", parsed.reply, parsed);
      chatHistory.push({ role: "assistant", content: parsed.reply });
      if (sendBtn) sendBtn.disabled = false;
      if (voiceModeOn) {
        setVoiceStatus("speaking");
        speakChatTextAuto(parsed);
      } else {
        if (appSettings.autoSpeak) speakChatText(parsed.reply);
        if (!isVoiceTurn && textarea) textarea.focus();
      }
    }).catch(function (err) {
      removeChatTyping();
      showChatError("კავშირის შეცდომა: " + err.message);
      chatHistory.pop();
      if (sendBtn) sendBtn.disabled = false;
      if (voiceModeOn) exitVoiceMode();
    });
  }

  /* ---------- voice: status indicator ---------- */
  var VOICE_STATUS_LABELS = { listening: "გისმენ...", processing: "ვამუშავებ...", speaking: "პასუხობს..." };

  function setVoiceStatus(state) {
    voiceState = state;
    var wrap = document.getElementById("chatVoiceStatus");
    var text = document.getElementById("chatVoiceStatusText");
    if (!wrap || !text) return;
    text.textContent = VOICE_STATUS_LABELS[state] || "";
    wrap.className = "chat-voice-status show state-" + state;
  }
  function hideVoiceStatus() {
    voiceState = "";
    var wrap = document.getElementById("chatVoiceStatus");
    if (wrap) wrap.className = "chat-voice-status";
  }

  /* ---------- voice: text-to-speech ---------- */
  function speakChatText(text) {
    if (!window.speechSynthesis) {
      showChatError("ეს ბრაუზერი ხმის სინთეზს ვერ უჭერს მხარს.");
      return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }

  /* Speaks the assistant's reply and, when the turn included a correction,
     follows it with a spoken correction (English phrase + Georgian
     explanation if a Georgian voice is available) before resuming
     listening — so a mistake is corrected out loud, not just shown as text. */
  function speakChatTextAuto(parsed) {
    if (!window.speechSynthesis) {
      if (voiceModeOn) resumeListening();
      return;
    }
    window.speechSynthesis.cancel();

    var utterances = [];
    var mainU = new SpeechSynthesisUtterance(parsed.reply);
    mainU.lang = "en-US";
    mainU.rate = 0.95;
    utterances.push(mainU);

    if (parsed.has_correction && parsed.corrected) {
      var correctionEn = new SpeechSynthesisUtterance("Quick correction — the right way to say that is: " + parsed.corrected);
      correctionEn.lang = "en-US";
      correctionEn.rate = 0.92;
      utterances.push(correctionEn);
      if (parsed.explanation && hasVoiceForLang("ka")) {
        var correctionKa = new SpeechSynthesisUtterance(parsed.explanation);
        correctionKa.lang = "ka-GE";
        correctionKa.rate = 0.95;
        utterances.push(correctionKa);
      }
    }

    var last = utterances[utterances.length - 1];
    last.onend = function () { if (voiceModeOn) resumeListening(); };
    last.onerror = function () { if (voiceModeOn) resumeListening(); };
    utterances.forEach(function (u) { window.speechSynthesis.speak(u); });
  }

  /* ---------- voice: continuous hands-free dialogue mode ----------
     One getUserMedia() permission request per voice-mode session: the
     mic MediaStream is acquired once in enterVoiceMode() and reused for
     every recording turn (a fresh MediaRecorder per turn, same stream) —
     it's only released when the mode is exited. This is what keeps the
     browser from re-prompting for microphone access on every turn. */
  var voiceStream = null;

  function toggleVoiceMode() {
    if (voiceModeOn) exitVoiceMode(); else enterVoiceMode();
  }

  function enterVoiceMode() {
    hideChatError();
    if (!getOpenAiKey()) {
      showChatError("ხმოვანი დიალოგისთვის საჭიროა OpenAI API გასაღები — დაამატე ⚙ მენიუში.");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      showChatError("ეს ბრაუზერი მიკროფონის ჩაწერას ვერ უჭერს მხარს.");
      return;
    }
    voiceModeOn = true;
    updateMicButton();
    setVoiceStatus("listening");
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (!voiceModeOn) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      voiceStream = stream;
      beginRecordingTurn();
    }).catch(function (err) {
      showChatError("მიკროფონზე წვდომა ვერ მოხერხდა: " + err.message);
      voiceModeOn = false;
      updateMicButton();
      hideVoiceStatus();
    });
  }

  function exitVoiceMode() {
    voiceModeOn = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (mediaRecorder && mediaRecorder.state === "recording") {
      recordingCancelled = true;
      mediaRecorder.stop();
    }
    stopSilenceWatcher();
    teardownAnalyser();
    if (voiceStream) {
      voiceStream.getTracks().forEach(function (t) { t.stop(); });
      voiceStream = null;
    }
    isRecording = false;
    updateMicButton();
    hideVoiceStatus();
  }

  function resumeListening() {
    if (!voiceModeOn) return;
    setVoiceStatus("listening");
    var trackLive = voiceStream && voiceStream.getAudioTracks().some(function (t) { return t.readyState === "live"; });
    if (trackLive) {
      beginRecordingTurn();
      return;
    }
    /* Mic track ended unexpectedly (e.g. device unplugged) — re-acquire once. */
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (!voiceModeOn) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      voiceStream = stream;
      beginRecordingTurn();
    }).catch(function (err) {
      showChatError("მიკროფონზე წვდომა ვერ მოხერხდა: " + err.message);
      exitVoiceMode();
    });
  }

  function updateMicButton() {
    var btn = document.getElementById("chatMicBtn");
    if (!btn) return;
    btn.classList.toggle("recording", isRecording);
    btn.classList.toggle("voice-active", voiceModeOn);
    if (voiceModeOn) {
      btn.textContent = "⏹";
      btn.title = "ხმოვანი დიალოგის შეწყვეტა";
    } else {
      btn.textContent = "🎙";
      btn.title = "ხმოვანი დიალოგის დაწყება";
    }
  }

  /* ---------- voice: speech-to-text via MediaRecorder + Whisper ---------- */
  function pickRecorderMimeType() {
    var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/mp4;codecs=mp4a.40.2", "audio/ogg;codecs=opus"];
    for (var i = 0; i < candidates.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return "";
  }

  /* The MediaRecorder needs the full "audio/webm;codecs=opus" string to pick
     the right encoder, but Whisper's format-sniffing gets confused when that
     same codecs parameter rides along as the uploaded file's Content-Type —
     that mismatch is what produced "audio file could not be decoded". Strip
     it down to the bare container type ("audio/webm") for the Blob/upload. */
  function baseMimeType(m) {
    return m ? m.split(";")[0] : "";
  }

  function extensionForMimeType(base) {
    if (base.indexOf("mp4") !== -1) return "m4a";
    if (base.indexOf("ogg") !== -1) return "ogg";
    if (base.indexOf("wav") !== -1) return "wav";
    return "webm";
  }

  function beginRecordingTurn() {
    if (!voiceStream) {
      showChatError("მიკროფონის ნაკადი ვერ მოიძებნა.");
      exitVoiceMode();
      return;
    }
    var mimeType = pickRecorderMimeType();
    try {
      mediaRecorder = mimeType ? new MediaRecorder(voiceStream, { mimeType: mimeType }) : new MediaRecorder(voiceStream);
    } catch (e) {
      showChatError("ჩაწერის დაწყება ვერ მოხერხდა: " + e.message);
      exitVoiceMode();
      return;
    }
    audioChunks = [];
    mediaRecorder.addEventListener("dataavailable", function (e) {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    });
    mediaRecorder.addEventListener("stop", function () {
      stopSilenceWatcher();
      isRecording = false;
      updateMicButton();
      if (recordingCancelled) { recordingCancelled = false; return; }
      var base = baseMimeType(mediaRecorder.mimeType || mimeType) || "audio/webm";
      var blob = new Blob(audioChunks, { type: base });
      handleVoiceTurn(blob);
    });
    mediaRecorder.start();
    isRecording = true;
    updateMicButton();
    startSilenceWatcher(voiceStream);
  }

  function stopRecordingForSilence() {
    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  }

  /* Web Audio API AnalyserNode: watches mic input level and auto-stops
     recording after ~2.5s of silence (following at least a bit of speech),
     or after a hard cap so a stuck mic can't record forever. The
     AudioContext/analyser are created once per voice-mode session
     (ensureAnalyser) and just re-armed each turn — not recreated. */
  function ensureAnalyser(stream) {
    if (analyser) return true;
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return false;
      audioCtx = new AudioContextClass();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      return true;
    } catch (e) {
      return false;
    }
  }

  function teardownAnalyser() {
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    analyser = null;
  }

  function startSilenceWatcher(stream) {
    if (!ensureAnalyser(stream)) return;
    var data = new Uint8Array(analyser.frequencyBinCount);
    var SPEECH_RMS_THRESHOLD = 14;
    var SILENCE_MS = 4000;
    var MAX_RECORD_MS = 60000;
    var MIN_RECORD_MS = 700;
    var hasSpoken = false;
    var lastLoudTs = Date.now();
    var startTs = Date.now();

    silenceCheckInterval = setInterval(function () {
      if (!analyser) return;
      analyser.getByteTimeDomainData(data);
      var sumSq = 0;
      for (var i = 0; i < data.length; i++) {
        var v = data[i] - 128;
        sumSq += v * v;
      }
      var rms = Math.sqrt(sumSq / data.length);
      var now = Date.now();
      if (now - startTs < MIN_RECORD_MS) return;
      if (rms > SPEECH_RMS_THRESHOLD) { hasSpoken = true; lastLoudTs = now; }
      if (hasSpoken && (now - lastLoudTs) > SILENCE_MS) { stopRecordingForSilence(); return; }
      if ((now - startTs) > MAX_RECORD_MS) { stopRecordingForSilence(); }
    }, 150);
  }

  function stopSilenceWatcher() {
    if (silenceCheckInterval) { clearInterval(silenceCheckInterval); silenceCheckInterval = null; }
  }

  function handleVoiceTurn(blob) {
    if (!voiceModeOn) return;
    if (blob.size < 2000) {
      /* Too little audio to be a real answer (mic blip, or silence-detection
         fired before any speech) — re-listen instead of sending junk to Whisper. */
      resumeListening();
      return;
    }
    setVoiceStatus("processing");
    var ext = extensionForMimeType(blob.type);
    var form = new FormData();
    form.append("file", blob, "recording." + ext);
    form.append("model", "whisper-1");
    form.append("language", "en");

    fetch(WHISPER_API_URL, {
      method: "POST",
      headers: { "Authorization": "Bearer " + getOpenAiKey() },
      body: form
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    }).then(function (result) {
      if (!voiceModeOn) return;
      if (!result.ok) {
        var msg = result.data && result.data.error && result.data.error.message ? result.data.error.message : "ტრანსკრიფცია ვერ შესრულდა";
        if (result.status === 401) msg = "OpenAI გასაღები არასწორია — შეამოწმე ⚙ მენიუში.";
        showChatError("Whisper შეცდომა: " + msg);
        exitVoiceMode();
        return;
      }
      var text = (result.data.text || "").trim();
      if (!text) { resumeListening(); return; }
      sendChatMessage(text);
    }).catch(function (err) {
      if (!voiceModeOn) return;
      showChatError("კავშირის შეცდომა (Whisper): " + err.message);
      exitVoiceMode();
    });
  }

  /* ---------- theme ---------- */
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem("nonaEnglishNotebook.theme"); } catch (e) {}
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    document.getElementById("themeToggle").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var effectiveDark = cur ? cur === "dark" : prefersDark;
      var next = effectiveDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("nonaEnglishNotebook.theme", next); } catch (e) {}
    });
  }

  document.getElementById("settingsToggle").addEventListener("click", function () {
    switchView("settings");
  });

  initTheme();
  switchView("home");
})();
</script>

</body>
