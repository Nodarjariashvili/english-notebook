  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans Georgian', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--info); }
  a:hover { color: var(--brand-ink); }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(circle at 1px 1px, var(--paper-rule) 1px, transparent 0);
    background-size: 22px 22px;
    opacity: 0.5;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    inset: -40px;
    pointer-events: none;
    background:
      radial-gradient(680px circle at 92% -8%, var(--brand-soft) 0%, transparent 55%),
      radial-gradient(560px circle at -8% 12%, var(--gold-soft) 0%, transparent 50%),
      radial-gradient(520px circle at 100% 90%, var(--rust-soft) 0%, transparent 45%);
    opacity: 0.55;
    z-index: 0;
    animation: driftBlobs 18s ease-in-out infinite;
  }
  @keyframes driftBlobs {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-14px, 12px); }
  }

  h1, h2, h3, .display { font-family: 'Noto Sans Georgian', Georgia, sans-serif; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
  .hand { font-family: 'Noto Sans Georgian', system-ui, sans-serif; font-weight: 600; }
  .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); font-weight: 600; }
  button { font-family: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .desk { position: relative; z-index: 1; min-height: 100vh; display: flex; justify-content: center; padding: clamp(12px, 3vw, 40px); }
  .notebook { width: 100%; display: flex; flex-direction: column; }
  .notebook-body { width: 100%; display: flex; align-items: flex-start; }

  /* --- Tab rail --- */
  .tabs { display: flex; flex-direction: column; gap: 10px; padding-top: 54px; flex-shrink: 0; z-index: 2; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    background: var(--tab-bg); color: var(--ink-soft);
    border: 1px solid var(--border); border-right: none;
    padding: 11px 16px 11px 14px; font-size: 0.92rem; font-weight: 600;
    border-radius: 18px 0 0 18px; cursor: pointer; margin-right: -1px;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    box-shadow: -2px 2px 6px var(--shadow);
    writing-mode: horizontal-tb; white-space: nowrap;
  }
  .tab:hover { transform: translateX(-2px); }
  .tab.active { background: var(--tab-bg-active); color: var(--ink); transform: translateX(-6px); border-color: var(--border); }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
  .tab .dot[data-state="green"] { background: var(--green); }
  .tab .dot[data-state="gold"] { background: var(--gold); }
  .tab .dot[data-state="rust"] { background: var(--rust); }
  .tab-divider { height: 1px; background: var(--border); margin: 4px 10px 4px 0; }
  .tab-unit { font-size: 0.82rem; font-weight: 500; padding: 8px 14px 8px 12px; opacity: 0.88; }
  .tab-unit.active { opacity: 1; }
  @media (max-width: 640px) { .tab-divider { display: none; } }

  /* --- Page surface --- */
  .page {
    flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px 26px 26px 26px; box-shadow: 0 18px 40px var(--shadow), 0 2px 0 var(--border);
    position: relative; overflow: hidden;
  }
  .masthead {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px clamp(18px, 4vw, 34px); border-bottom: 2px solid var(--brand);
    background: linear-gradient(180deg, var(--brand-soft), transparent);
  }
  .masthead .title-block { display: flex; flex-direction: column; gap: 2px; }
  .masthead h1 { font-size: clamp(1.3rem, 2.6vw, 1.7rem); color: var(--brand-ink); }
  .masthead .subtitle { color: var(--ink-soft); font-size: 0.88rem; }
  .admin-badge {
    display: inline-block; vertical-align: middle; margin-left: 8px;
    background: var(--admin-bg); color: var(--admin-ink); font-size: 0.62rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px;
  }
  .masthead-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .theme-toggle, .settings-toggle {
    border: none; background: var(--brand-gradient); color: #fff;
    border-radius: 999px; padding: 7px 14px; font-size: 0.76rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 0 var(--brand-ink), 0 4px 10px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .theme-toggle:hover, .settings-toggle:hover { background: var(--brand-ink); transform: scale(1.05); box-shadow: 0 3px 0 var(--brand-ink), 0 6px 14px var(--shadow); }
  .theme-toggle:active, .settings-toggle:active { transform: scale(0.97); box-shadow: 0 1px 0 var(--brand-ink), 0 2px 6px var(--shadow); }

  .view { display: none; padding: 26px clamp(18px, 4vw, 34px) 28px; }

  /* ---------- settings page ---------- */
  .settings-page { max-width: 620px; margin: 0 auto; }
  .settings-profile-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin: 18px 0 22px; box-shadow: 0 1px 3px var(--shadow); transition: box-shadow 0.15s ease;
  }
  .settings-profile-card:hover { box-shadow: 0 4px 12px var(--shadow); }
  .settings-profile-header { display: flex; align-items: center; gap: 16px; }
  .settings-profile-card .avatar { width: 56px; height: 56px; font-size: 1.15rem; }
  .settings-profile-name-row { display: flex; align-items: center; gap: 8px; }
  .settings-profile-name-row h3 { font-size: 1.1rem; }
  .settings-edit-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; width: 28px; height: 28px; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; font-size: 0.82rem; flex-shrink: 0; transition: border-color 0.15s ease;
  }
  .settings-edit-btn:hover { border-color: var(--info); color: var(--info); }
  .settings-edit-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 10px; }
  .settings-edit-form label { font-size: 0.76rem; color: var(--ink-faint); font-weight: 600; display: block; margin-bottom: 3px; }
  .settings-edit-form input {
    width: 100%; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--ink); font-size: 0.88rem;
  }
  .settings-edit-form input:focus { border-color: var(--brand); }
  .settings-edit-form input.field-invalid { border-color: var(--rust); }
  .settings-edit-actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
  .settings-profile-info-rows { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .settings-profile-info-rows .settings-row { padding: 8px 0; }

  .settings-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 1px 3px var(--shadow); transition: box-shadow 0.15s ease;
  }
  .settings-section:hover { box-shadow: 0 4px 12px var(--shadow); }
  .settings-section h4 { font-size: 0.98rem; color: var(--brand-ink); margin-bottom: 4px; }
  .settings-section .settings-section-sub { font-size: 0.8rem; color: var(--ink-faint); margin-bottom: 12px; }
  .settings-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .settings-row:last-child { border-bottom: none; padding-bottom: 0; }
  .settings-row-main { flex: 1; min-width: 0; }
  .settings-row-label { font-weight: 600; font-size: 0.9rem; color: var(--ink); }
  .settings-row-value { font-size: 0.8rem; color: var(--ink-faint); margin-top: 1px; }
  .settings-icon-circle {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .settings-icon-circle[data-color="green"] { background: var(--green-soft); }
  .settings-icon-circle[data-color="blue"] { background: var(--info-soft); }
  .settings-icon-circle[data-color="orange"] { background: var(--gold-soft); }
  .settings-icon-circle[data-color="violet"] { background: var(--violet-soft); }

  .toggle-switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-switch .toggle-track {
    position: absolute; inset: 0; background: var(--border); border-radius: 999px;
    cursor: pointer; transition: background 0.18s ease;
  }
  .toggle-switch .toggle-track::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: var(--surface); border-radius: 50%; transition: transform 0.18s ease; box-shadow: 0 1px 3px var(--shadow);
  }
  .toggle-switch input:checked + .toggle-track { background: var(--brand); }
  .toggle-switch input:checked + .toggle-track::before { transform: translateX(18px); }

  .level-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .level-pill {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 13px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .level-pill:hover { border-color: var(--brand); }
  .level-pill.active { background: var(--brand); border-color: var(--brand); color: #fff; }


  .reminder-banner {
    background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold);
    border-radius: 12px; padding: 12px 16px; font-size: 0.88rem; font-weight: 600;
    margin-bottom: 16px;
  }
  .view.active { display: block; }
  .page.unit-mode #view-cards, .page.unit-mode #view-grammar { padding-top: 10px; }
  @media (min-width: 760px) {
    .page.unit-mode { display: grid; grid-template-columns: 1fr 1fr; align-items: start; column-gap: 6px; }
    .page.unit-mode #view-home { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-cards.active):not(:has(#view-grammar.active)) #view-cards { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-grammar.active):not(:has(#view-cards.active)) #view-grammar { grid-column: 1 / -1; }
    .page.unit-mode:has(#view-cards.active):has(#view-grammar.active) #view-grammar { border-left: 1px solid var(--border); }
    .page.unit-mode:has(#view-cards.active .back-link) { grid-template-columns: 1fr; }
    .page.unit-mode:has(#view-grammar.active .back-link) { grid-template-columns: 1fr; }
    .page.unit-mode:has(#view-cards.active .accordion.open) { grid-template-columns: 1fr; }
    .page.unit-mode:has(#view-grammar.active .accordion.open) { grid-template-columns: 1fr; }
  }

  /* --- Dashboard --- */
  .home-hero { position: relative; }
  .profile-row { position: relative; z-index: 1; display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 28px; }
  .id-card { flex: 1 1 300px; border: 1px solid var(--border); border-top: 4px solid var(--gold); border-radius: 16px; padding: 18px 20px; background: var(--surface); display: flex; gap: 16px; align-items: center; box-shadow: 0 1px 3px var(--shadow); }
  .avatar { width: 58px; height: 58px; border-radius: 50%; background: var(--brand-gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans Georgian', sans-serif; font-size: 1.3rem; font-weight: 700; flex-shrink: 0; }
  .id-card dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.86rem; }
  .id-card dt { color: var(--ink-faint); }
  .id-card dd { margin: 0; color: var(--ink); font-weight: 500; }

  .intro-card { flex: 1 1 320px; border: 1px dashed var(--border); border-top: 4px solid var(--rust); border-radius: 20px; padding: 16px 20px; background: var(--surface); }
  .intro-card p { margin: 5px 0; font-size: 0.92rem; }
  .intro-card .blank { color: var(--brand-ink); font-weight: 600; }

  .bar { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--ink-faint); border-radius: 4px; transition: width 0.5s cubic-bezier(.2,.8,.2,1); }
  .bar[data-state="green"] > span { background: var(--green); }
  .bar[data-state="gold"] > span { background: var(--gold); }
  .bar[data-state="rust"] > span { background: var(--rust); }

  /* --- Accordion sections (unit page: ლექსიკონი/გრამატიკა/დიალოგები/სავარჯიშოები) --- */
  .accordion { --accent-color: var(--brand); --accent-soft: var(--brand-soft); border: 1px solid var(--border); border-left: 3px solid var(--accent-color); border-radius: 20px; background: var(--surface); margin: 0 0 10px; overflow: hidden; transition: border-color 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 2px 8px var(--shadow); }
  .accordion[data-color="info"] { --accent-color: var(--info); --accent-soft: var(--info-soft); }
  .accordion[data-color="cyan"] { --accent-color: var(--cyan); --accent-soft: var(--cyan-soft); }
  .accordion[data-color="violet"] { --accent-color: var(--violet); --accent-soft: var(--violet-soft); }
  .accordion[data-color="gold"] { --accent-color: var(--gold); --accent-soft: var(--gold-soft); }
  .accordion.open { border-color: var(--accent-color); }
  .accordion-header {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: none; border: none; cursor: pointer; text-align: left; font-family: inherit; color: var(--ink);
  }
  .accordion-header:hover { background: var(--paper); }
  .accordion-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; flex: 1 1 auto; }
  .accordion-icon { font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); flex-shrink: 0; transition: background 0.2s ease, color 0.2s ease; }
  .accordion.open .accordion-icon { background: var(--accent-color); color: #ffffff; }
  .accordion-meta { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .ring { position: relative; display: inline-block; width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto; background: conic-gradient(var(--ring-color, var(--brand)) calc(var(--pct, 0) * 1%), var(--border) 0); transition: background 0.4s ease; }
  .ring-hole { position: absolute; inset: 3px; border-radius: 50%; background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .accordion-header:hover .ring-hole { background: var(--surface); }
  .ring-label { font-size: 0.56rem; font-weight: 700; color: var(--ink); }
  .accordion-chevron { color: var(--ink-faint); font-size: 0.78rem; transition: transform 0.2s ease; flex: 0 0 auto; }
  .accordion.open .accordion-chevron { transform: rotate(180deg); }
  .accordion-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
  .accordion-body > .accordion-body-inner { overflow: hidden; }
  .accordion.open .accordion-body { grid-template-rows: 1fr; }
  .accordion-body-inner { padding: 0 14px; }
  .accordion.open .accordion-body-inner { padding: 0 14px 14px; }

  /* --- Deck / topic pickers --- */
  .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .picker-card { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 11px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 3px var(--shadow); transition: border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease; }
  .picker-card:hover { border-color: var(--brand); transform: translateY(-2px); }
  .picker-card .ka { font-weight: 600; font-size: 1rem; }
  .picker-card .en { font-size: 0.8rem; color: var(--ink-faint); }
  .picker-card .meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }

  /* --- Item picker (full list of exercises/cards, click to jump directly) --- */
  .item-picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-bottom: 10px; width: 100%; }
  .item-picker-card {
    position: relative; border: 1.5px solid var(--border); background: var(--surface); border-radius: 16px;
    padding: 12px 8px 10px; text-align: center; cursor: pointer; font-weight: 600; font-size: 0.82rem;
    color: var(--ink-soft); transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .item-picker-card:hover { border-color: var(--brand); transform: translateY(-2px); }
  .item-picker-card:active { transform: scale(0.95); }
  .item-picker-num {
    display: flex; align-items: center; justify-content: center; margin: 0 auto 4px;
    width: 20px; height: 20px; border-radius: 6px; font-family: 'Noto Sans Georgian', sans-serif;
    font-size: 0.72rem; font-weight: 700; background: var(--accent-a-soft); color: var(--accent-a-ink);
  }
  .item-picker-card:nth-child(3n+2) .item-picker-num { background: var(--accent-b-soft); color: var(--accent-b-ink); }
  .item-picker-card:nth-child(3n+3) .item-picker-num { background: var(--accent-c-soft); color: var(--accent-c-ink); }
  .item-picker-card.status-correct { border-color: var(--green); background: var(--green-soft); }
  .item-picker-card.status-wrong { border-color: var(--rust); background: var(--rust-soft); }
  .item-picker-card.status-partial { border-color: var(--gold); background: var(--gold-soft); }
  .item-picker-status { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; background: var(--surface); border: 1px solid var(--border); color: var(--ink-faint); }
  .item-picker-card.status-correct .item-picker-status { background: var(--green); color: #fff; border-color: var(--green); }
  .item-picker-card.status-wrong .item-picker-status { background: var(--rust); color: #fff; border-color: var(--rust); }
  .item-picker-card.status-partial .item-picker-status { background: var(--gold); color: #fff; border-color: var(--gold); }
  .item-picker-wide-section { width: 100%; }

  /* --- Unit section tabs (single always-visible nav for lex/grammar/dialogue/reading on a unit page) --- */
  .unit-section-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .unit-section-tab {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1 1 140px;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, padding 0.15s ease, font-size 0.15s ease;
  }
  .unit-section-tab:hover { border-color: var(--brand); }
  .unit-section-tab.active {
    background: var(--brand-gradient); border-color: transparent; color: #fff;
    font-size: 1rem; padding: 10px 20px; font-weight: 800;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  }

  .back-link {
    background: var(--surface); border: 1.5px solid var(--border); color: var(--ink);
    font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 999px;
    padding: 8px 16px; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease; box-shadow: 0 2px 6px var(--shadow);
  }
  .back-link:hover { border-color: var(--info); color: var(--info); transform: translateX(-2px); }
  .back-link:active { transform: scale(0.96); }

  /* --- Flashcards --- */
  .card-stage { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .flip-wrap { width: min(420px, 100%); aspect-ratio: 3 / 2; perspective: 1400px; }
  .flip-card { position: relative; width: 100%; height: 100%; cursor: pointer; transition: transform 0.5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: var(--surface); box-shadow: 0 10px 26px var(--shadow); }
  .face.back { transform: rotateY(180deg); background: var(--brand-soft); }
  .face .word { font-family: 'Noto Sans Georgian', sans-serif; font-size: clamp(1.4rem, 4vw, 2rem); color: var(--ink); }
  /* the English word and its speak button sit on one row -- both tap targets
     speak the word and stop the click from reaching the card's flip handler */
  .face .word-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .face .word-row .word { cursor: pointer; }
  .face .word-row .word:active { color: var(--brand-ink); }
  .card-speak-btn { width: 32px; height: 32px; font-size: 0.9rem; }
  /* once flipped, the front face is turned away -- make sure its word/🔊 tap
     targets can't still swallow taps meant for flipping the card back */
  .flip-card.flipped .face.front { pointer-events: none; }
  .face .ipa { color: var(--ink-faint); font-size: 0.92rem; margin-top: 4px; }
  .face .ka { font-family: 'Noto Sans Georgian', sans-serif; font-size: clamp(1.3rem, 3.6vw, 1.8rem); color: var(--brand-ink); }
  .face .example { margin-top: 10px; font-size: 0.85rem; color: var(--ink-soft); max-width: 32ch; }
  .face .tap-hint { position: absolute; bottom: 10px; font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }

  .rate-row { display: flex; gap: 10px; }
  .rate-btn { border: 1px solid var(--border); background: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: border-color 0.15s ease, transform 0.1s ease; }
  .rate-btn .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .rate-btn[data-level="rust"] .swatch { background: var(--rust); }
  .rate-btn[data-level="gold"] .swatch { background: var(--gold); }
  .rate-btn[data-level="green"] .swatch { background: var(--green); }
  .rate-btn:hover { border-color: var(--ink-faint); transform: translateY(-1px); }
  .rate-btn.chosen[data-level="rust"] { background: var(--rust-soft); border-color: var(--rust); }
  .rate-btn.chosen[data-level="gold"] { background: var(--gold-soft); border-color: var(--gold); }
  .rate-btn.chosen[data-level="green"] { background: var(--green-soft); border-color: var(--green); }
  .rate-btn.chosen { animation: popIn 0.25s ease; }

  .deck-nav { display: flex; align-items: center; gap: 14px; }
  .nav-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; transition: border-color 0.15s ease, transform 0.1s ease; }
  .nav-btn:hover { border-color: var(--info); transform: scale(1.06); }
  .deck-count { font-size: 0.85rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  /* --- Quiz --- */
  .quiz-box { border: 1px solid var(--border); border-radius: 16px; padding: 22px clamp(16px, 4vw, 28px); background: var(--surface); max-width: 640px; margin: 0 auto; box-shadow: 0 1px 3px var(--shadow); }
  .quiz-progress { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .quiz-prompt { font-size: 1.08rem; line-height: 1.55; margin: 6px 0 16px; }
  .quiz-prompt .blank-marker { border-bottom: 2px solid var(--ink-faint); padding: 0 6px; }
  /* dialogue translate items only -- the English prompt line + its own replay button */
  .quiz-prompt-speak-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .answer-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .answer-input { flex: 1 1 220px; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 1rem; font-family: inherit; }
  .answer-input:focus { border-color: var(--brand); }
  /* the typed answer itself turns green or red once it is checked; opacity and
     -webkit-text-fill-color keep the colour on a disabled field (iOS greys it out) */
  .answer-input.is-correct { border-color: var(--green); background: var(--green-soft); color: var(--green-ink); -webkit-text-fill-color: var(--green-ink); opacity: 1; }
  .answer-input.is-wrong { border-color: var(--rust); background: var(--rust-soft); color: var(--rust); -webkit-text-fill-color: var(--rust); opacity: 1; }
  .check-btn {
    border: none; background: var(--brand-gradient); color: #fff; padding: 12px 22px; border-radius: 11px;
    font-weight: 700; cursor: pointer; font-size: 0.92rem; box-shadow: 0 4px 0 var(--brand-ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }
  .check-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--brand-ink); }
  .check-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-ink); }
  .feedback { margin-top: 16px; display: none; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .feedback.show { display: flex; }
  .feedback.correct { animation: popIn 0.35s ease; }
  .feedback.wrong { animation: shake 0.4s ease; }
  .feedback .mark { width: 30px; height: 30px; flex-shrink: 0; position: relative; }
  .feedback .msg { font-size: 0.94rem; padding-top: 3px; }
  .feedback .msg .hand { font-size: 1.25rem; }
  .feedback.correct .msg { color: var(--green-ink); }
  .feedback.wrong .msg { color: var(--rust); }
  .feedback .correct-answer { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 0.88rem; }
  /* the full, correctly-filled-in sentence + its replay button -- always on
     its own line below the mark/message row (flex-basis: 100% forces the
     wrap inside .feedback's flex-wrap row) */
  .quiz-sentence-row { flex: 1 0 100%; display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .quiz-sentence-text { flex: 1; font-size: 0.92rem; color: var(--ink); }
  .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .skip-btn { background: none; border: none; color: var(--ink-faint); font-size: 0.82rem; cursor: pointer; text-decoration: underline; }
  .next-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.88rem; display: none; transition: border-color 0.15s ease; }
  .next-btn:hover { border-color: var(--info); }
  .next-btn.show { display: inline-block; }

  .quiz-done { text-align: center; padding: 30px 10px; position: relative; }
  .quiz-done .big-confetti { position: absolute; top: 30%; left: 50%; }
  .quiz-done .score { font-family: 'Noto Sans Georgian', sans-serif; font-size: 2.4rem; color: var(--brand-ink); }
  .redo-btn { margin-top: 16px; border: 1px solid var(--border); background: var(--surface); padding: 9px 18px; border-radius: 11px; cursor: pointer; font-weight: 600; transition: border-color 0.15s ease; }
  .redo-btn:hover { border-color: var(--info); }

  /* --- Reference --- */
  .ref-search { width: 100%; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--paper); color: var(--ink); font-size: 0.98rem; margin-bottom: 20px; }
  .ref-search:focus { border-color: var(--brand); }
  .ref-group { margin-bottom: 24px; }
  .ref-group h3 { font-size: 1rem; color: var(--brand-ink); margin-bottom: 10px; }
  .ref-grammar-results { margin-bottom: 24px; }
  .ref-grammar-results h3 { font-size: 1rem; color: var(--brand-ink); margin-bottom: 10px; }
  .ref-grammar-result-title { font-weight: 700; color: var(--violet); margin-bottom: 4px; font-size: 0.92rem; }
  .ref-grammar-result-excerpt {
    margin: 0 0 14px; color: var(--ink); font-size: 0.88rem; line-height: 1.55;
    background: var(--violet-soft); border-left: 3px solid var(--violet); border-radius: 12px; padding: 10px 14px;
  }
  .topic-heading-accent { color: var(--brand-ink); margin-bottom: 6px; }
  .commenters-wrap { margin: 6px 0 4px; display: flex; flex-direction: column; gap: 10px; }
  .commenter-block { background: var(--gold-soft); border-left: 3px solid var(--gold); border-radius: 14px; padding: 12px 16px; }
  .commenter-name { font-weight: 700; color: var(--accent-pink); font-family: 'Noto Sans Georgian', sans-serif; font-size: 1rem; margin-bottom: 4px; }
  .commenter-text { margin: 0; color: var(--ink); font-size: 0.92rem; line-height: 1.6; max-width: 64ch; }
  .commenters-instruction { color: var(--ink-soft); font-style: italic; font-size: 0.85rem; margin: 10px 0 18px; }
  .topic-heading-warm { color: var(--accent-orange); margin-bottom: 6px; }
  .grammar-sections-wrap { margin: 6px 0 18px; display: flex; flex-direction: column; gap: 12px; }
  .grammar-intro-text { margin: 0; color: var(--ink); font-size: 0.92rem; line-height: 1.6; max-width: 64ch; }
  .grammar-block { background: var(--gold-soft); border-left: 3px solid var(--gold); border-radius: 14px; padding: 12px 16px; }
  .grammar-block-label { font-weight: 700; color: var(--ink); font-family: 'Noto Sans Georgian', sans-serif; font-size: 0.95rem; margin-bottom: 4px; }
  .grammar-block p { margin: 0; color: var(--ink); font-size: 0.92rem; line-height: 1.6; max-width: 64ch; }
  .pronoun-word { font-weight: 700; color: var(--accent-pink); }
  .topic-heading-violet { color: var(--violet); margin-bottom: 6px; }
  .grammar-note-card { background: var(--violet-soft); border-left: 3px solid var(--violet); border-radius: 14px; padding: 12px 16px; margin: 6px 0 18px; }
  .grammar-note-card p { margin: 0; color: var(--ink); font-size: 0.92rem; line-height: 1.6; max-width: 64ch; }
  .ref-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .ref-table tr { border-bottom: 1px solid var(--border); transition: background 0.15s ease; }
  .ref-table tr:nth-child(even) { background: var(--paper); }
  .ref-table tr:hover { background: var(--info-soft); }
  .ref-table td { padding: 9px 10px; vertical-align: top; }
  .ref-table td.en { font-weight: 700; color: var(--ink); width: 40%; }
  .ref-table td.ipa { color: var(--ink-faint); font-size: 0.8rem; font-style: italic; width: 22%; }
  .ref-table td.ka { color: var(--info); font-weight: 600; }
  .ref-table tr.hide { display: none; }
  .ref-empty { color: var(--ink-faint); font-size: 0.9rem; padding: 10px 0; }

  .note { font-family: 'Noto Sans Georgian', sans-serif; font-size: 1.15rem; color: var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 10px 16px; display: inline-block; margin: 14px 0 0; transform: rotate(-1deg); }

  /* --- Unit dashboard header ("Calm Focus" design) --- */
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes fillA { from { stroke-dashoffset: 35; } to { stroke-dashoffset: var(--off); } }
  @keyframes pulseRing { 0% { transform: scale(0.9); opacity: 0.55; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes popIn2 { 0% { transform: scale(0.7); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  .dash-card { position: relative; z-index: 1; margin: 8px 0 0; }
  .dash-header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; animation: fadeSlide 0.5s ease-out; }
  .dash-avatar { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; overflow: hidden; box-shadow: 0 4px 10px var(--shadow); }
  .dash-avatar svg { width: 100%; height: 100%; display: block; }
  .dash-avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dash-welcome { margin: 0; font-family: 'Noto Sans Georgian', sans-serif; font-size: 1.19rem; color: var(--brand-ink); }
  .dash-subtitle { margin: 2px 0 0; font-size: 0.78rem; color: var(--ink-soft); }

  .dash-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .dash-stat { background: var(--info-soft); border-radius: 18px; padding: 4px 10px; text-align: center; animation: fadeSlide 0.5s ease-out both; box-shadow: 0 2px 8px var(--shadow); }
  .dash-stats .dash-stat:nth-child(1) { animation-delay: 0.05s; }
  .dash-stats .dash-stat:nth-child(2) { animation-delay: 0.1s; }
  .dash-stats .dash-stat:nth-child(3) { animation-delay: 0.15s; }
  .dash-stat-icon { margin: 0 auto 2px; position: relative; height: 14px; display: flex; align-items: center; justify-content: center; }
  .dash-streak-icon { width: 11px; height: 14px; background: var(--brand); clip-path: polygon(50% 0%, 100% 60%, 80% 100%, 20% 100%, 0% 60%); animation: pulseSoft 2.6s ease-in-out infinite; position: relative; z-index: 1; }
  .dash-streak-icon::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%; background: var(--brand-soft);
    z-index: -1; animation: pulseRing 2.6s ease-out infinite;
  }
  .dash-star-icon { width: 10px; height: 10px; background: var(--info); transform: rotate(45deg); border-radius: 2px; }
  .dash-ring-wrap { display: flex; align-items: center; justify-content: center; }
  .dash-stat-value { margin: 0; font-weight: 800; font-size: 1.125rem; line-height: 1; color: var(--ink); }
  .dash-stat-label { margin: 0; font-size: 0.625rem; line-height: 1.1; color: var(--ink-soft); }
  @media (max-width: 420px) { .dash-stats { grid-template-columns: 1fr; } }

  .progress-overview { background: var(--brand-soft); border-radius: 18px; padding: 9px 9px 10px; margin: 4px 0 12px; }
  .progress-overview-title { font-weight: 700; font-size: 0.76rem; color: var(--brand-ink); margin-bottom: 6px; }
  .type-progress-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 8px; }
  .type-progress-tile { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 5px 5px; min-width: 0; }
  .type-progress-label { display: flex; align-items: center; gap: 3px; font-size: 0.62rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
  .type-progress-label .icon { font-size: 0.7rem; }
  .type-progress-tile .bar { margin-bottom: 3px; height: 3px; }
  .type-progress-count { font-size: 0.6rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .type-progress-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
    .type-progress-tile { min-height: 3.6rem; }
  }

  .activity-card { background: var(--surface); border-radius: 12px; padding: 7px 8px; }
  .activity-title { font-weight: 700; font-size: 0.76rem; color: var(--ink); margin-bottom: 6px; }
  .activity-row { display: flex; gap: 5px; justify-content: space-between; }
  .activity-day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.64rem; color: var(--ink-faint); flex: 1 1 0; }
  .activity-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); border: 2px solid transparent; }
  .activity-day.active .activity-dot { background: var(--brand); }
  .activity-day.today .activity-dot { border-color: var(--gold); }
  .activity-day.today { color: var(--ink); font-weight: 700; }

  .dash-chat-btn { display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px 14px; font-size: 0.85rem; margin: 0; }

  /* --- Vocabulary practice modes --- */
  .mode-card-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 12px; max-width: 360px; }
  .mode-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); border-radius: 12px; padding: 10px 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer; text-align: center; aspect-ratio: 1 / 1; box-shadow: 0 1px 3px var(--shadow); transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease; }
  .mode-card:hover { border-color: var(--brand); transform: translateY(-1px); box-shadow: 0 4px 12px var(--shadow); }
  .mode-card.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .mode-card-icon { color: var(--brand); }
  .mode-card-icon svg { width: 26px; height: 26px; display: block; }
  .mode-card.active .mode-card-icon { color: var(--surface); }
  .mode-card-label { line-height: 1.2; }

  .practice-box { border: 1px solid var(--border); border-radius: 16px; padding: 26px clamp(16px, 4vw, 30px); background: var(--surface); max-width: 560px; margin: 0 auto; text-align: center; box-shadow: 0 1px 3px var(--shadow); }
  .practice-progress { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .practice-box .bar { margin-bottom: 22px; }
  .practice-prompt-ka, .practice-prompt-en { font-family: 'Noto Sans Georgian', sans-serif; font-size: clamp(1.6rem, 5vw, 2.2rem); color: var(--ink); margin-bottom: 20px; }
  .practice-prompt-en { margin-bottom: 6px; }
  .practice-ipa { color: var(--ink-faint); font-size: 0.92rem; margin-bottom: 16px; }

  .practice-mic-btn { width: 76px; height: 76px; border-radius: 50%; border: none; background: var(--brand-gradient); color: #fff; font-size: 1.8rem; cursor: pointer; box-shadow: 0 10px 26px var(--shadow); transition: background 0.15s ease, transform 0.1s ease; margin-bottom: 14px; }
  .practice-mic-btn:hover { background: var(--brand-ink); transform: scale(1.04); }

  .practice-status { font-size: 0.86rem; font-weight: 600; color: var(--ink-faint); min-height: 1.2em; margin: 8px 0; display: none; align-items: center; justify-content: center; }
  .practice-status.show { display: flex; }
  .practice-status.state-listening { color: var(--green-ink); }
  .practice-status.state-processing { color: var(--gold); }
  .practice-status.state-speaking { color: var(--green-ink); }

  .mc-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 18px 0 6px; }
  .mc-option { border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); padding: 13px 14px; border-radius: 14px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease; }
  .mc-option:hover { border-color: var(--brand); }
  .mc-option.correct { background: var(--green-soft); border-color: var(--green); color: var(--green-ink); animation: popIn 0.3s ease; }
  .mc-option.wrong { background: var(--rust-soft); border-color: var(--rust); color: var(--rust); animation: shake 0.4s ease; }

  /* --- Animations --- */
  @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 65% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Confetti burst (plays once on correct answers) --- */
  .confetti-burst { position: absolute; inset: 0; pointer-events: none; }
  .confetti-piece { position: absolute; top: 50%; left: 50%; font-size: 13px; opacity: 0; animation: confettiPop 0.4s ease-out forwards; }
  .confetti-piece.c0 { color: var(--green); --tx: -24px; --ty: -18px; animation-delay: 0s; }
  .confetti-piece.c1 { color: var(--gold); --tx: 22px; --ty: -24px; animation-delay: 0.03s; }
  .confetti-piece.c2 { color: var(--info); --tx: -16px; --ty: -32px; animation-delay: 0.06s; }
  .confetti-piece.c3 { color: var(--rust); --tx: 26px; --ty: -6px; animation-delay: 0.02s; }
  .confetti-piece.c4 { color: var(--gold); --tx: -28px; --ty: -4px; animation-delay: 0.08s; }
  .confetti-piece.c5 { color: var(--green); --tx: 10px; --ty: -34px; animation-delay: 0.05s; }
  @keyframes confettiPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(180deg); }
  }

  /* --- Playful hover/press feedback on interactive elements --- */
  .picker-card:active, .mode-card:active, .mc-option:active, .rate-btn:active,
  .accordion-header:active, .tab:active, .redo-btn:active, .chat-send-btn:active, .chat-mic-btn:active {
    transform: scale(0.96);
  }
  .mc-option { position: relative; }
  .mc-option:hover { transform: translateY(-1px) scale(1.02); }
  .mode-card:active { transform: scale(0.94); }

  /* --- Friendly illustrations --- */
  .illustration { display: block; flex-shrink: 0; }
  .home-illustration { position: relative; z-index: 1; display: flex; justify-content: center; margin: 0 0 18px; }
  .home-illustration svg { width: 88px; height: 62px; }

  /* --- Bold hero card (Home page) --- */
  .hero-card {
    position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 20px;
    background: var(--brand-gradient);
    border-radius: 28px; padding: clamp(20px, 4vw, 30px) clamp(20px, 4vw, 32px);
    margin-bottom: 26px; overflow: hidden; box-shadow: 0 18px 36px var(--shadow); color: #ffffff;
  }
  .hero-card-text { position: relative; z-index: 1; max-width: 56ch; }
  .hero-eyebrow { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.85; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
  .hero-title { font-family: 'Noto Sans Georgian', sans-serif; font-size: clamp(1.25rem, 3vw, 1.7rem); font-weight: 700; color: #ffffff; margin-bottom: 8px; }
  .hero-sub { font-size: 0.88rem; opacity: 0.92; line-height: 1.5; }
  .hero-illustration { position: relative; z-index: 1; flex-shrink: 0; width: clamp(110px, 18vw, 150px); height: clamp(110px, 18vw, 150px); animation: heroFloat 5s ease-in-out infinite; }
  .hero-illustration svg { width: 100%; height: 100%; display: block; }
  @keyframes heroFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (max-width: 560px) { .hero-card { flex-wrap: wrap; } .hero-illustration { margin: 0 auto; } }

  /* --- Friendly person illustrations --- */
  .home-person-deco { display: flex; justify-content: center; margin: 0 0 20px; }
  .person-illus { width: 120px; height: 128px; animation: heroFloat 5s ease-in-out infinite; }
  .person-illus svg { width: 100%; height: 100%; display: block; }

  .progress-overview-title { display: flex; align-items: center; gap: 8px; }
  .progress-overview-title svg { width: 30px; height: 30px; }

  /* --- Unit-complete celebration badge --- */
  .complete-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--gold-soft); color: var(--gold); border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 700; font-size: 0.85rem; margin-top: 10px; animation: popIn2 0.6s ease-out; }
  .complete-badge svg { width: 26px; height: 26px; }
  @keyframes badgeIn { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

  /* --- Entrance animations --- */
  @keyframes viewFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .view.active { animation: viewFadeIn 0.35s ease; }
  @keyframes cardFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .picker-grid .picker-card, .mode-card-row .mode-card, .type-progress-grid .type-progress-tile {
    animation: cardFadeIn 0.35s ease both;
  }
  .picker-grid .picker-card:nth-child(1), .mode-card-row .mode-card:nth-child(1), .type-progress-grid .type-progress-tile:nth-child(1) { animation-delay: 0.02s; }
  .picker-grid .picker-card:nth-child(2), .mode-card-row .mode-card:nth-child(2), .type-progress-grid .type-progress-tile:nth-child(2) { animation-delay: 0.06s; }
  .picker-grid .picker-card:nth-child(3), .mode-card-row .mode-card:nth-child(3), .type-progress-grid .type-progress-tile:nth-child(3) { animation-delay: 0.1s; }
  .picker-grid .picker-card:nth-child(4), .mode-card-row .mode-card:nth-child(4), .type-progress-grid .type-progress-tile:nth-child(4) { animation-delay: 0.14s; }
  .picker-grid .picker-card:nth-child(5), .type-progress-grid .type-progress-tile:nth-child(5) { animation-delay: 0.18s; }
  .picker-grid .picker-card:nth-child(6), .type-progress-grid .type-progress-tile:nth-child(6) { animation-delay: 0.22s; }
  .picker-grid .picker-card:nth-child(n+7), .type-progress-grid .type-progress-tile:nth-child(n+7) { animation-delay: 0.24s; }
  .accordion { animation: cardFadeIn 0.3s ease both; }

  /* --- Stronger hover lift for cards --- */
  .picker-card:hover { box-shadow: 0 10px 20px var(--shadow); }
  .accordion-header:hover { box-shadow: inset 0 0 0 1px var(--border); }
  .type-progress-tile { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .type-progress-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 16px var(--shadow); }
  .activity-card, .id-card, .intro-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .id-card:hover, .intro-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px var(--shadow); }

  /* --- Big celebration burst (deck/topic fully completed) --- */
  .big-confetti { position: absolute; top: 30%; left: 50%; width: 0; height: 0; pointer-events: none; }
  .big-confetti .confetti-piece { font-size: 18px; animation-duration: 0.7s; }

  /* --- Chat tab --- */

  /* --- password field show/hide toggle (in-field, right-aligned icon) --- */
  .password-field-wrap { position: relative; display: flex; align-items: stretch; }
  .password-field-wrap input { padding-right: 44px !important; }
  .password-toggle-btn {
    position: absolute; right: 0; top: 0; height: 100%; min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; font-size: 1.05rem; color: var(--ink-soft); padding: 0;
  }
  .password-toggle-btn:hover { color: var(--brand); }

  .chat-topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .chat-scope-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--brand-soft); color: var(--brand-ink); border-radius: 999px; padding: 5px 12px 5px 14px; font-size: 0.82rem; font-weight: 600; }
  .chat-scope-badge button { background: none; border: none; color: var(--brand-ink); cursor: pointer; font-size: 0.95rem; line-height: 1; padding: 0; }

  .chat-error { background: var(--rust-soft); border: 1px solid var(--rust); color: var(--rust); border-radius: 10px; padding: 10px 14px; font-size: 0.88rem; margin-bottom: 14px; }

  .chat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chat-chip { border: 1px solid var(--border); background: var(--paper); color: var(--ink-soft); border-radius: 999px; padding: 7px 14px; font-size: 0.85rem; cursor: pointer; font-family: inherit; transition: border-color 0.15s ease, color 0.15s ease; }
  .chat-chip:hover { border-color: var(--brand); color: var(--brand-ink); }

  .chat-mode-row { border: 1px dashed var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 16px; background: var(--brand-soft); }
  .chat-mode-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--brand-ink); margin-bottom: 8px; }
  .chat-unit-chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .chat-messages { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
  .chat-msg { display: flex; animation: msgIn 0.25s ease; }
  .chat-msg.user { justify-content: flex-end; }
  .chat-msg.assistant { justify-content: flex-start; flex-direction: column; align-items: flex-start; }
  .chat-bubble-row { display: flex; align-items: flex-end; gap: 6px; max-width: 88%; }
  .chat-bubble { padding: 12px 16px; font-size: 0.95rem; line-height: 1.5; }
  .chat-msg.assistant .chat-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 8px 22px 22px 22px; box-shadow: 0 2px 8px var(--shadow); }
  .chat-msg.user .chat-bubble { background: var(--brand); color: #fff; border-radius: 22px 8px 22px 22px; }
  .chat-correction { max-width: 82%; margin-top: 6px; padding: 10px 14px; background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 14px; font-size: 0.86rem; color: var(--ink); animation: popIn 0.3s ease; }
  .chat-correction .label { font-family: 'Noto Sans Georgian', sans-serif; font-weight: 600; color: var(--gold); font-size: 1.1rem; margin-right: 4px; }
  .chat-speak-btn { background: none; border: 1px solid var(--border); border-radius: 50%; width: 30px; height: 30px; font-size: 0.85rem; cursor: pointer; color: var(--ink-soft); flex: none; transition: border-color 0.15s ease; }
  .chat-speak-btn:hover { border-color: var(--info); }

  .chat-typing { display: flex; gap: 4px; padding: 14px 16px; }
  .chat-typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); animation: typingBounce 1.2s infinite ease-in-out; }
  .chat-typing span:nth-child(2) { animation-delay: 0.15s; }
  .chat-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .chat-input-bar { display: flex; gap: 8px; align-items: flex-end; }
  .chat-input-bar textarea { flex: 1; resize: none; padding: 12px 16px; border-radius: 18px; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-family: 'Noto Sans Georgian', sans-serif; font-size: 0.95rem; max-height: 120px; box-shadow: 0 2px 8px var(--shadow); }
  .chat-input-bar textarea:focus { border-color: var(--brand); }
  .chat-send-btn { background: var(--brand-gradient); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.1rem; cursor: pointer; flex: none; box-shadow: 0 2px 8px var(--shadow); transition: background 0.15s ease, transform 0.1s ease; }
  .chat-send-btn:hover { background: var(--brand-ink); transform: translateY(-1px); }
  .chat-send-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
  .chat-mic-btn { background: var(--surface); color: var(--ink-soft); border: 1px solid var(--border); border-radius: 50%; width: 44px; height: 44px; font-size: 1.05rem; cursor: pointer; flex: none; box-shadow: 0 2px 8px var(--shadow); transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease; }
  .chat-mic-btn:hover { border-color: var(--info); }
  .chat-mic-btn.voice-active { background: var(--info-soft); border-color: var(--info); color: var(--info); }
  .chat-mic-btn.recording { background: var(--rust-soft); border-color: var(--rust); color: var(--rust); animation: micPulse 1.2s infinite; }
  @keyframes micPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(168, 67, 43, 0.35); } 50% { box-shadow: 0 0 0 8px rgba(168, 67, 43, 0); } }

  .chat-voice-status { font-size: 0.85rem; font-weight: 600; padding: 6px 2px 2px; display: none; align-items: center; gap: 6px; }
  .chat-voice-status.show { display: flex; }
  .chat-voice-status.state-listening { color: var(--green-ink); }
  .chat-voice-status.state-processing { color: var(--gold); }
  .chat-voice-status.state-speaking { color: var(--green-ink); }
  .chat-voice-status .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: statusPulse 1s infinite ease-in-out; }
  @keyframes statusPulse { 0%, 100% { opacity: 0.4; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }

  /* --- Auth gate (Supabase email/password) --- */
  .auth-gate-root { width: 100%; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .auth-gate-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 26px; box-shadow: 0 18px 40px var(--shadow), 0 2px 0 var(--border);
    padding: 32px 28px;
  }
  .auth-gate-title { font-size: 1.2rem; color: var(--brand-ink); margin-bottom: 4px; }
  .auth-gate-sub { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 20px; }
  .auth-gate-tabs { display: flex; gap: 6px; background: var(--paper); border-radius: 14px; padding: 4px; margin-bottom: 18px; }
  .auth-gate-tab { flex: 1; border: none; background: none; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; color: var(--ink-soft); cursor: pointer; }
  .auth-gate-tab.active { background: var(--brand-gradient); color: #fff; }
  .auth-gate-field { margin-bottom: 14px; }
  .auth-gate-field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
  .auth-gate-field input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-family: inherit; font-size: 0.92rem; }
  .auth-gate-field input:focus { border-color: var(--brand); }
  .auth-gate-submit { width: 100%; border: none; background: var(--brand-gradient); color: #fff; padding: 12px 22px; border-radius: 11px; font-weight: 700; cursor: pointer; font-size: 0.92rem; box-shadow: 0 4px 0 var(--brand-ink); margin-top: 4px; }
  .auth-gate-submit:disabled { opacity: 0.6; cursor: default; }
  .auth-gate-remember { display: flex; align-items: center; gap: 8px; margin: 2px 0 16px; font-size: 0.85rem; color: var(--ink-soft); cursor: pointer; }
  .auth-gate-remember input { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
  .auth-gate-msg { font-size: 0.82rem; margin-top: 12px; line-height: 1.5; }
  .auth-gate-msg.error { color: var(--rust); }
  .auth-gate-msg.info { color: var(--green-ink); }

  @media (max-width: 640px) {
    .notebook-body { flex-direction: column; }
    .tabs { flex-direction: row; flex-wrap: wrap; padding-top: 0; margin-bottom: 10px; }
    .tab { border-radius: 16px; border-right: 1px solid var(--border); margin-right: 0; box-shadow: none; }
    .tab.active { transform: none; }

  /* ---------- card-record helpers (Spaced Repetition groundwork) ----------
     state.cards[deckId][mode][idx] used to be a plain "green"/"gold"/"rust"
     string. It's now { lastResult, attempts, correctCount, lastAttemptDate }
     so a future scheduler has data to read -- attempts/correctCount/
     lastAttemptDate aren't consumed by anything yet. cardLastResult() reads
     either shape (so mastery/color code doesn't care which one it sees, and
     doesn't need to assume migration already ran); applyCardResult() always
     writes the new shape, carrying forward any existing attempts/correctCount. */
  function cardLastResult(rec) {
    if (rec == null) return rec;
    return typeof rec === "object" ? rec.lastResult : rec;
  }
  function migrateCardRecord(rec) {
    if (rec == null || typeof rec !== "string") return rec;
    return { lastResult: rec, attempts: 1, correctCount: rec === "green" ? 1 : 0, lastAttemptDate: null };
  }
  function migrateCardsFormat(cardsObj) {
    if (!cardsObj) return cardsObj;
    Object.keys(cardsObj).forEach(function (deckId) {
      var modes = cardsObj[deckId] || {};
      Object.keys(modes).forEach(function (mode) {
        var ratings = modes[mode] || {};
        Object.keys(ratings).forEach(function (idx) {
          ratings[idx] = migrateCardRecord(ratings[idx]);
        });
      });
    });
    return cardsObj;
  }
  function applyCardResult(prevRec, lastResult) {
    var attempts = (prevRec && typeof prevRec === "object" && prevRec.attempts) || 0;
    var correctCount = (prevRec && typeof prevRec === "object" && prevRec.correctCount) || 0;
    return {
      lastResult: lastResult,
      attempts: attempts + 1,
      correctCount: correctCount + (lastResult === "green" ? 1 : 0),
      lastAttemptDate: new Date().toISOString()
    };
  }

  function loadStateFromLocalStorage() {
    var s;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      s = raw ? JSON.parse(raw) : { cards: {}, quiz: {} };
    } catch (e) { s = { cards: {}, quiz: {} }; }
    if (!s.cards) s.cards = {};
    if (!s.quiz) s.quiz = {};
    if (!s.activity) s.activity = {};
    if (!s.daily) s.daily = {};
    /* migrate pre-existing flat {idx: level} per-deck records (before practice
       modes tracked separately) into the "flip" sub-record. */
    Object.keys(s.cards).forEach(function (deckId) {
      var rec = s.cards[deckId];
      var isOldFlat = false;
      for (var k in rec) {
        if (CARD_MODES.indexOf(k) === -1) { isOldFlat = true; break; }
      }
      if (isOldFlat) s.cards[deckId] = { flip: rec };
    });
    s.cards = migrateCardsFormat(s.cards);
    return s;
  }

  /* loadState() returns a Promise now, so it can consult Supabase (user_progress)
     when a session exists, falling back to localStorage otherwise. Only called
     from showApp(user), i.e. after the Supabase auth session is confirmed. */
  function loadState() {
    if (!currentAuthUser) {
      return Promise.resolve(loadStateFromLocalStorage());
    }
    return supabaseClient.from("user_progress").select("*").eq("user_id", currentAuthUser.id).maybeSingle()
      .then(function (res) {
        if (res.error) return loadStateFromLocalStorage();
        if (res.data) {
          return {
            cards: migrateCardsFormat(res.data.cards || {}),
            quiz: res.data.quiz || {},
            activity: res.data.activity || {},
            daily: res.data.daily || {}
          };
        }
        /* no row yet for this user (first time with this table) -- seed from
           whatever progress already exists locally on this device/browser. */
        return loadStateFromLocalStorage();
      })
      .catch(function () {
        return loadStateFromLocalStorage();
      });

  function dateKeyOf(d) {
    var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = "0" + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = "0" + dd;
    return d.getFullYear() + "-" + mm + "-" + dd;
  }
  function computeStreak() {
    var activity = state.activity || {};
    var day = new Date();
    if (!activity[dateKeyOf(day)]) day.setDate(day.getDate() - 1);
    var streak = 0;
    while (activity[dateKeyOf(day)]) {
      streak++;
      day.setDate(day.getDate() - 1);
    }
    return streak;
  }
  var supabaseSaveTimer = null;
  function saveState() {
    if (!state.activity) state.activity = {};
    state.activity[dateKeyOf(new Date())] = true;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}

    if (currentAuthUser) {
      if (supabaseSaveTimer) clearTimeout(supabaseSaveTimer);
      supabaseSaveTimer = setTimeout(function () {
        supabaseClient.from("user_progress").upsert({

  /* ---------- mastery helpers ---------- */
  function deckMastery(deck, mode) {
    var ratings = (state.cards[deck.id] || {})[mode || "flip"] || {};
    var total = deck.cards.length, rated = 0, green = 0;
    for (var i = 0; i < total; i++) {
      var lvl = cardLastResult(ratings[i]);
      if (lvl) { rated++; if (lvl === "green") green++; }
    }
    var pct = total ? green / total : 0;
    var colorState = rated === 0 ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { rated: rated, total: total, green: green, pct: pct, colorState: colorState };
  }
  function deckAllModesMastery(deck) {
    var sum = 0, any = false;
    CARD_MODES.forEach(function (m) {
      var dm = deckMastery(deck, m);
      sum += dm.pct;
      if (dm.rated) any = true;
    });
    var pct = sum / CARD_MODES.length;
    var colorState = !any ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState, rated: any };
  }
  function topicMastery(topic) {
    var rec = state.quiz[topic.id] || { answers: {} };
    var total = topic.items.length, attempted = 0, correct = 0;
    for (var i = 0; i < total; i++) {
      var a = rec.answers[i];
      if (a !== undefined) { attempted++; if (a) correct++; }
    }
    var pct = total ? correct / total : 0;
    var colorState = attempted === 0 ? "none" : pct >= 0.75 ? "green" : pct >= 0.4 ? "gold" : "rust";
    return { attempted: attempted, total: total, correct: correct, pct: pct, colorState: colorState };
  }
  function overallMastery(list, fn) {
    var sum = 0, cnt = 0, anyAttempt = false;
    list.forEach(function (x) {
      var m = fn(x);
      sum += m.pct; cnt++;
      if ((m.rated || m.attempted)) anyAttempt = true;
    });
    var pct = cnt ? sum / cnt : 0;
    var colorState = !anyAttempt ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState };
  }

  function unitDecks(unit) { return DECKS.filter(function (d) { return unit.deckIds.indexOf(d.id) !== -1; }); }
  /* in the unit's own order (grammarIds), so the first topic of a section is the one the unit lists first */
  function unitGrammarTopics(unit) {
    return unit.grammarIds.map(function (id) {
      return GRAMMAR.filter(function (g) { return g.id === id; })[0];
    }).filter(function (g) { return g; });
  }
  function unitTopicsByKind(unit, kind) { return unitGrammarTopics(unit).filter(function (g) { return g.kind === kind; }); }

  function unitMastery(unit) {
    var parts = unitDecks(unit).map(deckAllModesMastery).concat(unitGrammarTopics(unit).map(topicMastery));
    var sum = 0, cnt = parts.length, any = false;
    parts.forEach(function (m) { sum += m.pct; if (m.rated || m.attempted) any = true; });
    var pct = cnt ? sum / cnt : 0;
    var colorState = !any ? "none" : pct >= 0.75 ? "green" : pct >= 0.35 ? "gold" : "rust";
    return { pct: pct, colorState: colorState };
  }

  function unitProgressCounts(unit) {
    var done = 0, total = 0;
    CARD_MODES.forEach(function (mode) {
      unitDecks(unit).forEach(function (d) { var m = deckMastery(d, mode); done += m.green; total += m.total; });
    });
    unitGrammarTopics(unit).forEach(function (t) { var m = topicMastery(t); done += m.correct; total += m.total; });
    return { done: done, total: total };
  }

    var today = new Date();
    var dow = today.getDay();
    var mondayOffset = dow === 0 ? -6 : 1 - dow;
    var monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() + mondayOffset);
    var todayKey = dateKeyOf(today);

    wrap.appendChild(el("div", { class: "activity-title" }, [document.createTextNode("🔥 დღიური აქტივობა")]));
    var row = el("div", { class: "activity-row" });
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
      var key = dateKeyOf(d);
      var active = !!(state.activity && state.activity[key]);
      var isToday = key === todayKey;
      var cell = el("div", { class: "activity-day" + (active ? " active" : "") + (isToday ? " today" : "") }, [
        el("span", { class: "activity-dot" }),
        document.createTextNode(dayLabels[i])

  function openDeckFlip(id) { cardsMode = "flip"; openDeck(id); }
  function backToDecks() { stopPracticeMic(); cardsSub = null; renderCardsView(); }
  function openPracticeItem(idx) { practicePos = idx; practiceListOpen = false; if (cardsMode === "flip") { cardIndex[cardsSub] = idx; } renderCardsView(); }
  function backToPracticeList() { practiceListOpen = true; renderCardsView(); }

  /* ---------- unit section tabs (single always-visible nav bar on a unit page) ---------- */
  var UNIT_SECTION_DEFS = [
    { key: "lex", icon: "📖", label: "ლექსიკონი" },
    { key: "grammar", icon: "📐", label: "გრამატიკა" },
    { key: "dialogue", icon: "💬", label: "დიალოგები" },
    { key: "reading", icon: "✏️", label: "ტექსტები" }
  ];

  /* always true: every unit shows the same four sections. One the textbook
     photos don't cover yet opens on a short "not added yet" note instead. */
  function unitSectionAvailable(unit, key) {
    return true;
  }

  function gotoUnitSection(unit, key) {
    unitActiveSection = key;
    cardsSub = null;
    grammarSub = null;
    document.getElementById("view-cards").classList.toggle("active", key === "lex");
    document.getElementById("view-grammar").classList.toggle("active", key === "grammar" || key === "dialogue" || key === "reading");
    /* Every section of every unit opens the same way Unit 1's do: straight
       into its first word set / topic (heading + exercise list). A unit with
       more than one set or topic reaches the others through the back link,
       exactly like Unit 1's dialogues. */
    if (key === "lex") {
      var decks = unitDecks(unit);
      if (decks.length) { openDeckFlip(decks[0].id); renderGrammarView(); renderHome(); return; }
    } else if (key === "grammar" || key === "dialogue" || key === "reading") {
      var topics = unitTopicsByKind(unit, key);
      if (topics.length) { openTopic(topics[0].id); renderCardsView(); renderHome(); return; }
    }
    renderCardsView();
    renderGrammarView();
    renderHome();
  }

  function renderUnitSectionTabs(unit, activeKey) {
    var wrap = el("div", { class: "unit-section-tabs" });
    UNIT_SECTION_DEFS.forEach(function (s) {
      if (!unitSectionAvailable(unit, s.key)) return;
      var btn = el("button", { class: "unit-section-tab" + (s.key === activeKey ? " active" : ""), type: "button" }, [
        el("span", {}, [document.createTextNode(s.icon)]),
        document.createTextNode(s.label)

      btn.addEventListener("click", function (key) { return function () { gotoUnitSection(unit, key); }; }(s.key));

  function renderCardsView() {
    var root = document.getElementById("view-cards");
    root.innerHTML = "";
    if (unitActiveSection !== "lex") return;

      var unit = currentUnitObj();

      if (unitDecks(unit).length > 1) {

       browser's own speechSynthesis, called straight out of the tap so iOS Safari
       accepts it as a user gesture, and both stopPropagation() so that tapping
       them never flips the card -- flipping stays on the rest of the face. */
    function speakThisWord(e) {

        /* show the choice for a moment, then move on to the next card */
        Array.prototype.forEach.call(rateRow.children, function (other) { other.classList.toggle("chosen", other === b); });
        setTimeout(function () {
          if (cardsSub !== deck.id || (cardIndex[deck.id] || 0) !== idx) return; /* the learner already went elsewhere */
          cardIndex[deck.id] = (idx + 1) % total;
          renderCardsView();
        }, 350);
      });
      rateRow.appendChild(b);
    });
    stage.appendChild(rateRow);

    root.appendChild(stage);
  }

  /* ---------- vocabulary practice: shared helpers ---------- */
  function shuffleArr(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pickDistractors(deck, correctIdx, count) {
    var pool = [];
    deck.cards.forEach(function (c, i) { if (i !== correctIdx && c.ka) pool.push(c); });
    pool = shuffleArr(pool);
    var picked = pool.slice(0, count);
    if (picked.length < count) {
      var extra = [];
      unitDecks(currentUnitObj()).forEach(function (d) { if (d.id !== deck.id) d.cards.forEach(function (c) { if (c.ka) extra.push(c); }); });
      extra = shuffleArr(extra);
      while (picked.length < count && extra.length) picked.push(extra.pop());
    }
    return picked;
  }

  /* ---------- vocabulary practice: text-to-speech ---------- */
  function hasVoiceForLang(prefix) {
    if (!window.speechSynthesis) return false;
    var voices = window.speechSynthesis.getVoices() || [];
    var re = new RegExp("^" + prefix, "i");
    return voices.some(function (v) { return re.test(v.lang); });
  }

  function speakPracticeText(text, lang, onEnd) {
    if (!window.speechSynthesis) { if (onEnd) onEnd(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    u.rate = 0.9;
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    window.speechSynthesis.speak(u);
  }

  /* speaks several pieces of English text back to back, in order. Unlike
     speakPracticeText() this does NOT cancel() between pieces -- queuing
     several speak() calls without a cancel() in between is how the browser's
     own speechSynthesis plays them one after another instead of cutting the
     first one off. Used for "the correct answer is X" followed by the full
     corrected sentence. */
  /* each item is either a plain string (spoken en-US, the common case) or
     { text, lang } for a different voice -- used for reading a Georgian
     translation back in a ka voice when the device has one. */
  function speakPracticeSequence(items) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    items.forEach(function (item) {
      var text = typeof item === "string" ? item : item.text;
      var lang = typeof item === "string" ? "en-US" : (item.lang || "en-US");
      if (!text) return;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    });
  }

  /* true if the text contains Georgian script -- used to tell whether a quiz
     item's answer is an English phrase (safe to read in an en-US voice) or a
     Georgian translation (needs a ka voice, or must be skipped). */
  function textIsGeorgian(s) {
    return /[Ⴀ-ჿ]/.test(s || "");
  }

  /* ---------- dialogue translate items: shown Georgian -> answered in English ----------
     The lesson data stores these as English prompt + Georgian answer
     ("თარგმნე ქართულად"). The learner practises them the other way round:
     the Georgian phrase is shown and the English one has to be typed. Several
     English phrases in a topic can share one Georgian meaning ("როგორ ხარ?" is
     How are you? / How are you doing? / What's up?), so every English phrase
     whose Georgian overlaps is accepted, and all of them are shown as the
     correct answer. Items of any other shape are returned unchanged. */
  function georgianMeanings(text) {
    return String(text || "").split("/").map(function (part) { return normalize(part.trim()); }).filter(function (part) { return part; });
  }

  function reversedTranslateItem(topic, item) {
    var isTranslate = topic.kind === "dialogue" && item.prompt.indexOf("___") === -1;
    if (!isTranslate || textIsGeorgian(item.prompt) || !textIsGeorgian(item.answer)) return item;
    var meanings = georgianMeanings(item.answer);
    var english = [item.prompt];
    topic.items.forEach(function (other) {
      if (other === item || other.prompt.indexOf("___") !== -1 || textIsGeorgian(other.prompt)) return;
      var shared = georgianMeanings(other.answer).some(function (m) { return meanings.indexOf(m) !== -1; });
      if (shared && english.indexOf(other.prompt) === -1) english.push(other.prompt);
    });
    return {
      prompt: item.answer,
      instruction: "თარგმნე ინგლისურად.",
      answer: item.prompt,
      accept: english.slice(1),
      answerAll: english.join(" / "),
      looseMatch: true
    };
  }

  /* for typed English phrases: ignore punctuation and treat common short
     forms as their long forms, so "I'm good" matches "I am good" */
  function looseEnglish(text) {
    return normalize(text)
      /* short forms typed without the apostrophe, as phone keyboards often do */
      .replace(/\b(ca|wo|do|does|did|is|are|was|were|could|would|should|have|has)nt\b/g, "$1n't")
      .replace(/\bim\b/g, "i'm").replace(/\b(what|how|that|there|who|where)s\b/g, "$1's")
      .replace(/\bcan't\b/g, "can not").replace(/\bcannot\b/g, "can not").replace(/\bwon't\b/g, "will not")
      .replace(/n't\b/g, " not").replace(/\bi'm\b/g, "i am").replace(/'re\b/g, " are")
      .replace(/\b(what|how|it|that|he|she|there|who|where)'s\b/g, "$1 is")
      .replace(/'ve\b/g, " have").replace(/'ll\b/g, " will")
      .replace(/[.,!?;:'"]/g, "").replace(/\s+/g, " ").trim();
  }

  function markAnswerInput(input, ok) {
    input.classList.remove("is-correct", "is-wrong");
    input.classList.add(ok ? "is-correct" : "is-wrong");
  }

  function answerMatches(item, typed) {
    var clean = item.looseMatch ? looseEnglish : normalize;
    return [item.answer].concat(item.accept || []).map(clean).indexOf(clean(typed)) !== -1;
  }

  /* ---------- quiz items (grammar / dialogue / reading): fill-in-the-blank sentence ----------
     item.prompt holds one or more "___" markers; item.answer is what belongs
     there. Builds the complete, correct English sentence by replacing the
     span from the first "___" to the last one with the answer (this also
     covers the one quiz item that uses two "___" markers for a single
     multi-word answer) and strips a trailing "(hint words)" parenthetical --
     that's an exercise hint, never part of the actual sentence.
     Prompts with no "___" at all (true/false reading-comprehension items,
     and the "თარგმნე ქართულად" dialogue items where item.answer is Georgian,
     not English) are returned unchanged -- item.prompt there already IS the
     complete English sentence, and it's never correct to read item.answer in
     an en-US voice for those. */
  function fillBlankSentence(prompt, answerText) {
    var firstIdx = prompt.indexOf("___");
    if (firstIdx === -1) return prompt;
    var lastIdx = prompt.lastIndexOf("___");
    var sentence = prompt.slice(0, firstIdx) + answerText + prompt.slice(lastIdx + 3);
    return sentence.replace(/\s*\([^)]*\)\s*$/, "").replace(/[ \t]{2,}/g, " ").trim();
  }

  /* ---------- vocabulary practice: mic (independent from the chat mic) ---------- */
  var practiceMicStream = null;
  var practiceRecorder = null;
  var practiceChunks = [];
  var practiceSilenceInterval = null;
  var practiceAudioCtx = null;

  function ensurePracticeMic() {
    if (practiceMicStream && practiceMicStream.getAudioTracks().some(function (t) { return t.readyState === "live"; })) {
      return Promise.resolve(practiceMicStream);
    }
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      practiceMicStream = stream;
      return stream;
    });
  }

  function stopPracticeMic() {
    stopPracticeSilenceWatcher();
    if (practiceRecorder && practiceRecorder.state === "recording") { try { practiceRecorder.stop(); } catch (e) {} }
    if (practiceMicStream) { practiceMicStream.getTracks().forEach(function (t) { t.stop(); }); practiceMicStream = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function startPracticeSilenceWatcher(stream, onSilence) {
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      practiceAudioCtx = new AudioContextClass();
      var source = practiceAudioCtx.createMediaStreamSource(stream);
      var analyserNode = practiceAudioCtx.createAnalyser();
      analyserNode.fftSize = 512;
      var data = new Uint8Array(analyserNode.frequencyBinCount);
      source.connect(analyserNode);
      var hasSpoken = false, lastLoud = Date.now(), start = Date.now();
      var MIN_RECORD_MS = 700;
      practiceSilenceInterval = setInterval(function () {
        analyserNode.getByteTimeDomainData(data);
        var sum = 0;
        for (var i = 0; i < data.length; i++) { var v = data[i] - 128; sum += v * v; }
        var rms = Math.sqrt(sum / data.length);
        var now = Date.now();
        if (now - start < MIN_RECORD_MS) return;
        if (rms > 14) { hasSpoken = true; lastLoud = now; }
        if (hasSpoken && (now - lastLoud) > 3200) { onSilence(); return; }
        if ((now - start) > 25000) { onSilence(); }
      }, 150);
    } catch (e) {}
  }
  function stopPracticeSilenceWatcher() {
    if (practiceSilenceInterval) { clearInterval(practiceSilenceInterval); practiceSilenceInterval = null; }
    if (practiceAudioCtx) { try { practiceAudioCtx.close(); } catch (e) {} practiceAudioCtx = null; }
  }

  function recordPracticeUtterance(stream, onDone) {
    var mimeType = pickRecorderMimeType();
    try {
      practiceRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
    } catch (e) {
      showPracticeNotice("ჩაწერის შეცდომა: " + e.message);
      return;
    }
    practiceChunks = [];
    practiceRecorder.addEventListener("dataavailable", function (e) {
      if (e.data && e.data.size > 0) practiceChunks.push(e.data);
    });
    practiceRecorder.addEventListener("stop", function () {
      stopPracticeSilenceWatcher();
      var base = baseMimeType(practiceRecorder.mimeType || mimeType) || "audio/webm";
      var blob = new Blob(practiceChunks, { type: base });
      onDone(blob);
    });
    practiceRecorder.start();
    startPracticeSilenceWatcher(stream, function () {
      if (practiceRecorder && practiceRecorder.state === "recording") practiceRecorder.stop();
    });
  }

  function showPracticeNotice(msg) {
    var n = document.getElementById("practiceNotice");
    if (n) { n.textContent = msg; n.style.display = "block"; }

  function hidePracticeNotice() {

  function setPracticeStatus(state, label) {

    var micBtn = el("button", { class: "practice-mic-btn", id: "practiceMicBtn", type: "button", title: "პასუხის თქმა" }, [document.createTextNode("🎙")]);

    function listenForAnswer() {

            evaluateVoiceAnswer(deck, item, heard);
          });

        setPracticeStatus("", "");

    function evaluateVoiceAnswer(deck, item, heard) {
      var accepted = [item.en].concat(item.accept || []).map(normalize);

      markPracticeResult(deck, practicePos, ok, "voice");
      var fb = document.getElementById("practiceFeedback");
      if (fb) {
        fb.className = "feedback show " + (ok ? "correct" : "wrong");
        fb.innerHTML = markWithConfetti(ok) + "<span class='msg'>" +
          (ok
            ? "<span class='hand'>ზუსტად ასეა!</span> — გავიგონე: \"" + chatEscapeHtml(heard) + "\""
            : "<span class='hand'>თითქმის!</span><span class='correct-answer'>გავიგონე: \"" + chatEscapeHtml(heard) + "\" — სწორი პასუხია: " + item.en + "</span>") +
          "</span>";
      }
      if (ok) {
        setPracticeStatus("speaking", "პასუხობს...");
        speakPracticeText(item.en, "en-US", function () { practicePos++; renderCardsView(); });
      } else {
        setPracticeStatus("speaking", "სწორი პასუხი...");
        speakPracticeText("Not quite. The correct answer is: " + item.en, "en-US", function () {
          askAgain();
        });
